const QUESTIONS = [{"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 1", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2, 3]\ny = [2, 4, 6]\nplt.plot(x, y)\nprint('x개수:', len(x))\nprint('마지막y:', y[-1])", "answer": "x개수: 3\n마지막y: 6", "explain": "x는 3개이고 y의 마지막 값은 6입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 2", "code": "import matplotlib.pyplot as plt\n\nlabels = ['A', 'B']\nvalues = [5, 7]\nplt.bar(labels, values)\nprint('막대수:', len(labels))\nprint('합계:', sum(values))", "answer": "막대수: 2\n합계: 12", "explain": "막대는 2개이고 값의 합은 12입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 3", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2]\ny = [10, 20]\nplt.scatter(x, y)\nprint('점개수:', len(x))\nprint('두번째점:', x[1], y[1])", "answer": "점개수: 2\n두번째점: 2 20", "explain": "산점도 점은 2개이고 두 번째 점은 (2,20)입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 4", "code": "import matplotlib.pyplot as plt\n\ndata = [1, 1, 2, 3]\nplt.hist(data)\nprint('자료수:', len(data))\nprint('최댓값:', max(data))", "answer": "자료수: 4\n최댓값: 3", "explain": "자료는 4개이고 최댓값은 3입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 5", "code": "import matplotlib.pyplot as plt\n\nsizes = [30, 70]\nplt.pie(sizes)\nprint('조각수:', len(sizes))\nprint('전체:', sum(sizes))", "answer": "조각수: 2\n전체: 100", "explain": "원그래프 조각은 2개이고 합은 100입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 6", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2], [3, 4])\nplt.title('Test')\nprint('제목:', 'Test')\nprint('선개수:', 1)", "answer": "제목: Test\n선개수: 1", "explain": "그래프 제목을 Test로 지정했습니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 7", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2], [1, 4])\nplt.xlabel('시간')\nplt.ylabel('거리')\nprint('x축:', '시간')\nprint('y축:', '거리')", "answer": "x축: 시간\ny축: 거리", "explain": "x축 이름은 시간, y축 이름은 거리입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 8", "code": "import matplotlib.pyplot as plt\n\ny = [3, 9, 5]\nplt.plot(y)\nprint('최댓값:', max(y))\nprint('최대위치:', y.index(max(y)))", "answer": "최댓값: 9\n최대위치: 1", "explain": "최댓값 9는 인덱스 1에 있습니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 9", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2, 3])\nplt.grid(True)\nprint('grid:', True)\nprint('자료수:', 3)", "answer": "grid: True\n자료수: 3", "explain": "grid를 True로 설정했고 자료 수는 3입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 10", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2], [2, 3], label='A')\nplt.legend()\nprint('범례:', 'A')\nprint('끝값:', 3)", "answer": "범례: A\n끝값: 3", "explain": "범례 label은 A이고 y 끝값은 3입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 11", "code": "import matplotlib.pyplot as plt\n\nx = [0, 1, 2]\ny = [0, 1, 4]\nplt.plot(x, y, marker='o')\nprint('마커:', 'o')\nprint('y합:', sum(y))", "answer": "마커: o\ny합: 5", "explain": "마커는 o이고 y 합은 0+1+4=5입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 12", "code": "import matplotlib.pyplot as plt\n\nnames = ['Kim', 'Lee', 'Park']\nscores = [80, 90, 70]\nplt.barh(names, scores)\nprint('학생수:', len(names))\nprint('최고점:', max(scores))", "answer": "학생수: 3\n최고점: 90", "explain": "수평 막대그래프 자료는 3명이고 최고점은 90입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 13", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2, 3]\ny = [3, 2, 1]\nplt.fill_between(x, y)\nprint('x범위:', min(x), max(x))\nprint('y합:', sum(y))", "answer": "x범위: 1 3\ny합: 6", "explain": "x의 최소는 1, 최대는 3이고 y합은 6입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 14", "code": "import matplotlib.pyplot as plt\n\ndata = [2, 4, 6, 8]\nplt.boxplot(data)\nprint('중앙후보:', (4+6)/2)\nprint('범위:', max(data)-min(data))", "answer": "중앙후보: 5.0\n범위: 6", "explain": "중앙값은 5.0이고 범위는 8-2=6입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 15", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2, 3]\ny = [1, 4, 9]\nplt.step(x, y)\nprint('단계수:', len(x))\nprint('마지막:', y[-1])", "answer": "단계수: 3\n마지막: 9", "explain": "step 그래프의 x 자료는 3개이고 마지막 y는 9입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 16", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2]\ny1 = [2, 4]\ny2 = [3, 6]\nplt.plot(x, y1)\nplt.plot(x, y2)\nprint('선개수:', 2)\nprint('두번째끝:', y2[-1])", "answer": "선개수: 2\n두번째끝: 6", "explain": "두 개의 선을 그리고 두 번째 선의 끝값은 6입니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 17", "code": "import matplotlib.pyplot as plt\n\nplt.figure(figsize=(4, 3))\nplt.plot([1, 2, 3])\nprint('가로:', 4)\nprint('세로:', 3)", "answer": "가로: 4\n세로: 3", "explain": "figure 크기를 4x3으로 설정했습니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 18", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2, 3]\ny = [2, 3, 5]\nplt.plot(x, y)\nplt.xlim(0, 4)\nprint('xlim왼쪽:', 0)\nprint('xlim오른쪽:', 4)", "answer": "xlim왼쪽: 0\nxlim오른쪽: 4", "explain": "x축 범위를 0부터 4까지 설정했습니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 19", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2, 3]\ny = [2, 3, 5]\nplt.plot(x, y)\nplt.ylim(0, 6)\nprint('ylim아래:', 0)\nprint('ylim위:', 6)", "answer": "ylim아래: 0\nylim위: 6", "explain": "y축 범위를 0부터 6까지 설정했습니다."}, {"cat": "기초", "sub": "matplotlib", "title": "기초 matplotlib 예제 20", "code": "import matplotlib.pyplot as plt\n\ndata = [1, 2, 2, 3, 3, 3]\nplt.hist(data, bins=3)\nprint('bins:', 3)\nprint('최빈값:', 3)", "answer": "bins: 3\n최빈값: 3", "explain": "히스토그램 구간 수는 3이고 가장 많이 나온 값은 3입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 1", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib1:\n    def run(self):\n        x = [1, 2, 3]\n        y = [2, 4, 6]\n        plt.plot(x, y)\n        print('x개수:', len(x))\n        print('마지막y:', y[-1])\n\napp = BasicMatplotlib1()\napp.run()", "answer": "x개수: 3\n마지막y: 6", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. x는 3개이고 y의 마지막 값은 6입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 2", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib2:\n    def run(self):\n        labels = ['A', 'B']\n        values = [5, 7]\n        plt.bar(labels, values)\n        print('막대수:', len(labels))\n        print('합계:', sum(values))\n\napp = BasicMatplotlib2()\napp.run()", "answer": "막대수: 2\n합계: 12", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 막대는 2개이고 값의 합은 12입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 3", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib3:\n    def run(self):\n        x = [1, 2]\n        y = [10, 20]\n        plt.scatter(x, y)\n        print('점개수:', len(x))\n        print('두번째점:', x[1], y[1])\n\napp = BasicMatplotlib3()\napp.run()", "answer": "점개수: 2\n두번째점: 2 20", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 산점도 점은 2개이고 두 번째 점은 (2,20)입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 4", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib4:\n    def run(self):\n        data = [1, 1, 2, 3]\n        plt.hist(data)\n        print('자료수:', len(data))\n        print('최댓값:', max(data))\n\napp = BasicMatplotlib4()\napp.run()", "answer": "자료수: 4\n최댓값: 3", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 자료는 4개이고 최댓값은 3입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 5", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib5:\n    def run(self):\n        sizes = [30, 70]\n        plt.pie(sizes)\n        print('조각수:', len(sizes))\n        print('전체:', sum(sizes))\n\napp = BasicMatplotlib5()\napp.run()", "answer": "조각수: 2\n전체: 100", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 원그래프 조각은 2개이고 합은 100입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 6", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib6:\n    def run(self):\n        plt.plot([1, 2], [3, 4])\n        plt.title('Test')\n        print('제목:', 'Test')\n        print('선개수:', 1)\n\napp = BasicMatplotlib6()\napp.run()", "answer": "제목: Test\n선개수: 1", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 그래프 제목을 Test로 지정했습니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 7", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib7:\n    def run(self):\n        plt.plot([1, 2], [1, 4])\n        plt.xlabel('시간')\n        plt.ylabel('거리')\n        print('x축:', '시간')\n        print('y축:', '거리')\n\napp = BasicMatplotlib7()\napp.run()", "answer": "x축: 시간\ny축: 거리", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. x축 이름은 시간, y축 이름은 거리입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 8", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib8:\n    def run(self):\n        y = [3, 9, 5]\n        plt.plot(y)\n        print('최댓값:', max(y))\n        print('최대위치:', y.index(max(y)))\n\napp = BasicMatplotlib8()\napp.run()", "answer": "최댓값: 9\n최대위치: 1", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 최댓값 9는 인덱스 1에 있습니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 9", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib9:\n    def run(self):\n        plt.plot([1, 2, 3])\n        plt.grid(True)\n        print('grid:', True)\n        print('자료수:', 3)\n\napp = BasicMatplotlib9()\napp.run()", "answer": "grid: True\n자료수: 3", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. grid를 True로 설정했고 자료 수는 3입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 10", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib10:\n    def run(self):\n        plt.plot([1, 2], [2, 3], label='A')\n        plt.legend()\n        print('범례:', 'A')\n        print('끝값:', 3)\n\napp = BasicMatplotlib10()\napp.run()", "answer": "범례: A\n끝값: 3", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 범례 label은 A이고 y 끝값은 3입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 11", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib11:\n    def run(self):\n        x = [0, 1, 2]\n        y = [0, 1, 4]\n        plt.plot(x, y, marker='o')\n        print('마커:', 'o')\n        print('y합:', sum(y))\n\napp = BasicMatplotlib11()\napp.run()", "answer": "마커: o\ny합: 5", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 마커는 o이고 y 합은 0+1+4=5입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 12", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib12:\n    def run(self):\n        names = ['Kim', 'Lee', 'Park']\n        scores = [80, 90, 70]\n        plt.barh(names, scores)\n        print('학생수:', len(names))\n        print('최고점:', max(scores))\n\napp = BasicMatplotlib12()\napp.run()", "answer": "학생수: 3\n최고점: 90", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 수평 막대그래프 자료는 3명이고 최고점은 90입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 13", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib13:\n    def run(self):\n        x = [1, 2, 3]\n        y = [3, 2, 1]\n        plt.fill_between(x, y)\n        print('x범위:', min(x), max(x))\n        print('y합:', sum(y))\n\napp = BasicMatplotlib13()\napp.run()", "answer": "x범위: 1 3\ny합: 6", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. x의 최소는 1, 최대는 3이고 y합은 6입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 14", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib14:\n    def run(self):\n        data = [2, 4, 6, 8]\n        plt.boxplot(data)\n        print('중앙후보:', (4+6)/2)\n        print('범위:', max(data)-min(data))\n\napp = BasicMatplotlib14()\napp.run()", "answer": "중앙후보: 5.0\n범위: 6", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 중앙값은 5.0이고 범위는 8-2=6입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 15", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib15:\n    def run(self):\n        x = [1, 2, 3]\n        y = [1, 4, 9]\n        plt.step(x, y)\n        print('단계수:', len(x))\n        print('마지막:', y[-1])\n\napp = BasicMatplotlib15()\napp.run()", "answer": "단계수: 3\n마지막: 9", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. step 그래프의 x 자료는 3개이고 마지막 y는 9입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 16", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib16:\n    def run(self):\n        x = [1, 2]\n        y1 = [2, 4]\n        y2 = [3, 6]\n        plt.plot(x, y1)\n        plt.plot(x, y2)\n        print('선개수:', 2)\n        print('두번째끝:', y2[-1])\n\napp = BasicMatplotlib16()\napp.run()", "answer": "선개수: 2\n두번째끝: 6", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 두 개의 선을 그리고 두 번째 선의 끝값은 6입니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 17", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib17:\n    def run(self):\n        plt.figure(figsize=(4, 3))\n        plt.plot([1, 2, 3])\n        print('가로:', 4)\n        print('세로:', 3)\n\napp = BasicMatplotlib17()\napp.run()", "answer": "가로: 4\n세로: 3", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. figure 크기를 4x3으로 설정했습니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 18", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib18:\n    def run(self):\n        x = [1, 2, 3]\n        y = [2, 3, 5]\n        plt.plot(x, y)\n        plt.xlim(0, 4)\n        print('xlim왼쪽:', 0)\n        print('xlim오른쪽:', 4)\n\napp = BasicMatplotlib18()\napp.run()", "answer": "xlim왼쪽: 0\nxlim오른쪽: 4", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. x축 범위를 0부터 4까지 설정했습니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 19", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib19:\n    def run(self):\n        x = [1, 2, 3]\n        y = [2, 3, 5]\n        plt.plot(x, y)\n        plt.ylim(0, 6)\n        print('ylim아래:', 0)\n        print('ylim위:', 6)\n\napp = BasicMatplotlib19()\napp.run()", "answer": "ylim아래: 0\nylim위: 6", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. y축 범위를 0부터 6까지 설정했습니다."}, {"cat": "기초", "sub": "matplotlib OOP", "title": "기초 matplotlib OOP 예제 20", "code": "import matplotlib.pyplot as plt\n\nclass BasicMatplotlib20:\n    def run(self):\n        data = [1, 2, 2, 3, 3, 3]\n        plt.hist(data, bins=3)\n        print('bins:', 3)\n        print('최빈값:', 3)\n\napp = BasicMatplotlib20()\napp.run()", "answer": "bins: 3\n최빈값: 3", "explain": "클래스의 run() 메서드 안에서 matplotlib 시각화 코드를 실행합니다. 히스토그램 구간 수는 3이고 가장 많이 나온 값은 3입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 1", "code": "import matplotlib.pyplot as plt\n\nmonths = [1, 2, 3, 4]\nsales = [100, 150, 130, 180]\nplt.plot(months, sales)\nprint('총매출:', sum(sales))\nprint('최고월:', months[sales.index(max(sales))])", "answer": "총매출: 560\n최고월: 4", "explain": "매출 합은 560이고 최고 매출은 4월입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 2", "code": "import matplotlib.pyplot as plt\n\nsubjects = ['국어', '수학', '영어']\nscores = [80, 95, 85]\nplt.bar(subjects, scores)\nprint('평균:', sum(scores)/len(scores))\nprint('최고과목:', subjects[scores.index(max(scores))])", "answer": "평균: 86.66666666666667\n최고과목: 수학", "explain": "평균은 260/3이고 최고 과목은 수학입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 3", "code": "import matplotlib.pyplot as plt\n\nhours = [1, 2, 3, 4]\nscores = [50, 65, 80, 95]\nplt.scatter(hours, scores)\nprint('공부시간합:', sum(hours))\nprint('점수증가:', scores[-1]-scores[0])", "answer": "공부시간합: 10\n점수증가: 45", "explain": "공부시간 합은 10이고 점수 증가는 95-50=45입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 4", "code": "import matplotlib.pyplot as plt\n\nregions = ['서울', '부산', '대구']\npop = [900, 340, 240]\nplt.bar(regions, pop)\nprint('지역수:', len(regions))\nprint('최대인구:', max(pop))", "answer": "지역수: 3\ ": "A는 10점 증가했고 전체 합은 35 증가했습니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 11", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2, 3, 4]\ny = [1, 4, 9, 16]\nplt.plot(x, y)\nprint('최종제곱:', y[-1])\nprint('x합:', sum(x))", "answer": "최종제곱: 16\nx합: 10", "explain": "4의 제곱은 16이고 x합은 10입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 12", "code": "import matplotlib.pyplot as plt\n\nclasses = ['1반', '2반']\nmid = [80, 70]\nfinal = [90, 85]\nplt.bar(classes, mid)\nplt.bar(classes, final)\nprint('1반향상:', final[0]-mid[0])\nprint('2반향상:', final[1]-mid[1])", "answer": "1반향상: 10\n2반향상: 15", "explain": "각 반의 점수 차이를 계산합니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 13", "code": "import matplotlib.pyplot as plt\n\ndata = [10, 20, 20, 30, 40]\nplt.hist(data)\nprint('자료수:', len(data))\nprint('평균:', sum(data)/len(data))", "answer": "자료수: 5\n평균: 24.0", "explain": "자료 5개의 평균은 24.0입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 14", "code": "import matplotlib.pyplot as plt\n\nx = [1, 2, 3]\ny = [10, 30, 20]\nplt.plot(x, y)\nprint('최고위치:', x[y.index(max(y))])\nprint('최저위치:', x[y.index(min(y))])", "answer": "최고위치: 2\n최저위치: 1", "explain": "최고 y=30은 x=2, 최저 y=10은 x=1입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 15", "code": "import matplotlib.pyplot as plt\n\nitems = ['책', '펜', '자']\ncounts = [5, 10, 3]\nplt.bar(items, counts)\nprint('총개수:', sum(counts))\nprint('가장많은물건:', items[counts.index(max(counts))])", "answer": "총개수: 18\n가장많은물건: 펜", "explain": "총개수는 18이고 펜이 가장 많습니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 16", "code": "import matplotlib.pyplot as plt\n\nweeks = [1, 2, 3]\nrun = [3, 5, 8]\nplt.fill_between(weeks, run)\nprint('총거리:', sum(run))\nprint('증가량:', run[-1]-run[0])", "answer": "총거리: 16\n증가량: 5", "explain": "총 거리는 16이고 증가량은 5입니다."}, {"cat": "응용", "sub": "matplotlib", "title": "응용 matplotlib 예제 17", "code": "import matplotlib.pyplot as plt\n\nsc function norm(s){
    return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");
}
function esc(s){
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function render(){
    const qbox=document.getElementById("questions");
    const nav=document.getElementById("navBtns");
    let out="", navOut="", current="";
    QUESTIONS.forEach((q,i)=>{
        const group = q.cat + " - " + q.sub;
        if(group!==current){
            current=group;
            out += `<h2>${group}</h2>`;
            navOut += `<button style="background:#0f172a;color:white;margin-top:10px" onclick="location.hash='q${i+1}'">${group}</button>`;
        }
        navOut += `<button onclick="location.hash='q${i+1}'">${i+1}번</button>`;
        out += `
        <div class="card" id="q${i+1}">
            <span class="badge">${i+1}번 · ${q.cat} · ${q.sub}</span>
            <h3>${q.title}</h3>
            <p><b>문제.</b> 다음 matplotlib 코드의 출력 결과를 쓰시오.</p>
            <pre><code>${esc(q.code)}</code></pre>
            <textarea id="ans${i}" placeholder="출력 결과를 줄 단위로 입력하세요."></textarea>
            <div id="res${i}" class="result"></div>
        </div>`;
    });
    qbox.innerHTML=out;
    nav.innerHTML=navOut;
}
function gradeAll(){
    let correct=0;
    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <div>${ok ? '<span class="correct">정답</span>' : '<span class="wrong">오답</span>'}</div>
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
    const score=Math.round(correct/QUESTIONS.length*100);
    document.getElementById("scoreBox").innerHTML =
        `총점: <b>${score}점</b> / 정답: <b>${correct}</b>개 / 전체: <b>${QUESTIONS.length}</b>문항`;
}
function showAllSolutions(){
    QUESTIONS.forEach((q,i)=>{
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
}
function downloadTxt(){
    gradeAll();
    let sid=document.getElementById("studentId").value.trim() || "학번";
    let name=document.getElementById("studentName").value.trim() || "이름";
    let now=new Date();
    let stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"_"+String(now.getHours()).padStart(2,"0")+"-"+String(now.getMinutes()).padStart(2,"0")+"-"+String(now.getSeconds()).padStart(2,"0");

    let correct=0;
    let lines=[];
    lines.push("matplotlib 데이터 시각화 서술형 평가 결과");
    lines.push("학번: "+sid);
    lines.push("이름: "+name);
    lines.push("응시시각: "+stamp);
    lines.push("");

    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        lines.push(`[${i+1}번] ${q.cat} - ${q.sub} - ${q.title} : ${ok ? "정답" : "오답"}`);
        lines.push("학생 답안:");
        lines.push(user || "(미입력)");
        lines.push("정답:");
        lines.push(q.answer);
        lines.push("상세 풀이: "+q.explain);
        lines.push("----------------------------------------");
    });
    let score=Math.round(correct/QUESTIONS.length*100);
    lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+QUESTIONS.length);

    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${sid}_${name}_matplotlib_${score}점_${stamp}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
