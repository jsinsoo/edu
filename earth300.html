<header><h1>100명의 동물이 참석하는 지속가능한 지구회의</h1><p>The Sustainable Earth Council of 100 Living Representatives</p><p>100종 × 각 3문장 = 영어 300문장 + 한글 번역 300문장</p></header>
<main class="wrap"><section class="intro"><strong>회의 원칙:</strong> 모든 대표는 자신의 서식지와 위기를 알리고, 구체적인 해결책을 주장하며, 지구를 사랑하는 마음과 공동 실천의 약속을 밝힙니다. 문장 번호와 GIF 번호가 연결됩니다.</section>
<section class="tools"><input id="q" placeholder="동물·파일명·영어·한글 검색"><select id="pick"><option value="">100종 전체</option></select><button onclick="speak('en-US')">영어 듣기</button><button onclick="speak('ko-KR')">한글 듣기</button><button onclick="speechSynthesis.cancel()">정지</button><button onclick="print()">인쇄/PDF</button><span id="count">300 / 300</span></section><section id="council"></section></main>
<footer>서로 다른 목소리 100개가 하나의 약속이 됩니다. 지구는 모든 생명의 공동 집입니다.</footer>
<script>const records=[{"number": 1, "file": "turtle01.gif", "animal": "사람", "sentences": [["We humans arrived carrying maps, machines, memories, and the responsibility created by our choices.", "우리 인간은 지도와 기계와 기억, 그리고 선택이 만든 책임을 안고 회의장에 왔습니다."], ["Human progress must respect the limits of nature and the rights of other species.", "인간의 발전은 자연의 한계와 다른 생물종의 권리를 존중해야 합니다."], ["May our clever hands become hands that heal the only home every species shares.", "우리의 영리한 손이 모든 생물이 함께 사는 단 하나의 집을 치유하는 손이 되기를 바랍니다."]]}, {"number": 2, "file": "turtle02.gif", "animal": "아프리카코끼리", "sentences": [["My great ears hear thunder beyond the savanna, yet lately the promised rain has answered less often.", "나의 커다란 귀는 초원 너머의 천둥을 듣지만, 요즘 약속했던 비는 좀처럼 대답하지 않습니다."], ["Protect our ancient migration routes and the watering holes shared by the whole savanna.", "우리의 오래된 이동 경로와 초원 전체가 함께 쓰는 물웅덩이를 보호해 주세요."], ["I treasure Earth as an elephant remembers water: across distance, hardship, and generations.", "나는 코끼리가 물을 기억하듯 거리와 고난과 세대를 넘어 지구를 소중히 기억합니다."]]}, {"number": 3, "file": "turtle03.gif", "animal": "아시아코끼리", "sentences": [["I walk old forest paths taught by grandmothers whose footprints are now cut apart by roads.", "나는 할머니들이 가르쳐 준 오래된 숲길을 걷지만, 이제 그 발자국은 도로에 의해 끊겨 있습니다."], ["Keep wildlife corridors open so elephants, farms, and villages can coexist safely.", "코끼리와 농장과 마을이 안전하게 공존하도록 생태 통로를 열어 두어야 합니다."], ["A living corridor through the forest would be the kindest bridge between our two worlds.", "숲을 잇는 살아 있는 통로는 인간과 우리 세계를 연결하는 가장 다정한 다리가 될 것입니다."]]}, {"number": 4, "file": "turtle04.gif", "animal": "기린", "sentences": [["From above the thorn trees, I can see both the last green leaves and the first signs of drought.", "가시나무 위 높은 곳에서 나는 마지막 초록 잎과 가뭄의 첫 징후를 함께 볼 수 있습니다."], ["Save tall native trees because they provide food, shade, nests, and climate protection.", "먹이와 그늘과 둥지와 기후 보호를 제공하는 키 큰 토종 나무를 지켜 주세요."], ["Every tree I nibble is also a tower of shade, nests, and hope, so I bow my long neck to Earth.", "내가 먹는 나무 한 그루는 그늘과 둥지와 희망의 탑이기도 하기에, 나는 긴 목을 숙여 지구에 감사드립니다."]]}, {"number": 5, "file": "turtle05.gif", "animal": "사자", "sentences": [["My roar is powerful, but an empty grassland can silence even a lion.", "내 포효는 힘차지만 텅 빈 초원은 사자조차 침묵하게 만듭니다."], ["Healthy predators are essential partners that keep the food web balanced.", "건강한 포식자는 먹이그물의 균형을 지키는 꼭 필요한 동반자입니다."], ["I love a planet where strength means guarding balance, not taking everything for oneself.", "나는 힘이 모든 것을 차지하는 것이 아니라 균형을 지키는 뜻이 되는 지구를 사랑합니다."]]}, {"number": 6, "file": "turtle06.gif", "animal": "호랑이", "sentences": [["Orange and black stripes hide me among trees, but no pattern can hide a disappearing forest.", "주황색과 검은 줄무늬는 나를 나무 사이에 숨겨 주지만, 어떤 무늬도 사라지는 숲을 감출 수는 없습니다."], ["Stop forest fragmentation and give large predators enough connected habitat to survive.", "산림 단절을 막고 대형 포식자가 살아갈 만큼 연결된 서식지를 보장해 주세요."], ["When a tiger still has room to roam, the forest is breathing well enough for thousands of lives.", "호랑이가 마음껏 걸을 공간이 남아 있다면 그 숲은 수천 생명을 위해 건강하게 숨 쉬고 있다는 뜻입니다."]]}, {"number": 7, "file": "turtle07.gif", "animal": "치타", "sentences": [["I was born to race the wind, not to stop at fences stitched across the horizon.", "나는 지평선을 꿰맨 울타리 앞에 멈추기 위해서가 아니라 바람과 달리기 위해 태어났습니다."], ["Connected grasslands are necessary because even the fastest animal cannot outrun habitat loss.", "가장 빠른 동물도 서식지 상실을 피할 수 없으므로 초원을 연결해야 합니다."], ["Earth is beautiful to me when speed, space, and freedom meet beneath an open sky.", "나에게 아름다운 지구는 열린 하늘 아래에서 속도와 공간과 자유가 만나는 곳입니다."]]}, {"number": 8, "file": "turtle08.gif", "animal": "표범", "sentences": [["I move like a shadow, but city lights and broken forests leave shadows nowhere to travel.", "나는 그림자처럼 움직이지만 도시의 불빛과 끊어진 숲은 그림자가 이동할 곳조차 남기지 않습니다."], ["Growing towns must preserve quiet passages where secretive wildlife can move safely.", "도시가 커져도 야생동물이 안전하게 이동할 조용한 통로를 남겨야 합니다."], ["I cherish the quiet corners of Earth where unseen lives can exist without fear.", "나는 눈에 잘 띄지 않는 생명도 두려움 없이 존재할 수 있는 지구의 조용한 구석을 사랑합니다."]]}, {"number": 9, "file": "turtle09.gif", "animal": "재규어", "sentences": [["The rainforest river reflects my spotted coat, unless mining mud turns its mirror brown.", "열대우림의 강은 내 얼룩무늬 털을 비추지만 광산의 흙탕물이 그 거울을 갈색으로 바꾸기도 합니다."], ["Keep rainforest rivers free from mercury, mining waste, and destructive development.", "열대우림의 강을 수은과 광산 폐기물과 파괴적인 개발로부터 지켜 주세요."], ["To love Earth is to let every river carry moonlight rather than poison.", "지구를 사랑한다는 것은 모든 강이 독이 아니라 달빛을 실어 나르게 하는 일입니다."]]}, {"number": 10, "file": "turtle10.gif", "animal": "얼룩말", "sentences": [["Our striped herd reads the grassland like a moving map written in rain and fresh shoots.", "우리 줄무늬 무리는 비와 새싹으로 쓰인 움직이는 지도처럼 초원을 읽습니다."], ["Remove dangerous fences from migration paths and manage grazing without exhausting the land.", "이동로의 위험한 울타리를 없애고 땅이 황폐해지지 않도록 방목해야 합니다."], ["I want future foals to inherit horizons, not a maze of wire and dust.", "나는 미래의 새끼들이 철조망과 먼지의 미로가 아니라 넓은 지평선을 물려받기를 바랍니다."]]}, {"number": 11, "file": "turtle11.gif", "animal": "하마", "sentences": [["I spend my days in water, yet a river can surround me and still be too dirty to drink.", "나는 하루를 물속에서 보내지만 강이 나를 둘러싸고 있어도 너무 더러워 마실 수 없을 때가 있습니다."], ["Clean, flowing rivers must serve wildlife, farms, and communities without being polluted.", "깨끗하게 흐르는 강을 오염시키지 않고 동물과 농장과 공동체가 함께 사용해야 합니다."], ["A clean river feels like the cool heartbeat of Earth against my skin.", "깨끗한 강은 내 피부에 닿는 지구의 시원한 심장박동처럼 느껴집니다."]]}, {"number": 12, "file": "turtle12.gif", "animal": "코뿔소", "sentences": [["My horn is not medicine or decoration; it is simply part of the face with which I meet the world.", "내 뿔은 약도 장식품도 아니며, 세상을 마주하는 내 얼굴의 한 부분일 뿐입니다."], ["End poaching and illegal horn trafficking through protection, education, and international cooperation.", "보호와 교육과 국제 협력으로 밀렵과 불법 뿔 거래를 끝내야 합니다."], ["Let Earth remember our heavy footsteps as signs of survival, never as echoes of extinction.", "지구가 우리의 묵직한 발자국을 멸종의 메아리가 아니라 생존의 증거로 기억하게 해 주세요."]]}, {"number": 13, "file": "turtle13.gif", "animal": "고릴라", "sentences": [["My family speaks with glances, touches, and patient company beneath the rainforest leaves.", "우리 가족은 열대우림 잎 아래에서 눈빛과 손길과 묵묵한 동행으로 이야기합니다."], ["Protect forests that store carbon while providing food and homes for entire families.", "탄소를 저장하면서 가족에게 먹이와 보금자리를 주는 숲을 보호해 주세요."], ["The forest is not timber around my home; the forest itself is our home and our family album.", "숲은 우리 집 주변의 목재가 아니라 집 그 자체이며 가족의 추억이 담긴 사진첩입니다."]]}, {"number": 14, "file": "turtle14.gif", "animal": "침팬지", "sentences": [["These clever fingers can open fruit and solve puzzles, so I know people can learn to repair what they break.", "과일을 열고 퍼즐을 푸는 이 영리한 손가락처럼 인간도 자신이 망가뜨린 것을 고치는 법을 배울 수 있다고 믿습니다."], ["Use fewer disposable products and repair useful objects instead of throwing them away.", "일회용품을 줄이고 쓸 만한 물건은 버리지 말고 수리해서 사용해야 합니다."], ["I love Earth most when curiosity grows into wisdom rather than waste.", "나는 호기심이 낭비가 아니라 지혜로 자라는 지구를 가장 사랑합니다."]]}, {"number": 15, "file": "turtle15.gif", "animal": "오랑우탄", "sentences": [["I swing through a green ceiling that falls whenever a careless product reaches a shopping basket.", "나는 초록빛 숲 지붕을 오가지만 무책임한 상품이 장바구니에 담길 때마다 그 지붕이 무너집니다."], ["Choose products that do not destroy rainforests or replace them with careless plantations.", "열대우림을 파괴하거나 무분별한 농장으로 바꾸지 않은 제품을 선택해 주세요."], ["Each standing rainforest tree is a strong arm holding the living world above the flood.", "서 있는 열대우림 나무 한 그루 한 그루는 생명의 세계를 홍수 위로 떠받치는 튼튼한 팔입니다."]]}, {"number": 16, "file": "turtle16.gif", "animal": "긴팔원숭이", "sentences": [["My song leaps farther than my body, crossing gaps that my arms can no longer cross.", "내 노래는 몸보다 멀리 날아가지만, 팔로는 더 이상 건널 수 없는 숲의 틈이 늘어납니다."], ["Reconnect forest canopies so tree-dwelling animals can feed, travel, and find partners.", "나무 위 동물이 먹이를 찾고 이동하고 짝을 만날 수 있도록 숲 지붕을 연결해 주세요."], ["I dream of a green roof sewn whole again, with morning songs traveling from tree to tree.", "나는 아침 노래가 나무에서 나무로 흐르는, 다시 온전히 이어진 초록 지붕을 꿈꿉니다."]]}, {"number": 17, "file": "turtle17.gif", "animal": "개코원숭이", "sentences": [["I have learned to read both the warning bark of my troop and the impatient gestures of nearby people.", "나는 무리의 경고 소리와 가까이 사는 사람들의 불편한 몸짓을 모두 읽는 법을 배웠습니다."], ["Create secure water points and manage food waste to reduce conflict with nearby communities.", "안전한 급수 시설과 음식물 쓰레기 관리로 지역사회와의 갈등을 줄여야 합니다."], ["Earth feels generous when a water place becomes a meeting point instead of a battlefield.", "물 한 곳이 싸움터가 아니라 만남의 장소가 될 때 지구는 참으로 너그럽게 느껴집니다."]]}, {"number": 18, "file": "turtle18.gif", "animal": "불곰", "sentences": [["I follow berries, salmon, and seasons, but a food smell from a careless campsite can lead me into danger.", "나는 열매와 연어와 계절을 따라가지만 부주의한 야영장의 음식 냄새는 나를 위험으로 이끌 수 있습니다."], ["Preserve seasonal feeding grounds and teach people how to store food safely in bear country.", "계절 먹이터를 지키고 곰 서식지에서 음식을 안전하게 보관하는 법을 알려 주세요."], ["I love mountains that offer wild meals and people wise enough to leave them wild.", "나는 야생의 먹이를 내어 주는 산과 그것을 야생 그대로 남길 줄 아는 현명한 사람들을 사랑합니다."]]}, {"number": 19, "file": "turtle19.gif", "animal": "북극곰", "sentences": [["The ice beneath my paws is a calendar, a hunting ground, and a road that melts earlier each year.", "내 발밑의 얼음은 달력이자 사냥터이자 길이지만 해마다 더 일찍 녹습니다."], ["Cut greenhouse gas emissions quickly because melting sea ice is removing our hunting ground.", "녹는 해빙이 사냥터를 없애고 있으므로 온실가스 배출을 빠르게 줄여야 합니다."], ["My white world may look empty, yet it is a bright page crowded with Arctic life.", "하얀 내 세상은 비어 보이지만 사실 북극 생명으로 가득 찬 밝은 책장입니다."]]}, {"number": 20, "file": "turtle20.gif", "animal": "자이언트판다", "sentences": [["I eat bamboo almost all day, which makes the loss of one bamboo valley a very serious matter.", "나는 거의 온종일 대나무를 먹기 때문에 대나무 계곡 하나의 상실도 매우 심각한 일입니다."], ["Connect and restore bamboo forests so climate change cannot isolate panda populations.", "기후변화로 판다 무리가 고립되지 않도록 대나무 숲을 연결하고 복원해 주세요."], ["I hug Earth in my heart the way my paws hold a fresh green bamboo stalk.", "나는 두 앞발로 싱싱한 대나무를 안듯 마음으로 지구를 꼭 안아 줍니다."]]}, {"number": 21, "file": "turtle21.gif", "animal": "늑대", "sentences": [["My howl does not announce evil; it gathers a family and measures the health of the wild.", "내 울음은 악을 알리는 소리가 아니라 가족을 모으고 야생의 건강을 확인하는 신호입니다."], ["Restore predators responsibly because balanced ecosystems need every level of the food web.", "균형 잡힌 생태계에는 먹이그물의 모든 단계가 필요하므로 포식자를 책임 있게 복원해야 합니다."], ["A complete Earth has room for hoofbeats, young trees, and a wolf song at dusk.", "온전한 지구에는 발굽 소리와 어린나무와 해 질 녘 늑대의 노래가 함께 자리합니다."]]}, {"number": 22, "file": "turtle22.gif", "animal": "붉은여우", "sentences": [["I patrol field edges at night, catching the rodents that poison is often used to kill.", "나는 밤마다 들판 가장자리를 돌며 사람들이 독약으로 잡으려는 설치류를 사냥합니다."], ["Reduce toxic pesticides and let natural predators help farmers control rodents.", "유독한 농약을 줄이고 자연 포식자가 농장의 설치류를 조절하게 해 주세요."], ["I adore an Earth where a red tail in the moonlight is welcomed as a farmer's ally.", "나는 달빛 속 붉은 꼬리가 농부의 동반자로 환영받는 지구를 사랑합니다."]]}, {"number": 23, "file": "turtle23.gif", "animal": "스라소니", "sentences": [["Snowshoe paws carry me over winter, but warming forests rewrite the ground beneath them.", "눈신 같은 발은 나를 겨울 위로 데려가지만 따뜻해지는 숲은 그 발밑의 땅을 다시 쓰고 있습니다."], ["Protect snowy forests and wildlife corridors for solitary animals that require wide territories.", "넓은 영역이 필요한 홀로 사는 동물을 위해 눈 덮인 숲과 생태 통로를 보호해 주세요."], ["The hush of snow is Earth's softest music, and I want it preserved for ears not yet born.", "눈 내린 숲의 고요는 지구의 가장 부드러운 음악이며 아직 태어나지 않은 귀에도 남겨 주고 싶습니다."]]}, {"number": 24, "file": "turtle24.gif", "animal": "너구리", "sentences": [["My nimble paws investigate every lid humans forget to close.", "내 재빠른 앞발은 사람들이 닫지 않은 모든 뚜껑을 살펴봅니다."], ["Use animal-proof bins and recycle properly so wildlife does not depend on human rubbish.", "야생동물이 사람의 쓰레기에 의존하지 않도록 동물이 열 수 없는 쓰레기통을 사용하고 제대로 재활용해야 합니다."], ["I would rather find crayfish in a clean stream than dinner in a plastic bag.", "나는 비닐봉지 속 저녁보다 깨끗한 시냇물의 가재를 만나고 싶습니다."]]}, {"number": 25, "file": "turtle25.gif", "animal": "스컹크", "sentences": [["I carry a powerful scent, but my true talent is quietly removing insects and mice.", "나는 강한 냄새를 지녔지만 진짜 재능은 곤충과 생쥐를 조용히 줄이는 일입니다."], ["Do not poison helpful insect eaters; prevent conflict with secure buildings and calm behavior.", "곤충을 잡는 유익한 동물을 독살하지 말고 건물을 잘 막고 침착하게 갈등을 예방해 주세요."], ["Earth is kinder when unusual neighbors are understood before they are feared.", "낯선 이웃을 두려워하기 전에 이해하는 지구가 더 다정한 지구입니다."]]}, {"number": 26, "file": "turtle26.gif", "animal": "수달", "sentences": [["When I slide into a river, my whiskers test a story written by every factory and drain upstream.", "내가 강으로 미끄러져 들어가면 수염은 상류의 공장과 배수구가 써 내려간 이야기를 감지합니다."], ["Control sewage, chemicals, and plastic so rivers become safe enough for fish and play.", "물고기와 수달이 안전하도록 하수와 화학물질과 플라스틱 오염을 관리해야 합니다."], ["A sparkling river is my playground, pantry, and favorite love letter from Earth.", "반짝이는 강은 나의 놀이터이자 식량창고이며 지구가 보낸 가장 좋아하는 사랑의 편지입니다."]]}, {"number": 27, "file": "turtle27.gif", "animal": "비버", "sentences": [["With branches and mud, I turn a narrow stream into a neighborhood full of water and wings.", "나는 나뭇가지와 진흙으로 좁은 시냇물을 물과 날개로 가득한 마을로 바꿉니다."], ["Work with natural dams because wetlands slow floods, filter water, and shelter wildlife.", "습지는 홍수를 늦추고 물을 정화하며 생물을 보호하므로 자연 댐과 조화롭게 살아야 합니다."], ["I love Earth by building patiently, one stick and one rescued wetland at a time.", "나는 나뭇가지 하나와 되살아난 습지 하나씩을 차근차근 쌓으며 지구를 사랑합니다."]]}, {"number": 28, "file": "turtle28.gif", "animal": "사슴", "sentences": [["At dusk I step from forest to meadow, never knowing whether the shining road will let me return.", "해 질 녘 숲에서 초원으로 나설 때 빛나는 도로를 무사히 돌아올 수 있을지 알 수 없습니다."], ["Build wildlife crossings and slow vehicles where roads divide feeding and breeding grounds.", "도로가 먹이터와 번식지를 나누는 곳에 생태 통로를 만들고 차량 속도를 줄여 주세요."], ["A wildlife bridge would tell me that human roads do not have to end an animal's journey.", "생태 다리는 인간의 길이 동물의 여정을 끝낼 필요가 없다고 말해 줄 것입니다."]]}, {"number": 29, "file": "turtle29.gif", "animal": "엘크", "sentences": [["My antlers rise like branches, but the real forest depends on what happens after our herd passes.", "내 뿔은 나뭇가지처럼 솟지만 진짜 숲의 운명은 우리 무리가 지나간 뒤에 달려 있습니다."], ["Maintain a balance among grazing animals, predators, rivers, and young forest trees.", "풀을 뜯는 동물과 포식자와 강과 어린나무 사이의 균형을 유지해야 합니다."], ["I honor Earth when grazing, predators, rivers, and saplings all receive their turn to grow.", "나는 풀 뜯기와 포식자와 강과 묘목 모두에게 자랄 차례가 주어지는 지구를 존중합니다."]]}, {"number": 30, "file": "turtle30.gif", "animal": "무스", "sentences": [["My long legs cross cold marshes, yet hotter summers bring ticks where snow once offered relief.", "내 긴 다리는 차가운 습지를 건너지만 더운 여름은 눈이 안식을 주던 곳까지 진드기를 데려옵니다."], ["Protect cool wetlands because rising heat and parasites increasingly threaten large northern mammals.", "더위와 기생충이 북방 대형동물을 위협하므로 서늘한 습지를 보호해 주세요."], ["I love the northern Earth for its cool water, deep shade, and patient winter silence.", "나는 시원한 물과 짙은 그늘과 참을성 있는 겨울의 침묵을 지닌 북쪽 지구를 사랑합니다."]]}, {"number": 31, "file": "turtle31.gif", "animal": "아메리카들소", "sentences": [["We once moved like a brown ocean across the prairie, stirring soil beneath a million hooves.", "우리는 한때 수백만 발굽으로 흙을 깨우며 갈색 바다처럼 대초원을 누볐습니다."], ["Restore native herds to renew prairie soil, biodiversity, and Indigenous cultural relationships.", "대초원의 흙과 생물다양성과 원주민 문화를 되살리도록 토종 들소 무리를 복원해야 합니다."], ["Restoring our herds means restoring grass, culture, memory, and a horizon alive with motion.", "우리 무리를 복원하는 일은 풀과 문화와 기억과 움직임으로 살아 있는 지평선을 되살리는 일입니다."]]}, {"number": 32, "file": "turtle32.gif", "animal": "물소", "sentences": [["Mud on my back is sunscreen, insect shield, and a reminder that wetlands are useful, not wasted land.", "등에 묻은 진흙은 자외선 차단제이자 벌레 방패이며 습지가 쓸모없는 땅이 아님을 보여 줍니다."], ["Protect wetlands and use livestock practices that conserve water, soil, and local breeds.", "물과 흙과 토종 품종을 보전하는 축산 방식으로 습지를 지켜 주세요."], ["I love the generous Earth that turns muddy water into rice, reeds, frogs, and life.", "나는 진흙물을 쌀과 갈대와 개구리와 생명으로 바꾸는 너그러운 지구를 사랑합니다."]]}, {"number": 33, "file": "turtle33.gif", "animal": "소", "sentences": [["The milk and food people receive from us carry hidden costs in grass, grain, water, and methane.", "사람들이 우리에게서 얻는 우유와 먹거리에는 풀과 곡물과 물과 메탄이라는 숨은 비용이 있습니다."], ["Improve animal welfare and reduce methane, wasted feed, and forest-clearing livestock production.", "동물복지를 높이고 메탄과 사료 낭비와 산림을 없애는 축산을 줄여야 합니다."], ["Treating land and livestock with care is how farming can thank Earth instead of exhausting it.", "땅과 가축을 세심히 돌보는 것이 농업이 지구를 지치게 하지 않고 감사하는 방법입니다."]]}, {"number": 34, "file": "turtle34.gif", "animal": "말", "sentences": [["My hooves have carried people farther than engines existed, and they still leave a different kind of track.", "내 발굽은 엔진이 생기기 전부터 사람을 멀리 데려갔으며 지금도 다른 종류의 흔적을 남깁니다."], ["Manage trails and pastures so transport and recreation do not erode soil or disturb wildlife.", "운송과 여가 활동이 흙을 침식하거나 야생동물을 방해하지 않도록 길과 목초지를 관리해 주세요."], ["I love open country where every journey respects the soil beneath it.", "나는 모든 여행이 발밑의 흙을 존중하는 열린 들판을 사랑합니다."]]}, {"number": 35, "file": "turtle35.gif", "animal": "당나귀", "sentences": [["I may look humble, but books, water, medicine, and hope have traveled on my steady back.", "나는 소박해 보이지만 책과 물과 약과 희망이 내 든든한 등을 타고 이동했습니다."], ["Support working animals with humane care while using low-carbon transport in remote places.", "외딴 지역의 저탄소 운송을 활용하되 일하는 동물을 인도적으로 돌봐 주세요."], ["A fair Earth remembers to care for the quiet workers who carry its heaviest needs.", "공정한 지구는 가장 무거운 필요를 나르는 조용한 일꾼을 돌보는 일을 잊지 않습니다."]]}, {"number": 36, "file": "turtle36.gif", "animal": "염소", "sentences": [["I can turn thorny plants into food, which is useful until too many mouths leave a hillside bare.", "나는 가시 돋친 식물도 먹이로 바꾸지만 너무 많은 입이 산비탈을 맨땅으로 만들면 문제가 됩니다."], ["Use controlled grazing because unmanaged herds can strip vegetation and accelerate erosion.", "무분별한 방목은 식생을 없애고 침식을 촉진하므로 계획적으로 풀을 뜯게 해야 합니다."], ["I love resilient Earth, so I ask grazing to follow the rhythm of regrowth.", "나는 회복력 있는 지구를 사랑하기에 방목도 풀이 다시 자라는 리듬을 따르길 바랍니다."]]}, {"number": 37, "file": "turtle37.gif", "animal": "양", "sentences": [["Warm wool begins with grass, water, patient care, and soil that must remain alive.", "따뜻한 양모는 풀과 물과 세심한 돌봄, 그리고 살아 있어야 할 흙에서 시작됩니다."], ["Choose durable wool from farms that protect soil, water, and the welfare of their flocks.", "흙과 물과 양의 복지를 지키는 농장에서 생산한 튼튼한 양모를 선택해 주세요."], ["May every sweater carry gratitude for the pasture and kindness toward the flock.", "모든 스웨터에 목초지를 향한 감사와 양 떼를 향한 친절이 함께 담기기를 바랍니다."]]}, {"number": 38, "file": "turtle38.gif", "animal": "돼지", "sentences": [["I can eat leftovers, yet that should never excuse wasteful farms or crowded, joyless lives.", "나는 남은 음식도 먹을 수 있지만 그것이 낭비적인 농장이나 비좁고 즐거움 없는 삶의 핑계가 되어서는 안 됩니다."], ["Reduce food waste and improve farm systems so animals live clean, healthy, enriched lives.", "음식물 낭비를 줄이고 돼지가 깨끗하고 건강하게 살 수 있도록 농장 환경을 개선해야 합니다."], ["I love Earth with my curious nose, and I ask humans to make every meal more responsible.", "나는 호기심 많은 코로 지구를 사랑하며 인간에게 모든 식사를 더 책임 있게 만들어 달라고 부탁합니다."]]}, {"number": 39, "file": "turtle39.gif", "animal": "개", "sentences": [["I have guarded homes, guided people, and shared firesides, so responsibility is part of our friendship.", "나는 집을 지키고 사람을 안내하며 난롯가를 함께했기에 책임은 우리 우정의 일부입니다."], ["Practice responsible guardianship, vaccination, and wildlife-safe control of free-roaming pets.", "책임 있는 돌봄과 예방접종을 실천하고 돌아다니는 반려동물이 야생동물을 해치지 않게 관리해 주세요."], ["A loving Earth keeps companions safe without allowing them to harm wild neighbors.", "사랑이 있는 지구는 반려동물을 안전하게 지키면서 야생 이웃도 해치지 않게 합니다."]]}, {"number": 40, "file": "turtle40.gif", "animal": "고양이", "sentences": [["My soft paws make me a beloved companion and a silent hunter of vulnerable wildlife.", "내 부드러운 발은 나를 사랑받는 반려동물이자 취약한 야생생물의 조용한 사냥꾼으로 만듭니다."], ["Keep pet cats safe and prevent them from hunting vulnerable birds, reptiles, and small mammals.", "반려묘를 안전하게 돌보고 취약한 새와 파충류와 작은 포유동물을 사냥하지 않게 해야 합니다."], ["I purr for a world where caring for me also means caring for every bird beyond the window.", "나는 나를 돌보는 일이 창밖의 모든 새도 돌보는 뜻이 되는 세상을 위해 가르랑거립니다."]]}, {"number": 41, "file": "turtle41.gif", "animal": "토끼", "sentences": [["A hedge may look untidy to people, but to me it is a dining room, nursery, and hidden road.", "생울타리는 사람에게 어수선해 보여도 나에게는 식당이자 아기방이자 숨은 길입니다."], ["Leave hedges and wild strips where small animals can feed, hide, and move between habitats.", "작은 동물이 먹고 숨고 이동할 수 있도록 생울타리와 야생 풀밭을 남겨 주세요."], ["I love an Earth that leaves a little wildness between every carefully planted row.", "나는 가지런히 심은 줄 사이마다 작은 야생을 남겨 두는 지구를 사랑합니다."]]}, {"number": 42, "file": "turtle42.gif", "animal": "햄스터", "sentences": [["My full cheek pouches are famous, but saving everything forever is not the lesson I offer.", "가득 찬 내 볼주머니는 유명하지만 모든 것을 끝없이 쌓아 두라는 것이 내 교훈은 아닙니다."], ["Consume only what is needed and provide every companion animal with proper lifelong care.", "필요한 만큼만 소비하고 모든 반려동물을 평생 책임 있게 돌봐 주세요."], ["Earth gives enough when we take thoughtfully and care faithfully for lives placed in our hands.", "신중히 취하고 맡겨진 생명을 끝까지 돌본다면 지구는 우리에게 충분히 내어 줍니다."]]}, {"number": 43, "file": "turtle43.gif", "animal": "다람쥐", "sentences": [["I bury more seeds than I remember, and my forgetfulness sometimes becomes tomorrow's forest.", "나는 기억할 수 있는 것보다 많은 씨앗을 묻고, 때로는 그 건망증이 내일의 숲이 됩니다."], ["Plant diverse native trees because stored seeds and healthy forests secure the future.", "저장된 씨앗과 건강한 숲이 미래를 지키므로 다양한 토종 나무를 심어 주세요."], ["I love Earth for turning small accidents into tall green possibilities.", "나는 작은 우연을 높고 푸른 가능성으로 바꾸는 지구를 사랑합니다."]]}, {"number": 44, "file": "turtle44.gif", "animal": "고슴도치", "sentences": [["A pile of fallen leaves is not rubbish when it keeps my winter heart warm.", "떨어진 낙엽 더미는 겨울의 내 심장을 따뜻하게 해 주므로 쓰레기가 아닙니다."], ["Leave leaf piles, avoid pesticides, and open small passages beneath garden fences.", "낙엽 더미를 남기고 농약을 피하며 정원 울타리 아래에 작은 통로를 만들어 주세요."], ["My dream garden has flowers, beetles, passages, and room for prickly little neighbors.", "내가 꿈꾸는 정원에는 꽃과 딱정벌레와 통로와 가시 돋친 작은 이웃의 자리가 있습니다."]]}, {"number": 45, "file": "turtle45.gif", "animal": "캥거루", "sentences": [["My powerful tail keeps me balanced, but fire, drought, and highways can unbalance an entire land.", "강한 꼬리는 내 몸의 균형을 잡아 주지만 산불과 가뭄과 고속도로는 대지 전체의 균형을 무너뜨립니다."], ["Plan for fire, roads, and drought in ways that protect both communities and native habitats.", "공동체와 토착 서식지를 모두 지키도록 산불과 도로와 가뭄에 대비해야 합니다."], ["I love Australia's wide light and want every leap to land in a living landscape.", "나는 호주의 넓은 햇빛을 사랑하며 모든 도약이 살아 있는 땅에 닿기를 바랍니다."]]}, {"number": 46, "file": "turtle46.gif", "animal": "코알라", "sentences": [["I sleep among eucalyptus leaves, unaware that the next tree may stand across a deadly road.", "나는 유칼립투스 잎 사이에서 잠들지만 다음 나무가 위험한 도로 건너편에 있을 수 있습니다."], ["Plant connected corridors of native eucalyptus and protect them from clearing and severe fire.", "토종 유칼립투스 생태 통로를 연결해 심고 벌목과 대형 산불로부터 지켜 주세요."], ["Earth smells like eucalyptus after rain, and that fragrance deserves an unbroken forest.", "비 온 뒤 지구는 유칼립투스 향이 나며 그 향기에는 끊기지 않은 숲이 어울립니다."]]}, {"number": 47, "file": "turtle47.gif", "animal": "웜뱃", "sentences": [["My burrow is an underground refuge that has welcomed unexpected guests during fire.", "내 땅굴은 산불 때 뜻밖의 손님까지 맞아들이는 지하 피난처입니다."], ["Protect deep burrows that can shelter many animals during extreme heat and wildfire.", "극심한 더위와 산불 때 여러 동물을 보호하는 깊은 굴을 지켜 주세요."], ["I love Earth below the surface, where cool soil quietly protects life from fierce heat.", "나는 서늘한 흙이 거센 더위로부터 생명을 조용히 지키는 지표 아래의 지구를 사랑합니다."]]}, {"number": 48, "file": "turtle48.gif", "animal": "나무늘보", "sentences": [["I move slowly enough to notice every branch that a hurried economy cuts down.", "나는 서두르는 경제가 베어 내는 나뭇가지 하나하나를 알아차릴 만큼 천천히 움직입니다."], ["Slow the pace of consumption and protect continuous canopies where slow animals can survive.", "소비 속도를 늦추고 느린 동물이 살아갈 수 있는 끊기지 않은 숲 지붕을 보호해 주세요."], ["The planet does not ask us to stop living; it asks us to move at a pace life can survive.", "지구는 우리에게 삶을 멈추라 하지 않고 생명이 견딜 수 있는 속도로 움직여 달라고 합니다."]]}, {"number": 49, "file": "turtle49.gif", "animal": "큰개미핥기", "sentences": [["My long snout follows ants across grass that can be erased in one uncontrolled blaze.", "내 긴 주둥이는 개미를 따라가지만 그 초원은 통제되지 않은 불 한 번에 사라질 수 있습니다."], ["Prevent uncontrolled fires and road deaths across the open landscapes we need.", "우리가 살아가는 열린 초원에서 통제되지 않은 불과 로드킬을 막아 주세요."], ["I love the intricate Earth where a tiny ant trail can sustain a giant wanderer.", "나는 작은 개미 행렬이 거대한 방랑자를 먹여 살리는 정교한 지구를 사랑합니다."]]}, {"number": 50, "file": "turtle50.gif", "animal": "아르마딜로", "sentences": [["I wear armor, but no shell can protect the soil beneath me from every bulldozer.", "나는 갑옷을 입었지만 어떤 껍질도 내 발밑의 흙을 모든 불도저에서 지켜 주지는 못합니다."], ["Protect soil and burrows while designing cool homes with local, low-energy materials.", "흙과 굴을 보호하고 지역의 저에너지 재료로 시원한 집을 만들어 주세요."], ["Earth's safest architecture begins with cool soil, local wisdom, and a place to burrow.", "지구에서 가장 안전한 건축은 서늘한 흙과 지역의 지혜와 굴을 팔 자리에서 시작됩니다."]]}, {"number": 51, "file": "turtle51.gif", "animal": "낙타", "sentences": [["My body saves water with desert precision, while human pipes still let precious drops escape.", "내 몸은 사막의 정밀함으로 물을 아끼지만 인간의 수도관에서는 소중한 물방울이 새고 있습니다."], ["Harvest rain, reuse water, and expand solar energy without damaging fragile desert habitats.", "연약한 사막 서식지를 해치지 않으면서 빗물을 모으고 물을 재사용하며 태양광을 확대해 주세요."], ["I love the desert for proving that scarcity can inspire wisdom rather than waste.", "나는 부족함이 낭비가 아니라 지혜를 낳을 수 있음을 보여 주는 사막을 사랑합니다."]]}, {"number": 52, "file": "turtle52.gif", "animal": "라마", "sentences": [["Across thin mountain air, I carry loads carefully where heavy machines would scar the trail.", "희박한 산 공기 속에서 나는 무거운 기계가 길에 상처를 낼 곳을 조심스럽게 짐을 나릅니다."], ["Support fair trade and low-impact transport that benefits mountain farmers and animals.", "산악 농민과 동물에게 도움이 되는 공정무역과 환경 부담이 적은 운송을 지원해 주세요."], ["A fair mountain economy should leave both farmers and footprints lighter.", "공정한 산악 경제는 농민의 짐과 자연에 남는 발자국을 모두 가볍게 해야 합니다."]]}, {"number": 53, "file": "turtle53.gif", "animal": "알파카", "sentences": [["My fleece holds mountain warmth, but the grass beneath it needs time to recover.", "내 털은 산의 온기를 품지만 그 아래의 풀에도 회복할 시간이 필요합니다."], ["Value durable natural fibers from farms that prevent overgrazing and respect animal welfare.", "과도한 방목을 막고 동물복지를 존중하는 농장의 튼튼한 천연 섬유를 소중히 여겨 주세요."], ["I love the Andes in every durable thread woven without exhausting land or animal.", "나는 땅과 동물을 지치게 하지 않고 짠 튼튼한 실 한 올 한 올에서 안데스를 사랑합니다."]]}, {"number": 54, "file": "turtle54.gif", "animal": "멧돼지", "sentences": [["A tempting rubbish smell can pull my family from the forest into traffic and fear.", "쓰레기의 유혹적인 냄새는 우리 가족을 숲에서 차량과 두려움 속으로 끌어냅니다."], ["Secure food waste and protect forest boundaries to reduce dangerous encounters with people.", "사람과의 위험한 만남을 줄이도록 음식물 쓰레기를 관리하고 숲의 경계를 보호해 주세요."], ["I prefer an Earth where wild food remains in forests and human food stays securely indoors.", "나는 야생의 먹이는 숲에 남고 인간의 음식은 안전하게 실내에 보관되는 지구를 원합니다."]]}, {"number": 55, "file": "turtle55.gif", "animal": "미어캣", "sentences": [["One of us watches the sky while the others eat, because survival is a shared assignment.", "우리가 먹는 동안 한 명이 하늘을 살피는 것은 생존이 공동 과제이기 때문입니다."], ["Build alert, cooperative communities where every member watches for shared risks.", "모든 구성원이 공동의 위험을 살피는 기민하고 협력적인 공동체를 만들어야 합니다."], ["I love Earth as a community project in which every small voice can sound the alarm.", "나는 작은 목소리도 위험을 알릴 수 있는 공동체 프로젝트로서의 지구를 사랑합니다."]]}, {"number": 56, "file": "turtle56.gif", "animal": "돌고래", "sentences": [["Clicks and whistles guide me through water, but engines now crowd the ocean with confusing noise.", "딸깍 소리와 휘파람은 나를 물속에서 안내하지만 이제 엔진 소음이 바다를 혼란스럽게 채웁니다."], ["Reduce plastic, boat strikes, fishing bycatch, and underwater noise in our ocean home.", "바다에서 플라스틱과 선박 충돌과 혼획과 수중 소음을 줄여 주세요."], ["A blue Earth should carry songs between families, not plastic between waves.", "푸른 지구에는 파도 사이의 플라스틱이 아니라 가족 사이의 노래가 흘러야 합니다."]]}, {"number": 57, "file": "turtle57.gif", "animal": "범고래", "sentences": [["My family learns hunting traditions from grandmothers, just as people inherit culture from elders.", "우리 가족은 사람들이 어른에게 문화를 배우듯 할머니에게 사냥의 전통을 배웁니다."], ["Restore salmon and other prey while removing persistent chemicals from marine food webs.", "연어와 다른 먹이생물을 복원하고 해양 먹이그물에서 잔류성 화학물질을 없애 주세요."], ["I love an ocean complete enough to feed memory, family, salmon, and song.", "나는 기억과 가족과 연어와 노래를 모두 먹여 살릴 만큼 온전한 바다를 사랑합니다."]]}, {"number": 58, "file": "turtle58.gif", "animal": "흰긴수염고래", "sentences": [["I am larger than any living animal, yet a fast ship can make the ocean too small for me.", "나는 살아 있는 어떤 동물보다 크지만 빠른 선박은 바다조차 내게 너무 좁게 만들 수 있습니다."], ["Slow ships, prevent entanglement, and protect the enormous whales that help cycle ocean carbon.", "선박 속도를 낮추고 그물 얽힘을 막아 해양 탄소 순환을 돕는 거대한 고래를 보호해 주세요."], ["My deep dive carries carbon through the sea, a quiet gift from a giant to Earth.", "나의 깊은 잠수는 탄소를 바다로 옮기며 거인이 지구에 보내는 조용한 선물이 됩니다."]]}, {"number": 59, "file": "turtle59.gif", "animal": "혹등고래", "sentences": [["My song crosses ocean basins, but propellers and sonar can drown its ancient route.", "내 노래는 대양을 건너지만 프로펠러와 음파탐지기는 오래된 노랫길을 덮어 버릴 수 있습니다."], ["Create quieter shipping lanes and safe migration routes between feeding and breeding grounds.", "먹이터와 번식지를 잇는 더 조용한 항로와 안전한 이동로를 만들어 주세요."], ["I love Earth in long migrations, returning faithfully between warm nurseries and rich cold seas.", "나는 따뜻한 보육장과 풍요로운 차가운 바다를 충실히 오가는 긴 이동 속에서 지구를 사랑합니다."]]}, {"number": 60, "file": "turtle60.gif", "animal": "향유고래", "sentences": [["I descend where sunlight cannot follow, guided by sound into the planet's largest darkness.", "나는 햇빛이 따라오지 못하는 곳까지 내려가 소리를 따라 지구에서 가장 큰 어둠으로 들어갑니다."], ["Keep noise, plastic, and toxic waste away from deep-diving whales and their prey.", "깊이 잠수하는 고래와 먹이생물에게서 소음과 플라스틱과 유독 폐기물을 멀리해 주세요."], ["The deep sea is Earth's hidden library, and I ask that its unread pages remain unpoisoned.", "심해는 지구의 숨은 도서관이므로 아직 읽지 못한 책장이 오염되지 않기를 바랍니다."]]}, {"number": 61, "file": "turtle61.gif", "animal": "백상아리", "sentences": [["My fin above the water has inspired fear, though my presence below it signals a functioning sea.", "물 위의 내 지느러미는 두려움을 불러왔지만 물속의 내 존재는 바다가 제대로 작동한다는 신호입니다."], ["Protect top marine predators and replace fear with science-based ocean stewardship.", "해양 최상위 포식자를 보호하고 두려움 대신 과학에 근거한 바다 관리를 실천해 주세요."], ["I love Earth without cages of fear, where knowledge gives every predator its rightful place.", "나는 두려움의 우리 없이 지식이 모든 포식자에게 정당한 자리를 주는 지구를 사랑합니다."]]}, {"number": 62, "file": "turtle62.gif", "animal": "청상아리", "sentences": [["I cross borders drawn on no ocean map and meet fishing lines that stretch farther than nations.", "나는 바다 지도에 없는 국경을 건너며 나라보다 길게 뻗은 낚싯줄을 만납니다."], ["End wasteful shark finning and reduce accidental capture on long fishing lines.", "낭비적인 지느러미 채취를 끝내고 긴 낚싯줄에 우연히 잡히는 일을 줄여 주세요."], ["The open sea belongs to no one alone, and that is exactly why everyone must care for it.", "대양은 어느 한 존재의 소유가 아니며 바로 그렇기 때문에 모두가 돌봐야 합니다."]]}, {"number": 63, "file": "turtle63.gif", "animal": "쥐가오리", "sentences": [["My broad fins fly beneath the surface while I gather meals smaller than a grain of rice.", "내 넓은 지느러미는 수면 아래를 날며 쌀알보다 작은 먹이를 모읍니다."], ["Protect plankton-rich seas and stop fishing practices that entangle gentle rays.", "플랑크톤이 풍부한 바다를 지키고 온순한 가오리를 얽히게 하는 어업을 막아 주세요."], ["I love an ocean where gentleness can grow enormous and still glide freely.", "나는 온순함이 거대하게 자라서도 자유롭게 헤엄칠 수 있는 바다를 사랑합니다."]]}, {"number": 64, "file": "turtle64.gif", "animal": "문어", "sentences": [["I taste with my arms, change my skin, and solve doors, yet machines treat my seafloor as empty ground.", "나는 팔로 맛을 보고 피부색을 바꾸며 문도 풀지만 기계는 내 해저를 빈 땅처럼 다룹니다."], ["Limit seabed destruction and respect the intelligence of animals hidden beneath the waves.", "해저 파괴를 제한하고 파도 아래 숨어 사는 지능 높은 동물을 존중해 주세요."], ["Earth's intelligence wears many bodies, and I love every surprising form it takes.", "지구의 지능은 다양한 몸을 입고 나타나며 나는 그 놀라운 모든 모습을 사랑합니다."]]}, {"number": 65, "file": "turtle65.gif", "animal": "오징어", "sentences": [["I flash through darkness as both hunter and meal, tying many ocean lives together.", "나는 사냥꾼이자 먹이로서 어둠 속을 번쩍이며 수많은 바다 생명을 연결합니다."], ["Manage fisheries carefully because squid connect predators and prey throughout the ocean.", "오징어가 바다의 포식자와 먹이를 연결하므로 어업을 신중하게 관리해 주세요."], ["I love the sea's swift silver exchanges and ask fishing to leave enough for tomorrow.", "나는 바다의 빠른 은빛 교환을 사랑하며 어업이 내일을 위해 충분히 남겨 두기를 바랍니다."]]}, {"number": 66, "file": "turtle66.gif", "animal": "해파리", "sentences": [["I have no bones, heart, or brain, yet changing seas can turn my drifting bloom into a warning.", "나는 뼈와 심장과 뇌가 없지만 변화한 바다는 떠다니는 내 무리를 경고 신호로 바꿀 수 있습니다."], ["Reduce warming, pollution, and nutrient runoff that can disturb the balance of marine life.", "해양생물의 균형을 흔드는 온난화와 오염과 영양염 유출을 줄여 주세요."], ["Even my transparent body belongs in Earth's balance, neither blamed nor allowed to dominate through pollution.", "투명한 내 몸도 지구의 균형에 속하며 비난받아서도 오염 때문에 지나치게 늘어나서도 안 됩니다."]]}, {"number": 67, "file": "turtle67.gif", "animal": "해마", "sentences": [["I hold seagrass with a curling tail because strong currents offer no second chance to something so small.", "나는 몸집이 작아 거센 물살을 다시 견디기 어려우므로 말린 꼬리로 해초를 붙잡습니다."], ["Protect shallow nurseries and end the unsustainable collection of delicate marine animals.", "얕은 바다의 보육장을 지키고 연약한 해양동물을 지속 불가능하게 채집하지 말아 주세요."], ["I love the underwater gardens where fathers carry babies and tiny lives find shelter.", "나는 아빠가 새끼를 품고 작은 생명이 숨는 물속 정원을 사랑합니다."]]}, {"number": 68, "file": "turtle68.gif", "animal": "불가사리", "sentences": [["I can regrow an arm, but a polluted tide pool cannot simply regrow an entire community.", "나는 팔을 다시 자라게 할 수 있지만 오염된 조수 웅덩이는 공동체 전체를 쉽게 되살릴 수 없습니다."], ["Keep shores clean and protect keystone species that maintain balance in tidal ecosystems.", "해안을 깨끗이 하고 조간대 생태계의 균형을 지키는 핵심종을 보호해 주세요."], ["Earth amazes me with regeneration, and that gift deserves clean shores and patient protection.", "나는 재생이라는 지구의 능력에 감탄하며 그 선물에는 깨끗한 해안과 꾸준한 보호가 필요하다고 믿습니다."]]}, {"number": 69, "file": "turtle69.gif", "animal": "게", "sentences": [["Every tunnel I dig breathes air into mud and serves a banquet to traveling birds.", "내가 파는 굴 하나하나는 진흙에 공기를 넣고 여행하는 새들에게 잔치를 제공합니다."], ["Preserve mudflats where burrowing animals recycle nutrients and feed migrating birds.", "굴을 파는 동물이 영양분을 순환시키고 철새에게 먹이를 주는 갯벌을 보전해 주세요."], ["I love the muddy margins that prove valuable worlds do not need to look tidy.", "나는 소중한 세계가 꼭 말끔해 보일 필요는 없음을 증명하는 진흙 해안을 사랑합니다."]]}, {"number": 70, "file": "turtle70.gif", "animal": "바닷가재", "sentences": [["I grow slowly beneath dark rocks, so careless harvest can empty decades in one season.", "나는 어두운 바위 아래에서 천천히 자라기에 무분별한 어획은 한 철에 수십 년을 비울 수 있습니다."], ["Set science-based catch limits and protect nursery grounds from destructive fishing gear.", "과학적인 어획 한도를 정하고 파괴적인 어구로부터 어린 개체의 서식지를 보호해 주세요."], ["A generous sea is not an endless cupboard; I love it by leaving tomorrow's share untouched.", "풍요로운 바다는 끝없는 찬장이 아니므로 나는 내일의 몫을 남겨 두며 바다를 사랑합니다."]]}, {"number": 71, "file": "turtle71.gif", "animal": "물범", "sentences": [["A loop of lost net can follow me longer than any natural predator.", "버려진 그물 고리 하나는 자연의 어떤 포식자보다 오래 나를 따라다닐 수 있습니다."], ["Protect resting beaches and sea ice while preventing entanglement in lost fishing nets.", "휴식하는 해변과 해빙을 보호하고 버려진 그물에 얽히는 일을 막아 주세요."], ["I love the meeting line of ice and sea, where resting bodies warm the cold horizon.", "나는 쉬는 몸들이 차가운 지평선에 온기를 더하는 얼음과 바다의 경계를 사랑합니다."]]}, {"number": 72, "file": "turtle72.gif", "animal": "바다사자", "sentences": [["I bark on crowded rocks, but hunger grows quiet when fish disappear or plastic fills the current.", "나는 붐비는 바위에서 짖지만 물고기가 사라지거나 해류가 플라스틱으로 차면 배고픔 속에 조용해집니다."], ["Share fish responsibly, reduce plastic, and give marine mammals safe space on shore.", "물고기를 책임 있게 나누고 플라스틱을 줄이며 해양 포유동물에게 안전한 해안 공간을 주세요."], ["Earth's coast is a shared stage, and I ask people to applaud from a respectful distance.", "지구의 해안은 공동 무대이므로 사람들은 존중하는 거리에서 박수 보내 주기를 바랍니다."]]}, {"number": 73, "file": "turtle73.gif", "animal": "펭귄", "sentences": [["My wings became flippers, perfect for water but powerless against air that warms the ice.", "내 날개는 물에 알맞은 지느러미가 되었지만 얼음을 데우는 공기 앞에서는 힘이 없습니다."], ["Cut carbon emissions and manage fisheries so penguin parents can find food near their chicks.", "펭귄 부모가 새끼 가까이에서 먹이를 찾도록 탄소 배출을 줄이고 어업을 관리해 주세요."], ["I love the comic shuffle of my colony and the serious ocean that feeds every chick.", "나는 무리의 익살스러운 뒤뚱걸음과 모든 새끼를 먹이는 진지한 바다를 함께 사랑합니다."]]}, {"number": 74, "file": "turtle74.gif", "animal": "흰머리수리", "sentences": [["My return from poisoned silence proved that laws can give a species its sky back.", "독으로 인한 침묵에서 돌아온 나는 법이 한 생물종에게 하늘을 되돌려 줄 수 있음을 증명했습니다."], ["Keep waterways free of persistent toxins and protect large trees along healthy rivers.", "하천에서 오래 남는 독성물질을 없애고 건강한 강가의 큰 나무를 보호해 주세요."], ["I love Earth from a high nest, where a clean river shines like a promise kept.", "나는 높은 둥지에서 약속을 지킨 듯 빛나는 깨끗한 강을 바라보며 지구를 사랑합니다."]]}, {"number": 75, "file": "turtle75.gif", "animal": "매", "sentences": [["I fold the sky around my wings at astonishing speed, but glass can disguise itself as open air.", "나는 놀라운 속도로 날개에 하늘을 접어 넣지만 유리는 열린 하늘인 척 나를 속일 수 있습니다."], ["Reduce toxic pesticides and make glass buildings safer for fast-flying birds.", "유독한 농약을 줄이고 빠르게 나는 새에게 유리 건물을 더 안전하게 만들어 주세요."], ["A bird-safe city would let human brilliance and wild flight share the same horizon.", "조류 친화적인 도시는 인간의 빛나는 문명과 야생의 비행이 같은 지평선을 나누게 할 것입니다."]]}, {"number": 76, "file": "turtle76.gif", "animal": "원숭이올빼미", "sentences": [["I hunt field mice without an invoice, a pesticide bottle, or a poisoned food chain.", "나는 청구서도 농약병도 오염된 먹이사슬도 없이 들쥐를 잡습니다."], ["Use owl boxes and natural rodent control instead of spreading poison across farms.", "농장에 독약을 뿌리는 대신 올빼미 둥지 상자와 자연적인 설치류 조절을 활용해 주세요."], ["I love moonlit farms where a wooden nest box says that natural helpers are welcome.", "나는 나무 둥지 상자가 자연의 조력자를 환영한다고 말해 주는 달빛 농장을 사랑합니다."]]}, {"number": 77, "file": "turtle77.gif", "animal": "수리부엉이", "sentences": [["My eyes gather the smallest light, so a floodlit night steals more from me than darkness ever could.", "내 눈은 아주 작은 빛도 모으기에 환한 인공조명의 밤은 어둠보다 더 많은 것을 빼앗습니다."], ["Protect old trees and reduce nighttime noise and light around nesting territories.", "둥지 영역 주변의 오래된 나무를 지키고 밤의 소음과 빛을 줄여 주세요."], ["I love Earth's true night, deep enough for stars, silence, and an owl's patient watch.", "나는 별과 침묵과 부엉이의 끈기 있는 관찰이 깃들 만큼 깊은 지구의 진짜 밤을 사랑합니다."]]}, {"number": 78, "file": "turtle78.gif", "animal": "앵무새", "sentences": [["My bright feathers attract admiration, but admiration becomes harm when it locks a wild voice in a cage.", "내 화려한 깃털은 감탄을 부르지만 야생의 목소리를 새장에 가두면 감탄은 해가 됩니다."], ["Stop illegal pet trade and preserve the fruiting trees that forest birds depend on.", "불법 반려동물 거래를 막고 숲의 새가 의존하는 열매나무를 보전해 주세요."], ["I love forests loud with free conversation, fruit cracking, and wings choosing their own direction.", "나는 자유로운 대화와 열매 깨지는 소리와 스스로 방향을 고르는 날개로 떠들썩한 숲을 사랑합니다."]]}, {"number": 79, "file": "turtle79.gif", "animal": "공작", "sentences": [["I unfold a jeweled fan, yet beauty gives no permission to steal feathers, eggs, or freedom.", "나는 보석 같은 꼬리를 펼치지만 아름다움이 깃털과 알과 자유를 빼앗을 권리를 주지는 않습니다."], ["Celebrate natural beauty without taking feathers, eggs, or wild birds from their homes.", "깃털과 알과 야생조류를 보금자리에서 빼앗지 않고 자연의 아름다움을 존중해 주세요."], ["Earth needs no museum case when living colors can dance beneath the sun.", "살아 있는 색이 햇빛 아래 춤출 수 있다면 지구에는 유리 진열장이 필요하지 않습니다."]]}, {"number": 80, "file": "turtle80.gif", "animal": "홍학", "sentences": [["My pink flock paints a lake, but the picture fades when water is drained before reaching us.", "우리 분홍빛 무리는 호수를 물들이지만 물이 도착하기 전에 빼앗기면 그 그림은 사라집니다."], ["Protect shallow wetlands from pollution and excessive water extraction.", "얕은 습지를 오염과 지나친 물 사용으로부터 보호해 주세요."], ["I love salt lakes that turn tiny food, sunlight, and patience into a living sunset.", "나는 작은 먹이와 햇빛과 인내를 살아 있는 노을로 바꾸는 염호를 사랑합니다."]]}, {"number": 81, "file": "turtle81.gif", "animal": "백조", "sentences": [["My white reflection looks graceful until fishing line tightens invisibly around a wing.", "내 하얀 모습은 우아하게 비치지만 보이지 않는 낚싯줄이 날개를 조이면 그 우아함은 사라집니다."], ["Keep wetlands clean and stop discarded fishing line from injuring waterbirds.", "습지를 깨끗이 하고 버려진 낚싯줄이 물새를 다치게 하지 않도록 해 주세요."], ["A clean lake is Earth's mirror, and every creature deserves to cross it without hidden traps.", "깨끗한 호수는 지구의 거울이며 모든 생물은 숨은 덫 없이 그 위를 건널 자격이 있습니다."]]}, {"number": 82, "file": "turtle82.gif", "animal": "오리", "sentences": [["I dabble at the water's surface, tasting everything that farms and streets have washed downstream.", "나는 수면을 헤집으며 농장과 거리가 하류로 씻어 보낸 모든 것을 맛봅니다."], ["Restore small ponds and reduce farm chemicals that flow into freshwater habitats.", "작은 연못을 복원하고 담수 서식지로 흘러드는 농업 화학물질을 줄여 주세요."], ["I love a pond alive with reeds, insects, reflections, and ducklings following close behind.", "나는 갈대와 곤충과 비친 하늘과 줄지어 따르는 새끼 오리로 살아 있는 연못을 사랑합니다."]]}, {"number": 83, "file": "turtle83.gif", "animal": "거위", "sentences": [["Our V-shaped flight saves energy because cooperation is written into the air between our wings.", "우리의 V자 비행은 날개 사이의 공기에 협력이 새겨져 있어 에너지를 아껴 줍니다."], ["Protect a chain of resting wetlands across the full length of migration routes.", "긴 이동 경로 전체에 걸쳐 쉴 수 있는 습지의 연결망을 보호해 주세요."], ["I love a planet whose wetlands form stepping-stones across continents for tired travelers.", "나는 습지가 지친 여행자를 위해 대륙을 가로지르는 디딤돌이 되는 지구를 사랑합니다."]]}, {"number": 84, "file": "turtle84.gif", "animal": "닭", "sentences": [["I am common enough to enter countless meals, but common lives still deserve uncommon care.", "나는 수많은 식탁에 오를 만큼 흔하지만 흔한 생명도 특별한 돌봄을 받을 자격이 있습니다."], ["Improve farm animal welfare and choose food systems that waste less grain, water, and energy.", "농장동물 복지를 높이고 곡물과 물과 에너지를 덜 낭비하는 식품 체계를 선택해 주세요."], ["Earth is honored when food is produced with gratitude, little waste, and room for an animal to live well.", "감사와 적은 낭비와 동물이 건강하게 살 공간으로 먹거리를 생산할 때 우리는 지구를 존중하게 됩니다."]]}, {"number": 85, "file": "turtle85.gif", "animal": "타조", "sentences": [["My wings cannot lift me, yet my legs can write astonishing speed across the dry plain.", "내 날개는 몸을 띄우지 못하지만 긴 다리는 건조한 평원에 놀라운 속도를 써 내려갑니다."], ["Preserve broad open landscapes and prevent eggs and feathers from being taken illegally.", "넓고 열린 땅을 보전하고 알과 깃털이 불법으로 채취되지 않게 해 주세요."], ["I love the enormous sky that makes a running bird feel almost as free as flight.", "나는 달리는 새도 나는 것처럼 자유롭게 느끼게 하는 거대한 하늘을 사랑합니다."]]}, {"number": 86, "file": "turtle86.gif", "animal": "두루미", "sentences": [["My dance and call have crossed marshes for longer than any human border has existed.", "내 춤과 울음은 인간의 어떤 국경보다 오래전부터 습지를 건너왔습니다."], ["Restore wetlands and maintain peaceful stopover sites along ancient migration routes.", "습지를 복원하고 오래된 이동로를 따라 평온한 중간 기착지를 유지해 주세요."], ["I love Earth in faithful returns, when a restored wetland welcomes an ancient traveler home.", "나는 복원된 습지가 오래된 여행자를 집으로 맞는 충실한 귀환 속에서 지구를 사랑합니다."]]}, {"number": 87, "file": "turtle87.gif", "animal": "황새", "sentences": [["My nest rises above a village, showing that wild families and human roofs can share one skyline.", "내 둥지는 마을 위로 솟아 야생 가족과 인간의 지붕이 하나의 하늘선을 나눌 수 있음을 보여 줍니다."], ["Protect wet meadows and nesting platforms while reducing dangerous power-line collisions.", "습한 초지와 둥지 받침대를 보호하고 전선 충돌 위험을 줄여 주세요."], ["I love landscapes where chimneys, meadows, frogs, and young storks all belong in the picture.", "나는 굴뚝과 초원과 개구리와 어린 황새가 모두 한 풍경에 속하는 땅을 사랑합니다."]]}, {"number": 88, "file": "turtle88.gif", "animal": "왜가리", "sentences": [["I stand motionless at the water's edge, which gives me time to notice every oily ripple.", "나는 물가에 꼼짝 않고 서 있기에 기름진 물결 하나하나를 알아차릴 시간이 있습니다."], ["Maintain shallow, fish-rich waters without sewage, plastic, or toxic runoff.", "하수와 플라스틱과 유독성 유출수가 없는 얕고 물고기가 풍부한 물을 유지해 주세요."], ["Earth speaks slowly through an estuary, and patience lets me hear fish beneath the surface.", "지구는 하구를 통해 천천히 말하며 인내심은 내가 수면 아래 물고기 소리를 듣게 합니다."]]}, {"number": 89, "file": "turtle89.gif", "animal": "악어", "sentences": [["I have survived since ancient ages, but survival beside modern people requires knowledge from both sides.", "나는 태고의 시대부터 살아남았지만 현대인 곁에서의 생존에는 양쪽의 지혜가 필요합니다."], ["Conserve whole river systems and replace persecution with safe, informed coexistence.", "강 생태계 전체를 보전하고 무분별한 포획 대신 안전하고 현명하게 공존해 주세요."], ["I love the warm river that holds my armored body and a thousand softer lives together.", "나는 갑옷 같은 내 몸과 수천의 연약한 생명을 함께 품는 따뜻한 강을 사랑합니다."]]}, {"number": 90, "file": "turtle90.gif", "animal": "앨리게이터", "sentences": [["The pools I maintain during drought become emergency rooms for fish, frogs, turtles, and birds.", "내가 가뭄 동안 유지하는 물웅덩이는 물고기와 개구리와 거북과 새의 응급실이 됩니다."], ["Protect swamps and the water holes that large reptiles create for many other species.", "늪과 대형 파충류가 여러 생물을 위해 만드는 물웅덩이를 보호해 주세요."], ["I love a swamp that reveals how one powerful neighbor can make room for many fragile ones.", "나는 힘센 이웃 하나가 수많은 연약한 이웃의 자리를 만드는 모습을 보여 주는 늪을 사랑합니다."]]}, {"number": 91, "file": "turtle91.gif", "animal": "육지거북", "sentences": [["My slow life measures time in decades, while one speeding vehicle can end it in a second.", "나의 느린 삶은 수십 년으로 시간을 재지만 빠른 자동차 한 대는 한순간에 그것을 끝낼 수 있습니다."], ["Slow vehicles, stop illegal collection, and protect the long-lived animals of fragile islands.", "차량 속도를 줄이고 불법 채집을 막아 연약한 섬의 장수 동물을 보호해 주세요."], ["I love Earth's patient places, where growing old is an achievement rather than an accident avoided.", "나는 늙어 가는 일이 우연히 사고를 피한 결과가 아니라 값진 성취가 되는 지구의 느긋한 장소를 사랑합니다."]]}, {"number": 92, "file": "turtle92.gif", "animal": "바다거북", "sentences": [["I cross an ocean to reach the same beach, only to find plastic and artificial daylight waiting.", "나는 같은 해변에 닿으려고 바다를 건너지만 그곳에서 플라스틱과 인공의 낮을 만납니다."], ["Reduce plastic and artificial beach lighting while making fishing gear turtle-safe.", "플라스틱과 해변의 인공조명을 줄이고 어구를 바다거북에게 안전하게 바꿔 주세요."], ["I love Earth by moonlight, when tiny hatchlings can follow the bright sea instead of a hotel sign.", "나는 어린 거북들이 호텔 간판이 아니라 밝은 바다를 따라갈 수 있는 달빛 속 지구를 사랑합니다."]]}, {"number": 93, "file": "turtle93.gif", "animal": "카멜레온", "sentences": [["Each eye can look a different way, but both see the same forest shrinking around my branch.", "내 두 눈은 서로 다른 방향을 볼 수 있지만 둘 다 나뭇가지 주변에서 줄어드는 같은 숲을 봅니다."], ["Stop illegal pet trade and preserve the tiny branches and insects our lives depend on.", "불법 반려동물 거래를 막고 우리의 삶이 의존하는 작은 나뭇가지와 곤충을 지켜 주세요."], ["I love Earth's talent for color and change, and freedom is the finest color I can wear.", "나는 색과 변화에 뛰어난 지구를 사랑하며 내가 입을 수 있는 가장 아름다운 색은 자유입니다."]]}, {"number": 94, "file": "turtle94.gif", "animal": "이구아나", "sentences": [["I borrow warmth from the sun, so every safe rock and living tree is part of my daily energy system.", "나는 태양에서 체온을 빌리므로 안전한 바위와 살아 있는 나무가 모두 내 일상의 에너지 체계입니다."], ["Control invasive species carefully and protect sunning, feeding, and nesting places.", "외래종을 신중하게 관리하고 햇볕을 쬐고 먹고 알을 낳는 장소를 보호해 주세요."], ["I love island sunlight best when native life, not invasive hunger, fills the shore.", "나는 외래종의 탐욕이 아니라 토착 생명이 해안을 채우는 섬의 햇빛을 가장 사랑합니다."]]}, {"number": 95, "file": "turtle95.gif", "animal": "도마뱀", "sentences": [["I am small enough to vanish beneath a stone, yet pesticides can follow me into that refuge.", "나는 돌 아래로 사라질 만큼 작지만 농약은 그 은신처까지 나를 따라옵니다."], ["Avoid pesticides and leave warm stones, native plants, and small refuges in shared spaces.", "농약을 피하고 공동 공간에 따뜻한 돌과 토종 식물과 작은 은신처를 남겨 주세요."], ["A warm wall, a native flower, and an insect-rich garden are small ways Earth says welcome.", "따뜻한 담장과 토종 꽃과 곤충이 풍부한 정원은 지구가 건네는 작은 환영 인사입니다."]]}, {"number": 96, "file": "turtle96.gif", "animal": "코브라", "sentences": [["My raised hood asks for distance, not war, and understanding that message can save both our lives.", "내가 목덜미를 펼치는 것은 전쟁이 아니라 거리를 요청하는 행동이며 그 뜻을 이해하면 우리 모두 살 수 있습니다."], ["Prevent snakebite through education and safe housing rather than killing every snake.", "모든 뱀을 죽이지 말고 교육과 안전한 주거 환경으로 뱀 물림을 예방해 주세요."], ["I love fields where knowledge replaces panic and every snake is not sentenced for being seen.", "나는 공포를 지식이 대신하고 눈에 띈 모든 뱀이 죽임을 당하지 않는 들판을 사랑합니다."]]}, {"number": 97, "file": "turtle97.gif", "animal": "방울뱀", "sentences": [["My rattle is an honest warning bell offered before a bite, if people pause long enough to listen.", "내 꼬리의 딸랑임은 물기 전에 보내는 정직한 경고이므로 사람들이 잠시 멈춰 들어 주면 됩니다."], ["Respect warning signals and protect snakes that help control rodent populations.", "경고 신호를 존중하고 설치류 개체 수를 조절하는 뱀을 보호해 주세요."], ["I love the rocky Earth that warms my scales and gives cautious neighbors room to pass.", "나는 비늘을 데워 주고 조심스러운 이웃이 지나갈 공간을 주는 바위투성이 지구를 사랑합니다."]]}, {"number": 98, "file": "turtle98.gif", "animal": "청개구리", "sentences": [["Water passes through my skin, turning my small body into an early report on environmental health.", "물은 내 피부를 통과하기에 작은 내 몸은 환경 건강을 알리는 조기 보고서가 됩니다."], ["Protect clean water and reduce pesticides because amphibian skin reveals environmental danger early.", "양서류의 피부는 환경 위험을 일찍 보여 주므로 깨끗한 물을 지키고 농약을 줄여 주세요."], ["I sing for an Earth where rain fills clean ponds and every chorus means the wetland is alive.", "나는 비가 깨끗한 연못을 채우고 모든 합창이 습지의 생존을 뜻하는 지구를 위해 노래합니다."]]}, {"number": 99, "file": "turtle99.gif", "animal": "불도롱뇽", "sentences": [["My bright warning colors cross a forest floor that must remain cool, shaded, and moist.", "내 선명한 경고색은 서늘하고 그늘지고 촉촉해야 할 숲 바닥을 가로지릅니다."], ["Preserve shaded streams, fallen logs, and moist soil during hotter, drier years.", "더 덥고 건조해지는 시대에 그늘진 시냇물과 쓰러진 통나무와 촉촉한 흙을 지켜 주세요."], ["I love the secret Earth beneath fallen logs, where decay is simply life preparing to begin again.", "나는 썩음이 다시 시작될 생명을 준비하는 과정인 쓰러진 통나무 아래의 비밀스러운 지구를 사랑합니다."]]}, {"number": 100, "file": "turtle100.gif", "animal": "제왕나비", "sentences": [["My wings weigh almost nothing, yet they carry a migration across countries and generations.", "내 날개는 거의 무게가 없지만 여러 나라와 세대를 건너는 이동을 감당합니다."], ["Plant pesticide-free native flowers across the migration route and protect wintering forests.", "이동로 전체에 농약 없는 토종 꽃을 심고 겨울을 나는 숲을 보호해 주세요."], ["I love Earth as a chain of flowers: one missing garden can break a journey, while one planted garden can mend it.", "나는 지구를 꽃들의 사슬로 사랑합니다. 정원 하나가 사라지면 여행이 끊기지만 하나를 심으면 다시 이어질 수 있습니다."]]}];
const council=document.getElementById('council'),q=document.getElementById('q'),pick=document.getElementById('pick'),count=document.getElementById('count');
pick.innerHTML+=records.map(r=>`<option value="${r.number}">${r.number}. ${r.animal}</option>`).join('');
council.innerHTML=records.map(r=>`<article class="animal" data-n="${r.number}" data-s="${(r.animal+' '+r.file+' '+r.sentences.flat().join(' ')).toLowerCase()}"><div class="head"><div class="badge">${r.number}</div><div><h2>${r.animal}</h2><div class="file">${r.file}</div></div></div>${r.sentences.map((s,i)=>`<div class="pair"><div class="sn">${(r.number-1)*3+i+1}</div><div><p class="en" lang="en">${s[0]}</p><p class="ko" lang="ko">${s[1]}</p></div></div>`).join('')}</article>`).join('');
function filter(){let animals=0,sentences=0;document.querySelectorAll('.animal').forEach(c=>{const on=c.dataset.s.includes(q.value.trim().toLowerCase())&&(!pick.value||c.dataset.n===pick.value);c.classList.toggle('hide',!on);if(on){animals++;sentences+=3}});count.textContent=`${sentences} / 300문장 · ${animals}종`}q.oninput=filter;pick.onchange=filter;
function speak(lang){speechSynthesis.cancel();const sel=lang==='en-US'?'.en':'.ko',u=new SpeechSynthesisUtterance([...document.querySelectorAll('.animal:not(.hide)')].flatMap(c=>[...c.querySelectorAll(sel)].map(x=>x.textContent)).join(' '));u.lang=lang;u.rate=lang==='en-US'?.84:.94;speechSynthesis.speak(u)}
</script></body></html>
