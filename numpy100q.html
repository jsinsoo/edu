:', b.tolist())\n        print('개수:', b.size)\n\napp = BasicNumpy14()\napp.run()", "answer": "선택: [7, 9]\n개수: 2", "explain": "클래스의 run() 메서드 안에서 numpy 연산을 수행합니다. 7 이상인 값은 7과 9입니다."}, {"cat": "기초", "sub": "numpy OOP", "title": "기초 numpy OOP 예제 15", "code": "import numpy as np\n\nclass BasicNumpy15:\n    def run(self):\n        a = np.array([1, 4, 9])\n        print('제곱근:', np.sqrt(a).tolist())\n        print('합:', np.sqrt(a).sum())\n\napp = BasicNumpy15()\napp.run()", "answer": "제곱근: [1.0, 2.0, 3.0]\n합: 6.0", "explain": "클래스의 run() 메서드 안에서 numpy 연산을 수행합니다. 각 원소의 제곱근은 1,2,3입니다."}, {"cat": "기초", "sub": "numpy OOP", "title": "기초 numpy OOP 예제 16", "code": "import numpy as np\n\nclass BasicNumpy16:\n    def run(self):\n        a = np.array([1.2, 2.6, 3.1])\n        print('반올림:', np.round(a).tolist())\n        print('최대:', np.round(a).max())\n\napp = BasicNumpy16()\napp.run()", "answer": "반올림: [1.0, 3.0, 3.0]\n최대: 3.0", "explain": "클래스의 run() 메서드 안에서 numpy 연산을 수행합니다. round는 가장 가까운 정수로 반올림합니다."}, {"cat": "기초", "sub": "numpy OOP", "title": "기초 numpy OOP 예제 17", "code": "import numpy as np\n\nclass BasicNumpy17:\n    def run(self):\n        a = np.array([2, 2, 2])\n        print('평균:', a.mean())\n        print('표준편차:', a.std())\n\napp = BasicNumpy17()\napp.run()", "answer": "평균: 2.0\n표준편차: 0.0", "explain": "클래스의 run() 메서드 안에서 numpy 연산을 수행합니다. 모든 값이 같아 표준편차는 0입니다."}, {"cat": "기초", "sub": "numpy OOP", "title": "기초 numpy OOP 예제 18", "code": "import numpy as np\n\nclass BasicNumpy18:\n    def run(self):\n        a = np.array([1, 2, 3])\n        print('누적합:', np.cumsum(a).tolist())\n        print('마지막누적:', np.cumsum(a)[-1])\n\napp = BasicNumpy18()\napp.run()", "answer": "누적합: [1, 3, 6]\n마지막누적: 6", "explain": "클래스의 run() 메서드 안에서 numpy 연산을 수행합니다. 누적합은 1, 3, 6입니다."}, {"cat": "기초", "sub": "numpy OOP", "title": "기초 numpy OOP 예제 19", "code": "import numpy as np\n\nclass BasicNumpy19:\n    def run(self):\n        a = np.array([3, 1, 2])\n        print('정렬:', np.sort(a).tolist())\n        print('첫값:', np.sort(a)[0])\n\napp = BasicNumpy19()\napp.run()", "answer": "정렬: [1, 2, 3]\n첫값: 1", "explain": "클래스의 run() 메서드 안에서 numpy 연산을 수행합니다. 오름차순 정렬 결과입니다."}, {"cat": "기초", "sub": "numpy OOP", "title": "기초 numpy OOP 예제 20", "code": "import numpy as np\n\nclass BasicNumpy20:\n    def run(self):\n        a = np.array([1, 2, 3, 4])\n        print('짝수:', a[a%2==0].tolist())\n        print('짝수합:', a[a%2==0].sum())\n\napp = BasicNumpy20()\napp.run()", "answer": "짝수: [2, 4]\n짝수합: 6", "explain": "클래스의 run() 메서드 안에서 numpy 연산을 수행합니다. 짝수는 2와 4입니다."}, {"cat": "응용", "sub": "numpy", "title": "응용 numpy 예제 1", "code": "import numpy as np\n\na = np.array([[1, 2, 3], [4, 5, 6]])\nprint('열합:', a.sum(axis=0).tolist())\nprint('행합:', a.sum(axis=1).tolist())", "answer": "열합: [5, 7, 9]\n행합: [6, 15]", "explain": "axis=0은 열방향 합, axis=1은 행방향 합입니다."}, {"cat": "응용", "sub": "numpy", "title": "응용 numpy 예제 2", "code": "import numpy as np\n\na = np.array([[10, 20], [30, 40]])\nprint('열평균:', a.mean(axis=0).tolist())\nprint('행평균:', a.mean(axis=1).tolist())", "answer": "열평균: [20.0, 30.0]\n행평균: [15.0, 35.0]", "explain": "열 평균과 행 평균을 각각 계산합니다."}, {"cat": "응용", "sub": "numpy", "title": "응용 numpy 예제 3", "code": "import numpy as np\n\na = np.array([1, 2, 3])\nb = np.array([10, 20, 30])\nprint('내적:', np.dot(a, b))\nprint('원소곱합:', (a*b).sum())", "answer": "내적: 140\n원소곱합: 140", "explain": "1×10+2×20+3×30=140입니다."}, {"cat": "응용", "sub": "numpy", "title": "응용 numpy 예제 4", "code": "import numpy as np\n\na = np.array([[1, 2], [3, 4]])\nb = np.array([1, 1])\nc = a @ b\nprint('결과:', c.tolist())\nprint('합:', c.sum())", "answer": "결과: [3, 7]\n합: 10", "explain": "행렬-벡터 곱 결과는 [3,7]입니다."}, {"cat": "응용", "sub": "numpy", "title": "응용 numpy 예제 5", "code": "import numpy as np\n\na = np.array([[1, 2], [3, 4]])\nprint('전치:', a.T.tolist())\nprint('전치모양:', a.T.shape)", "answer": "전치: [[1, 3], [2, 4]]\n전치모양: (2, 2)", "explain": "행과 열이 바뀝니다."}, {"cat": "응용", "sub": "numpy", "title": "응용 numpy 예제 6", "code": "import numpy a function norm(s){
    return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");
}
function esc(s){
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function render(){
    const qbox=document.getElementById("questions");
    const nav=document.getElementById("navBtns");
    let out="", navOut="", current="";
    QUESTIONS.forEach((q,i)=>{
        const group = q.cat + " - " + q.sub;
        if(group!==current){
            current=group;
            out += `<h2>${group}</h2>`;
            navOut += `<button style="background:#0f172a;color:white;margin-top:10px" onclick="location.hash='q${i+1}'">${group}</button>`;
        }
        navOut += `<button onclick="location.hash='q${i+1}'">${i+1}번</button>`;
        out += `
        <div class="card" id="q${i+1}">
            <span class="badge">${i+1}번 · ${q.cat} · ${q.sub}</span>
            <h3>${q.title}</h3>
            <p><b>문제.</b> 다음 numpy 코드의 출력 결과를 쓰시오.</p>
            <pre><code>${esc(q.code)}</code></pre>
            <textarea id="ans${i}" placeholder="출력 결과를 줄 단위로 입력하세요."></textarea>
            <div id="res${i}" class="result"></div>
        </div>`;
    });
    qbox.innerHTML=out;
    nav.innerHTML=navOut;
}
function gradeAll(){
    let correct=0;
    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <div>${ok ? '<span class="correct">정답</span>' : '<span class="wrong">오답</span>'}</div>
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
    const score=Math.round(correct/QUESTIONS.length*100);
    document.getElementById("scoreBox").innerHTML =
        `총점: <b>${score}점</b> / 정답: <b>${correct}</b>개 / 전체: <b>${QUESTIONS.length}</b>문항`;
}
function showAllSolutions(){
    QUESTIONS.forEach((q,i)=>{
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
}
function downloadTxt(){
    gradeAll();
    let sid=document.getElementById("studentId").value.trim() || "학번";
    let name=document.getElementById("studentName").value.trim() || "이름";
    let now=new Date();
    let stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"_"+String(now.getHours()).padStart(2,"0")+"-"+String(now.getMinutes()).padStart(2,"0")+"-"+String(now.getSeconds()).padStart(2,"0");

    let correct=0;
    let lines=[];
    lines.push("numpy 서술형 평가 결과");
    lines.push("학번: "+sid);
    lines.push("이름: "+name);
    lines.push("응시시각: "+stamp);
    lines.push("");

    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        lines.push(`[${i+1}번] ${q.cat} - ${q.sub} - ${q.title} : ${ok ? "정답" : "오답"}`);
        lines.push("학생 답안:");
        lines.push(user || "(미입력)");
        lines.push("정답:");
        lines.push(q.answer);
        lines.push("상세 풀이: "+q.explain);
        lines.push("----------------------------------------");
    });
    let score=Math.round(correct/QUESTIONS.length*100);
    lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+QUESTIONS.length);

    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${sid}_${name}_numpy_${score}점_${stamp}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
