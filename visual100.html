lass')\nplt.title('Count Plot')\nplt.xlabel('class')\nplt.ylabel('count')\nplt.show()", "desc": "범주별 빈도"}, {"cat": "기초", "sub": "일반", "kind": "heatmap 기초", "title": "기초 8. heatmap 기초", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'math':[80,90], 'science':[70,100]}, index=['A','B'])\nsns.heatmap(df,annot=True)\nplt.title('Basic Heatmap')\nplt.show()", "desc": "2차원 값을 색으로 표현"}, {"cat": "기초", "sub": "일반", "kind": "subplot 기초", "title": "기초 9. subplot 기초", "code": "import matplotlib.pyplot as plt\n\nfig,axs=plt.subplots(1,2)\naxs[0].plot([1,2,3],[2,4,6],label='line')\naxs[0].set_title('Line')\naxs[1].bar(['A','B'],[3,5],label='bar')\naxs[1].set_title('Bar')\nplt.show()", "desc": "여러 그래프를 한 화면에 배치"}, {"cat": "기초", "sub": "일반", "kind": "label/title 설정", "title": "기초 10. label/title 설정", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3]\ny=[1,4,9]\nplt.plot(x,y,label='square')\nplt.title('Title Label Legend')\nplt.xlabel('number')\nplt.ylabel('square')\nplt.legend()\nplt.show()", "desc": "제목과 축 이름 설정"}, {"cat": "기초", "sub": "일반", "kind": "step plot", "title": "기초 11. step plot", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3,4]\ny=[10,10,20,30]\nplt.step(x,y,label='step')\nplt.title('Step Plot')\nplt.xlabel('time')\nplt.ylabel('level')\nplt.legend()\nplt.show()", "desc": "계단형 변화 표현"}, {"cat": "기초", "sub": "일반", "kind": "area chart", "title": "기초 12. area chart", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3,4]\ny=[3,5,4,7]\nplt.fill_between(x,y,alpha=0.3,label='area')\nplt.plot(x,y)\nplt.title('Area Chart')\nplt.legend()\nplt.show()", "desc": "누적 또는 영역 강조"}, {"cat": "기초", "sub": "일반", "kind": "horizontal bar", "title": "기초 13. horizontal bar", "code": "import matplotlib.pyplot as plt\n\nnames=['Kim','Lee','Park']\nscores=[80,95,75]\nplt.barh(names,scores,label='score')\nplt.title('Horizontal Bar')\nplt.xlabel('score')\nplt.legend()\nplt.show()", "desc": "수평 막대 비교"}, {"cat": "기초", "sub": "일반", "kind": "seaborn lineplot", "title": "기초 14. seaborn lineplot", "code": "import seaborn as sns\nimport matplotlib.pyplot as plt\n\nx=[1,2,3,4]\ny=[5,9,7,12]\nsns.lineplot(x=x,y=y,label='sns line')\nplt.title('Seaborn Lineplot')\nplt.xlabel('x')\nplt.ylabel('y')\nplt.show()", "desc": "seaborn 선그래프"}, {"cat": "기초", "sub": "일반", "kind": "seaborn scatterplot", "title": "기초 15. seaborn scatterplot", "code": "import seaborn as sns\nimport matplotlib.pyplot as plt\n\nx=[1,2,3,4]\ny=[4,7,6,10]\nsns.scatterplot(x=x,y=y,label='sns scatter')\nplt.title('Seaborn Scatterplot')\nplt.xlabel('x')\nplt.ylabel('y')\nplt.show()", "desc": "seaborn 산점도"}, {"cat": "기초", "sub": "일반", "kind": "seaborn histplot", "title": "기초 16. seaborn histplot", "code": "import seaborn as sns\nimport matplotlib.pyplot as plt\n\ndata=[1,2,2,3,3,4,5]\nsns.histplot(data,bins=5,kde=True)\nplt.title('Seaborn Histplot')\nplt.xlabel('value')\nplt.show()", "desc": "seaborn 히스토그램"}, {"cat": "기초", "sub": "일반", "kind": "pandas line", "title": "기초 17. pandas line", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'month':[1,2,3], 'sales':[10,25,35]})\ndf.plot(x='month',y='sales',kind='line',title='Pandas Line')\nplt.xlabel('month')\nplt.ylabel('sales')\nplt.show()", "desc": "pandas 내장 선그래프"}, {"cat": "기초", "sub": "일반", "kind": "pandas bar", "title": "기초 18. pandas bar", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'item':['A','B','C'], 'value':[5,9,6]})\ndf.plot(x='item',y='value',kind='bar',title='Pandas Bar')\nplt.xlabel('item')\nplt.ylabel('value')\nplt.show()", "desc": "pandas 내장 막대그래프"}, {"cat": "기초", "sub": "일반", "kind": "object API", "title": "기초 19. object API", "code": "import matplotlib.pyplot as plt\n\nfig,ax=plt.subplots()\nax.plot([1,2,3],[2,4,6],label='line')\nax.set_title('Object API')\nax.set_xlabel('x')\nax.set_ylabel('y')\nax.legend()\nplt.show()", "desc": "matplotlib 객체지향 방식"}, {"cat": "기초", "sub": "일반", "kind": "figure size", "title": "기초 20. figure size", "code": "import matplotlib.pyplot as plt\n\nplt.figure(figsize=(5,3))\nplt.plot([1,2,3],[3,2,5],label='data')\nplt.title('Figure Size')\nplt.legend()\nplt.show()", "desc": "그래프 크기 설정"}, {"cat": "기초", "sub": "OOP", "kind": "line plot", "title": "기초 OOP 1. line plot", "code": "import matplotlib.pyplot as plt\n\nimport matplotlib.pyplot as plt\n\nclass BasicViz1:\n    def draw(self):\n        x=[1,2,3,4]\n        y=[10,20,15,30]\n        plt.plot(x,y,label='value')\n        plt.title('Line Plot')\n        plt.xlabel('time')\n        plt.ylabel('value')\n        plt.legend()\n        plt.show()\n\napp = BasicViz1()\napp.draw()", "desc": "클래스 기반으로 시간에 따른 값의 변화"}, {"cat": "기초", "sub": "OOP", "kind": "bar plot", "title": "기초 OOP 2. bar plot", "code": "import matplotlib.pyplot as plt\n\nimport matplotlib.pyplot as plt\n\nclass BasicViz2:\n    def draw(self):\n        items=['A','B','C']\n        values=[12,25,18]\n        plt.bar(items,values,label='sales')\n        plt.title('Bar Plot')\n        plt.xlabel('item')\n        plt.ylabel('sales')\n        plt.legend()\n        plt.show()\n\napp = BasicViz2()\napp.draw()", "desc": "클래스 기반으로 범주별 크기 비교"}, {"cat": "기초", "sub": "OOP", "kind": "scatter plot", "title": "기초 OOP 3. scatter plot", "code": "import matplotlib.pyplot as plt\n\nimport matplotlib.pyplot as plt\n\nclass BasicViz3:\n    def draw(self):\n        x=[1,2,3,4,5]\n        y=[50,60,65,80,90]\n        plt.scatter(x,y,label='student')\n        plt.title('Scatter Plot')\n        plt.xlabel('study hour')\n        plt.ylabel('score')\n        plt.legend()\n        plt.show()\n\napp = BasicViz3()\napp.draw()", "desc": "클래스 기반으로 두 변수의 관계"}, {"cat": "기초", "sub": "OOP", "kind": "histogram", "title": "기초 OOP 4. histogram", "code": "import matplotlib.pyplot as plt\n\nimport matplotlib.pyplot as plt\n\nclass BasicViz4:\n    def draw(self):\n        data=[60,70,70,80,80,80,90,100]\n        plt.hist(data,bins=5,label='score')\n        plt.title('Histogram')\n        plt.xlabel('score')\n        plt.ylabel('frequency')\n        plt.legend()\n        plt.show()\n\napp = BasicViz4()\napp.draw()", "desc": "클래스 기반으로 자료 분포 확인"}, {"cat": "기초", "sub": "OOP", "kind": "pie chart", "title": "기초 OOP 5. pie chart", "code": "import matplotlib.pyplot as plt\n\nimport matplotlib.pyplot as plt\n\nclass BasicViz5:\n    def draw(self):\n        labels=['A','B','C']\n        sizes=[20,30,50]\n        plt.pie(sizes,labels=labels,autopct='%1.1f%%')\n        plt.title('Pie Chart')\n        plt.show()\n\napp = BasicViz5()\napp.draw()", "desc": "클래스 기반으로 전체 중 비율"}, {"cat": "기초", "sub": "OOP", "kind": "box plot", "title": "기초 OOP 6. box plot", "code": "import matplotlib.pyplot as plt\n\nimport matplotlib.pyplot as plt\n\nclass BasicViz6:\n    def draw(self):\n        data=[55,60,65,70,75,80,95]\n        plt.boxplot(data)\n        plt.title('Box Plot')\n        plt.ylabel('score')\n        plt.show()\n\napp = BasicViz6()\napp.draw()", "desc": "클래스 기반으로 중앙값과 이상치 확인"}, {"cat": "기초", "sub": "OOP", "kind": "count plot", "title": "기초 OOP 7. count plot", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nimport pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass BasicViz7:\n    def draw(self):\n        df=pd.DataFrame({'class':['A','A','B','C','C','C']})\n        sns.countplot(data=df,x='class')\n        plt.title('Count Plot')\n        plt.xlabel('class')\n        plt.ylabel('count')\n        plt.show()\n\napp = BasicViz7()\napp.draw()", "desc": "클래스 기반으로 범주별 빈도"}, {"cat": "기초", "sub": "OOP", "kind": "heatmap 기초", "title": "기초 OOP 8. heatmap 기초", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nimport pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass BasicViz8:\n    def draw(self):\n        df=pd.DataFrame({'math':[80,90], 'science':[70,100]}, index=['A','B'])\n        sns.heatmap(df,annot=True)\n        plt.title('Ba , "title": "심화 OOP 6. 대시보드형 subplot", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nclass AdvancedViz6:\n    def draw(self):\n        df=pd.DataFrame({'월':[1,2,3], '매출':[10,20,30], '이익':[2,5,9]})\n        fig,axs=plt.subplots(2,2)\n        axs[0,0].plot(df['월'],df['매출'])\n        axs[0,1].bar(df['월'],df['이익'])\n        axs[1,0].scatter(df['매출'],df['이익'])\n        axs[1,1].hist(df['매출'])\n        plt.show()\n\napp = AdvancedViz6()\napp.draw()", "desc": "클래스 기반으로 2x2 대시보드 그래프"}, {"cat": "심화", "sub": "OOP", "kind": "고급 heatmap", "title": "심화 OOP 7. 고급 heatmap", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nimport pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass AdvancedViz7:\n    def draw(self):\n        df=pd.DataFrame({'A':[1,2,3,4], 'B':[2,4,6,8], 'C':[4,3,2,1]})\n        sns.heatmap(df.corr(),annot=True,cmap='coolwarm')\n        plt.title('Advanced Heatmap')\n        plt.show()\n\napp = AdvancedViz7()\napp.draw()", "desc": "클래스 기반으로 annot와 cmap을 활용한 heatmap"}, {"cat": "심화", "sub": "OOP", "kind": "rolling graph", "title": "심화 OOP 8. rolling graph", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nclass AdvancedViz8:\n    def draw(self):\n        df=pd.DataFrame({'값':[10,20,30,40,50]})\n        df['rolling']=df['값'].rolling(3).mean()\n        plt.plot(df['rolling'],label='rolling mean')\n        plt.title('Rolling Graph')\n        plt.legend()\n        plt.show()\n\napp = AdvancedViz8()\napp.draw()", "desc": "클래스 기반으로 이동평균 그래프"}, {"cat": "심화", "sub": "OOP", "kind": "시계열 분석 시각화", "title": "심화 OOP 9. 시계열 분석 시각화", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nclass AdvancedViz9:\n    def draw(self):\n        df=pd.DataFrame({'날짜':pd.to_datetime(['2026-01-01','2026-01-02','2026-01-03 function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function copyCode(i){navigator.clipboard.writeText(ITEMS[i].code);alert((i+1)+"번 코드가 복사되었습니다.");}
function render(){
 let nav="", content="", current="";
 ITEMS.forEach((it,i)=>{
   const group=it.cat+" - "+it.sub;
   if(group!==current){
     current=group;
     nav+=`<button class="group-btn" onclick="location.hash='item${i+1}'">${group}</button>`;
     content+=`<h2>${group}</h2>`;
   }
   nav+=`<button onclick="location.hash='item${i+1}'">${i+1}. ${it.kind}</button>`;
   content+=`<div class="card" id="item${i+1}">
     <span class="badge">${i+1}번 · ${it.cat} · ${it.sub}</span>
     <h3>${it.title}</h3>
     <div class="desc"><b>시각화 종류:</b> ${it.kind}<br><b>학습 포인트:</b> ${it.desc}</div>
     <button class="copy" onclick="copyCode(${i})">코드 복사</button>
     <pre><code>${esc(it.code)}</code></pre>
   </div>`;
 });
 document.getElementById("navBtns").innerHTML=nav;
 document.getElementById("content").innerHTML=content;
}
render();
</script>
