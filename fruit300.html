<header><h1>과일과 채소 100대표의 지속가능한 지구회의</h1><p>The Sustainable Earth Council of 100 Fruit and Vegetable Representatives</p><p>100종 × 고유 발언 3문장 = 영어 300문장 + 한글 번역 300문장</p></header><main class="wrap"><section class="intro"><strong>회의 구성:</strong> 과일 50종과 채소 50종이 자신의 생김새와 생태적 특징을 소개하고, 물·토양·종자·농약·포장·운송·음식물 쓰레기에 관한 고유한 해결책과 지구 사랑을 이야기합니다.</section>
<section class="tools"><input id="q" placeholder="이름·영어·파일명·문장 검색"><select id="kind"><option value="">과일+채소 전체</option><option value="과일">과일 50종</option><option value="채소">채소 50종</option></select><select id="pick"><option value="">100종 전체</option></select><button onclick="speak('en-US')">영어 듣기</button><button onclick="speak('ko-KR')">한글 듣기</button><button onclick="speechSynthesis.cancel()">정지</button><button onclick="print()">인쇄/PDF</button><span id="count">300 / 300</span></section><section id="council"></section></main><footer>다양한 씨앗, 건강한 흙, 공정한 식탁이 지속가능한 지구를 만듭니다.</footer>
<script>const records=[{"number": 1, "kind": "과일", "name": "사과", "english": "Apple", "file": "apple.gif", "sentences": [["I keep a crisp autumn inside my red skin.", "나는 붉은 껍질 안에 아삭한 가을을 간직하고 있습니다."], ["Plant mixed orchards and protect pollinators instead of depending on heavy pesticide use.", "강한 농약에 의존하지 말고 다양한 품종의 과수원을 만들며 꽃가루받이 곤충을 보호해 주세요."], ["I love Earth whenever an old apple tree feeds bees, children, and soil together.", "오래된 사과나무 한 그루가 벌과 아이와 흙을 함께 먹여 살릴 때 나는 지구를 사랑합니다."]]}, {"number": 2, "kind": "과일", "name": "배", "english": "Asian Pear", "file": "asian_pear.gif", "sentences": [["My pale flesh stores the cool sweetness of a late-summer rain.", "내 하얀 과육에는 늦여름 비의 시원한 단맛이 저장되어 있습니다."], ["Save water with soil moisture sensors and grow regional pear varieties resilient to changing weather.", "토양 수분 센서로 물을 아끼고 달라지는 날씨에 강한 지역 배 품종을 길러 주세요."], ["A round pear hanging beneath green leaves is Earth's quiet lantern.", "초록 잎 아래 매달린 둥근 배는 지구가 켜 놓은 조용한 등불입니다."]]}, {"number": 3, "kind": "과일", "name": "바나나", "english": "Banana", "file": "banana.gif", "sentences": [["I travel in a yellow crescent, although my journey to market is often longer than people imagine.", "나는 노란 초승달 모양으로 여행하지만 시장까지 오는 길은 사람들이 생각하는 것보다 깁니다."], ["Diversify banana farms so one disease cannot erase a plantation built from identical plants.", "똑같은 개체로 이루어진 농장이 한 질병에 사라지지 않도록 바나나 농장의 품종을 다양화해 주세요."], ["I cherish the tropical Earth that turns broad leaves and sunlight into generous bunches.", "나는 넓은 잎과 햇빛을 풍성한 송이로 바꾸는 열대의 지구를 소중히 여깁니다."]]}, {"number": 4, "kind": "과일", "name": "딸기", "english": "Strawberry", "file": "strawberry.gif", "sentences": [["My seeds sparkle on the outside, as if I refused to hide how a fruit begins.", "내 씨앗은 열매가 시작되는 모습을 숨기지 않겠다는 듯 겉에서 반짝입니다."], ["Use reusable mulch, healthy soil, and biological pest control to reduce plastic and chemicals in berry fields.", "재사용 덮개와 건강한 흙과 생물학적 방제로 딸기밭의 플라스틱과 화학물질을 줄여 주세요."], ["I love Earth in the first red strawberry that announces spring without a trumpet.", "나는 나팔도 없이 봄을 알리는 첫 붉은 딸기에서 지구를 사랑합니다."]]}, {"number": 5, "kind": "과일", "name": "포도", "english": "Grape", "file": "grape.gif", "sentences": [["We grow as a cluster because sweetness is a community achievement.", "우리는 단맛이 공동체의 성취이기에 한 송이로 모여 자랍니다."], ["Adapt vineyards with shade, soil cover, and careful irrigation rather than draining hotter landscapes.", "더워지는 땅의 물을 고갈시키지 말고 그늘과 지표 피복과 정밀 관수로 포도밭을 적응시켜 주세요."], ["Every vine curling around a support reminds me that Earth teaches cooperation.", "지지대를 감아 오르는 포도덩굴은 지구가 협력을 가르친다는 사실을 떠올리게 합니다."]]}, {"number": 6, "kind": "과일", "name": "수박", "english": "Watermelon", "file": "watermelon.gif", "sentences": [["My striped shell carries a reservoir across the hottest picnic season.", "내 줄무늬 껍질은 가장 더운 소풍철에 물 저장고를 운반합니다."], ["Grow me where water budgets fit the climate and use drip irrigation beneath protective mulch.", "기후에 맞는 물 사용 계획을 세우고 덮개 아래 점적관수로 수박을 길러 주세요."], ["I love a planet capable of hiding a cool red lake inside a green globe.", "나는 초록 구 안에 시원한 붉은 호수를 숨길 수 있는 지구를 사랑합니다."]]}, {"number": 7, "kind": "과일", "name": "참외", "english": "Korean Melon", "file": "korean_melon.gif", "sentences": [["Golden stripes mark me as a small summer sun from Korean fields.", "황금빛 줄무늬는 내가 한국의 들판에서 온 작은 여름 해임을 알려 줍니다."], ["Heat greenhouses efficiently and reuse nutrient water instead of letting energy and fertilizer escape.", "온실을 효율적으로 데우고 양분이 든 물을 재사용해 에너지와 비료가 새지 않게 해 주세요."], ["The fragrance of a ripe chamoe makes my local soil feel like home.", "잘 익은 참외 향기는 지역의 흙이 곧 고향임을 느끼게 합니다."]]}, {"number": 8, "kind": "과일", "name": "복숭아", "english": "Peach", "file": "peach.gif", "sentences": [["My soft fuzz protects flesh so tender that careless handling quickly becomes waste.", "내 부드러운 솜털은 조금만 거칠게 다뤄도 상하는 연약한 과육을 보호합니다."], ["Harvest at the right time and improve cool distribution so bruised peaches do not fill bins.", "알맞은 때 수확하고 저온 유통을 개선해 멍든 복숭아가 쓰레기통을 채우지 않게 해 주세요."], ["I love Earth for painting sunset colors on a fruit that fits in one palm.", "나는 한 손에 들어오는 열매에 노을빛을 칠하는 지구를 사랑합니다."]]}, {"number": 9, "kind": "과일", "name": "자두", "english": "Plum", "file": "plum.gif", "sentences": [["A silver bloom on my purple skin is natural protection, not dirt to be polished away.", "보랏빛 껍질의 은빛 과분은 닦아 내야 할 먼지가 아니라 자연의 보호막입니다."], ["Respect cosmetic imperfections and sell flavorful fruit before appearance turns it into waste.", "겉모양의 작은 흠을 존중하고 맛있는 자두가 외모 때문에 버려지기 전에 판매해 주세요."], ["Earth tastes wonderfully honest when a tart plum becomes sweet at the final moment.", "새콤한 자두가 마지막 순간 달콤해질 때 지구는 놀랍도록 솔직한 맛을 냅니다."]]}, {"number": 10, "kind": "과일", "name": "살구", "english": "Apricot", "file": "apricot.gif", "sentences": [["I am a brief orange season, which is why drying has preserved my sunshine for centuries.", "나는 짧게 머무는 주황빛 계절이기에 사람들은 오래전부터 말려서 내 햇살을 보존했습니다."], ["Use solar drying and small-scale processing to save surplus harvests without wasting energy.", "태양열 건조와 소규모 가공으로 에너지를 낭비하지 않고 남는 수확물을 살려 주세요."], ["I adore the Earth that lets summer remain in a winter jar.", "나는 여름이 겨울의 병 속에 머물게 하는 지구를 사랑합니다."]]}, {"number": 11, "kind": "과일", "name": "체리", "english": "Cherry", "file": "cherry.gif", "sentences": [["Two cherries on one stem look like a conversation held in red.", "한 줄기에 달린 두 체리는 붉은빛으로 나누는 대화처럼 보입니다."], ["Protect orchard workers and birds while using nets and nonlethal crop protection responsibly.", "그물과 비살상 방제를 책임 있게 사용하며 과수원 노동자와 새를 함께 보호해 주세요."], ["A flowering cherry orchard convinces me that beauty and food can share the same branch.", "꽃 핀 체리 과수원은 아름다움과 먹거리가 같은 가지를 나눌 수 있다고 알려 줍니다."]]}, {"number": 12, "kind": "과일", "name": "오렌지", "english": "Orange", "file": "orange.gif", "sentences": [["Peel my bright jacket and a dozen fragrant segments agree to share the space.", "밝은 겉옷을 벗기면 향긋한 여러 조각이 공간을 사이좋게 나눕니다."], ["Turn discarded citrus peel into feed, cleaners, oils, or compost rather than landfill methane.", "버린 감귤 껍질을 매립지의 메탄으로 만들지 말고 사료와 세정제와 향유와 퇴비로 활용해 주세요."], ["I love Earth for dividing sunlight into juicy pieces everyone can share.", "나는 햇빛을 모두가 나눌 수 있는 촉촉한 조각으로 나누는 지구를 사랑합니다."]]}, {"number": 13, "kind": "과일", "name": "귤", "english": "Mandarin", "file": "mandarin.gif", "sentences": [["My loose peel opens easily, making winter sunshine available even to small hands.", "느슨한 내 껍질은 쉽게 열려 작은 손에도 겨울 햇살을 건넵니다."], ["Support local citrus farms and use imperfect mandarins in juice instead of rejecting them.", "지역 감귤 농가를 돕고 모양이 고르지 않은 귤도 버리지 말고 주스로 활용해 주세요."], ["The scent released by one peeled mandarin can warm an entire cold room.", "귤 하나를 벗길 때 퍼지는 향기는 차가운 방 전체를 따뜻하게 할 수 있습니다."]]}, {"number": 14, "kind": "과일", "name": "레몬", "english": "Lemon", "file": "lemon.gif", "sentences": [["My sourness wakes sleepy flavors without demanding much sweetness of its own.", "내 신맛은 스스로 많은 단맛을 요구하지 않으면서 잠든 맛을 깨웁니다."], ["Use every part of citrus and replace wasteful chemical cleaners with safe peel-based alternatives where suitable.", "감귤의 모든 부분을 활용하고 가능한 곳에서는 낭비적인 화학 세정제를 안전한 껍질 활용 제품으로 바꿔 주세요."], ["I love Earth's bold decision to make yellow taste like lightning.", "나는 노란색에 번개 같은 맛을 담은 지구의 대담한 선택을 사랑합니다."]]}, {"number": 15, "kind": "과일", "name": "라임", "english": "Lime", "file": "lime.gif", "sentences": [["A small green squeeze can change an entire dish, proving influence is not measured by size.", "작은 초록 한 조각이 음식 전체를 바꾸니 영향력은 크기로 재지 않는다는 사실을 보여 줍니다."], ["Grow citrus with integrated pest management and protect farm water from fertilizer runoff.", "통합 병해충 관리로 감귤을 재배하고 비료가 농업용수를 오염시키지 않게 해 주세요."], ["I salute the tropical Earth with a fragrance as sharp and clean as rain.", "나는 비처럼 선명하고 깨끗한 향기로 열대의 지구에 인사합니다."]]}, {"number": 16, "kind": "과일", "name": "자몽", "english": "Grapefruit", "file": "grapefruit.gif", "sentences": [["My bitterness and sweetness sit at one table instead of canceling each other.", "내 쓴맛과 단맛은 서로를 지우지 않고 한 식탁에 앉습니다."], ["Label food interactions clearly and shorten refrigerated journeys through regional production where possible.", "식품과 약의 상호작용을 분명히 알리고 가능한 곳에서는 지역 생산으로 냉장 운송 거리를 줄여 주세요."], ["Earth earns my affection by making complexity refreshing.", "나는 복잡함을 상쾌함으로 바꾸는 지구를 사랑합니다."]]}, {"number": 17, "kind": "과일", "name": "망고", "english": "Mango", "file": "mango.gif", "sentences": [["I carry a golden monsoon around one broad, stubborn seed.", "나는 크고 단단한 씨 하나 둘레에 황금빛 몬순을 품고 있습니다."], ["Plant diverse mango varieties and provide shade and fair conditions for workers in hotter orchards.", "다양한 망고 품종을 심고 더워지는 과수원 노동자에게 그늘과 공정한 환경을 제공해 주세요."], ["I love Earth when tropical rain returns as fragrance on a summer table.", "열대의 비가 여름 식탁의 향기로 돌아올 때 나는 지구를 사랑합니다."]]}, {"number": 18, "kind": "과일", "name": "파인애플", "english": "Pineapple", "file": "pineapple.gif", "sentences": [["My crown is made of leaves, and my armor hides hundreds of flowers joined into one fruit.", "내 왕관은 잎으로 이루어지고 갑옷 속에는 수백 송이 꽃이 하나의 열매로 합쳐져 있습니다."], ["Use pineapple leaves for fiber and manage plantation soil so a harvest leaves more than erosion.", "파인애플 잎을 섬유로 활용하고 수확 뒤 침식만 남지 않도록 농장 흙을 관리해 주세요."], ["I admire an Earth that turns many tiny blossoms into one generous feast.", "나는 수많은 작은 꽃을 하나의 풍성한 잔치로 바꾸는 지구에 감탄합니다."]]}, {"number": 19, "kind": "과일", "name": "키위", "english": "Kiwi", "file": "kiwi.gif", "sentences": [["My plain brown coat conceals a green constellation of black seeds.", "수수한 갈색 외투 안에는 검은 씨앗으로 이루어진 초록 별자리가 숨어 있습니다."], ["Protect bee diversity and male and female vines while planning orchards for stable pollination.", "안정적인 수분을 위해 벌의 다양성과 암수 덩굴을 함께 보호하며 과수원을 계획해 주세요."], ["I love Earth for hiding galaxies inside modest skins.", "나는 소박한 껍질 안에 은하를 숨기는 지구를 사랑합니다."]]}, {"number": 20, "kind": "과일", "name": "멜론", "english": "Melon", "file": "melon.gif", "sentences": [["The net on my rind records growth like fine handwriting across a fragrant globe.", "내 껍질의 그물무늬는 향긋한 구 위에 성장의 기록을 섬세한 글씨처럼 남깁니다."], ["Match greenhouse heat and irrigation to real crop needs, not to wasteful habit.", "낭비적인 관행이 아니라 실제 작물의 필요에 맞춰 온실 난방과 관수를 조절해 주세요."], ["A ripe melon teaches me that patience can become perfume.", "잘 익은 멜론은 기다림이 향기가 될 수 있음을 가르칩니다."]]}, {"number": 21, "kind": "과일", "name": "블루베리", "english": "Blueberry", "file": "blueberry.gif", "sentences": [["A dusty blue bloom shields my skin while wild bees turn spring flowers into summer fruit.", "뿌연 푸른 과분은 내 껍질을 지키고 야생 벌은 봄꽃을 여름 열매로 바꿉니다."], ["Keep acidic soils healthy and create flowering habitat for native pollinators around berry farms.", "산성 토양을 건강하게 관리하고 베리 농장 주변에 토종 꽃가루받이 곤충의 꽃밭을 만들어 주세요."], ["I love Earth by the handful, each berry a tiny piece of twilight.", "나는 한 줌씩 지구를 사랑하며 열매 하나하나를 작은 황혼으로 여깁니다."]]}, {"number": 22, "kind": "과일", "name": "라즈베리", "english": "Raspberry", "file": "raspberry.gif", "sentences": [["I am built from many jewel-like drupelets that release the stem when perfectly ripe.", "나는 완전히 익으면 꼭지에서 떨어지는 보석 같은 작은 알갱이들의 집합입니다."], ["Pick gently, cool quickly, and transform surplus berries before their short freshness disappears.", "짧은 신선함이 사라지기 전에 조심히 따고 빠르게 식히며 남는 열매를 가공해 주세요."], ["Earth's delicacy is not weakness; my tender red form proves it.", "지구의 섬세함은 약함이 아니며 내 여린 붉은 모습이 그것을 증명합니다."]]}, {"number": 23, "kind": "과일", "name": "블랙베리", "english": "Blackberry", "file": "blackberry.gif", "sentences": [["My dark cluster ripens along thorny edges that also shelter birds and insects.", "내 검은 송이는 새와 곤충의 피난처가 되는 가시덤불 가장자리에서 익습니다."], ["Preserve hedgerows while controlling invasive brambles without destroying whole edge habitats.", "침입성 덩굴은 관리하되 가장자리 서식지 전체를 파괴하지 말고 생울타리를 보전해 주세요."], ["I love the untidy Earth where thorns can guard sweetness.", "나는 가시가 단맛을 지켜 주는 조금은 어수선한 지구를 사랑합니다."]]}, {"number": 24, "kind": "과일", "name": "크랜베리", "english": "Cranberry", "file": "cranberry.gif", "sentences": [["I float at harvest because air pockets hide inside my tart red body.", "시큼한 붉은 몸 안의 공기주머니 덕분에 나는 수확할 때 물 위에 뜹니다."], ["Protect wetlands and recycle harvest water instead of treating bogs as disposable factories.", "습지를 일회용 공장처럼 다루지 말고 수확용 물을 재사용하며 늪지를 보호해 주세요."], ["I cherish the bog where red berries, moss, water, and migrating birds meet.", "나는 붉은 열매와 이끼와 물과 철새가 만나는 늪을 소중히 여깁니다."]]}, {"number": 25, "kind": "과일", "name": "석류", "english": "Pomegranate", "file": "pomegranate.gif", "sentences": [["Break my leathery wall and hundreds of ruby chambers appear without losing their individuality.", "질긴 벽을 열면 수백 개의 루비빛 방이 각자의 모습을 잃지 않고 나타납니다."], ["Use drought-aware irrigation and value hardy orchards suited to dry regions.", "가뭄을 고려한 관수를 사용하고 건조한 지역에 알맞은 강인한 과수원을 소중히 해 주세요."], ["I love Earth as a crowded jewel box in which every seed still has room to shine.", "나는 모든 씨앗이 빛날 자리를 가진 붐비는 보석함 같은 지구를 사랑합니다."]]}, {"number": 26, "kind": "과일", "name": "감", "english": "Persimmon", "file": "persimmon.gif", "sentences": [["I wait through bare branches until cold air softens my autumn sweetness.", "나는 찬 공기가 가을의 단맛을 부드럽게 할 때까지 잎 없는 가지에서 기다립니다."], ["Preserve traditional trees and dry surplus fruit naturally to extend food beyond harvest season.", "전통 감나무를 보전하고 남는 열매를 자연 건조해 수확철 뒤까지 먹거리를 이어 주세요."], ["An orange persimmon against a gray sky is Earth's last warm lamp before winter.", "회색 하늘을 배경으로 한 주황빛 감은 겨울 전 지구가 켜는 마지막 따뜻한 등불입니다."]]}, {"number": 27, "kind": "과일", "name": "무화과", "english": "Fig", "file": "fig.gif", "sentences": [["My flowers bloom inward, where a tiny partnership turns secrecy into sweetness.", "내 꽃은 안쪽에서 피어나며 아주 작은 동반자와의 협력이 비밀을 단맛으로 바꿉니다."], ["Protect specialized pollinating wasps and ancient fig varieties rather than simplifying every orchard.", "모든 과수원을 단순화하지 말고 특별한 꽃가루받이 말벌과 오래된 무화과 품종을 보호해 주세요."], ["I love Earth for proving that hidden cooperation can feed an entire village.", "나는 보이지 않는 협력이 마을 전체를 먹일 수 있음을 증명하는 지구를 사랑합니다."]]}, {"number": 28, "kind": "과일", "name": "대추", "english": "Jujube", "file": "jujube.gif", "sentences": [["Sun and dry wind shrink my skin while concentrating the sweetness within.", "햇빛과 마른바람은 내 껍질을 줄이는 대신 안의 단맛을 모아 줍니다."], ["Choose hardy trees for dry farms and use low-energy drying to prevent autumn surpluses from spoiling.", "건조한 농장에는 강인한 나무를 선택하고 저에너지 건조로 가을의 남는 열매가 상하지 않게 해 주세요."], ["I respect the Earth that transforms wrinkling into preservation rather than decline.", "나는 주름을 쇠퇴가 아니라 보존으로 바꾸는 지구를 존중합니다."]]}, {"number": 29, "kind": "과일", "name": "코코넛", "english": "Coconut", "file": "coconut.gif", "sentences": [["I cross salt water in a fibrous boat carrying food, oil, fiber, and a future palm.", "나는 먹거리와 기름과 섬유와 미래의 야자나무를 실은 섬유질 배로 바닷물을 건넙니다."], ["Use husks and shells fully while protecting coastal farms from erosion and exploitative labor.", "껍질과 단단한 외피를 모두 활용하고 해안 농장을 침식과 착취 노동으로부터 보호해 주세요."], ["I love islands where nothing in a coconut needs to become waste.", "나는 코코넛의 어느 부분도 쓰레기가 되지 않는 섬을 사랑합니다."]]}, {"number": 30, "kind": "과일", "name": "아보카도", "english": "Avocado", "file": "avocado.gif", "sentences": [["My creamy green flesh has become fashionable far beyond the forests that first shaped me.", "내 부드러운 초록 과육은 나를 키운 숲을 훨씬 넘어 세계적인 유행이 되었습니다."], ["Measure water footprints, prevent deforestation, and pay growers fairly before calling any food healthy.", "어떤 음식을 건강하다고 부르기 전에 물 발자국을 측정하고 산림 파괴를 막으며 농민에게 정당하게 보상해 주세요."], ["Earth's richness should nourish people without leaving a thirsty landscape behind.", "지구의 풍요는 목마른 땅을 남기지 않으면서 사람을 먹여 살려야 합니다."]]}, {"number": 31, "kind": "과일", "name": "파파야", "english": "Papaya", "file": "papaya.gif", "sentences": [["My orange center holds black seeds like pepper scattered across sunrise.", "내 주황빛 중심에는 해돋이 위에 뿌린 후추처럼 검은 씨가 들어 있습니다."], ["Grow diverse disease-resistant papayas and share breeding knowledge with small tropical farms.", "다양하고 병에 강한 파파야를 기르고 육종 지식을 열대의 소규모 농가와 나눠 주세요."], ["I love warm Earth for turning a hollow trunk into breakfast shade and fruit.", "나는 속이 빈 줄기를 아침의 그늘과 열매로 바꾸는 따뜻한 지구를 사랑합니다."]]}, {"number": 32, "kind": "과일", "name": "구아바", "english": "Guava", "file": "guava.gif", "sentences": [["My perfume reaches you before my green skin reveals that I am ripe.", "내 향기는 초록 껍질이 익음을 알리기 전에 먼저 사람에게 닿습니다."], ["Support mixed tropical gardens where guava trees share space with food crops and wildlife.", "구아바나무가 다른 먹거리 작물과 야생생물과 공간을 나누는 혼합 열대 정원을 지원해 주세요."], ["Earth feels abundant when one small tree scents a whole courtyard.", "작은 나무 한 그루가 마당 전체를 향기롭게 할 때 지구는 풍요롭게 느껴집니다."]]}, {"number": 33, "kind": "과일", "name": "패션프루트", "english": "Passion Fruit", "file": "passion_fruit.gif", "sentences": [["My wrinkled shell may look tired, yet it often signals a fragrant interior ready to eat.", "주름진 껍질은 지쳐 보이지만 오히려 향긋한 속이 먹을 준비가 되었다는 신호일 수 있습니다."], ["Judge ripeness by knowledge rather than perfect appearance and train vines on durable reusable supports.", "완벽한 외모가 아니라 지식으로 익음을 판단하고 덩굴에는 튼튼한 재사용 지지대를 세워 주세요."], ["I love the Earth that rewards those willing to look beyond a wrinkled face.", "나는 주름진 얼굴 너머를 바라보는 이에게 보답하는 지구를 사랑합니다."]]}, {"number": 34, "kind": "과일", "name": "용과", "english": "Dragon Fruit", "file": "dragon_fruit.gif", "sentences": [["A night-blooming cactus flower becomes my pink scales by morning.", "밤에 피는 선인장 꽃은 아침이 오면 내 분홍 비늘이 됩니다."], ["Protect nocturnal pollinators and use cactus crops wisely in water-limited regions.", "야행성 꽃가루받이 동물을 보호하고 물이 부족한 지역에서 선인장 작물을 현명하게 활용해 주세요."], ["I adore an Earth where moonlit flowers can grow into dragons without fire.", "나는 달빛 꽃이 불을 뿜지 않는 용으로 자라는 지구를 사랑합니다."]]}, {"number": 35, "kind": "과일", "name": "두리안", "english": "Durian", "file": "durian.gif", "sentences": [["My armored shell and fearless smell ensure that nobody meets me without forming an opinion.", "내 갑옷 같은 껍질과 대담한 냄새는 누구도 나를 무심히 지나치지 못하게 합니다."], ["Keep old rainforest trees and bat pollinators near orchards instead of replacing ecosystems with monoculture.", "생태계를 단일재배로 바꾸지 말고 과수원 주변의 오래된 열대 나무와 박쥐 꽃가루받이 동물을 지켜 주세요."], ["I love Earth for allowing strong character, strange perfume, and sweetness to share one fruit.", "나는 강한 개성과 독특한 향과 단맛을 한 열매에 허락한 지구를 사랑합니다."]]}, {"number": 36, "kind": "과일", "name": "리치", "english": "Lychee", "file": "lychee.gif", "sentences": [["A rough red shell protects translucent sweetness that bruises soon after harvest.", "거친 붉은 껍질은 수확 뒤 금세 상하는 투명한 단맛을 보호합니다."], ["Improve efficient cooling and protect pollinator-rich mixed orchards in subtropical regions.", "효율적인 냉각 유통을 개선하고 아열대 지역의 꽃가루받이 곤충이 풍부한 혼합 과수원을 보호해 주세요."], ["Peeling a lychee feels like opening a small pearl offered by summer.", "리치 껍질을 벗기는 일은 여름이 건넨 작은 진주를 여는 것 같습니다."]]}, {"number": 37, "kind": "과일", "name": "람부탄", "english": "Rambutan", "file": "rambutan.gif", "sentences": [["My soft red hairs look wild, but the fruit beneath them is calm and clear.", "내 부드러운 붉은 털은 거칠어 보이지만 그 아래의 과육은 차분하고 투명합니다."], ["Maintain tropical tree diversity and turn pruned branches and peels into useful organic matter.", "열대 과수의 다양성을 유지하고 잘라 낸 가지와 껍질을 유용한 유기물로 되돌려 주세요."], ["I love an Earth where the unusual is welcomed before it is judged.", "나는 낯선 모습을 판단하기 전에 반겨 주는 지구를 사랑합니다."]]}, {"number": 38, "kind": "과일", "name": "망고스틴", "english": "Mangosteen", "file": "mangosteen.gif", "sentences": [["A thick purple rind hides white segments arranged like a quiet flower.", "두꺼운 보라색 껍질 안에는 조용한 꽃처럼 배열된 하얀 조각이 숨어 있습니다."], ["Protect slow-growing tropical orchards and reduce losses caused by long, poorly managed transport.", "천천히 자라는 열대 과수원을 보호하고 길고 서투른 운송에서 생기는 손실을 줄여 주세요."], ["I treasure Earth's ability to place snow-white softness inside royal purple.", "나는 고귀한 보라색 안에 눈처럼 하얀 부드러움을 넣는 지구의 능력을 소중히 여깁니다."]]}, {"number": 39, "kind": "과일", "name": "스타프루트", "english": "Star Fruit", "file": "star_fruit.gif", "sentences": [["Slice me across the middle and an ordinary fruit reveals a five-pointed star.", "나를 가로로 자르면 평범한 열매 속에서 다섯 갈래 별이 나타납니다."], ["Use integrated pest control and local processing so fragile tropical harvests reach tables intact.", "통합 병해충 관리와 지역 가공을 활용해 연약한 열대 수확물이 온전히 식탁에 닿게 해 주세요."], ["I love the idea that Earth hides stars where a kitchen knife can find them.", "나는 부엌칼이 찾을 수 있는 곳에 별을 숨겨 둔 지구의 생각을 사랑합니다."]]}, {"number": 40, "kind": "과일", "name": "금귤", "english": "Kumquat", "file": "kumquat.gif", "sentences": [["Unlike larger citrus, I invite you to eat my sweet peel and tart center together.", "큰 감귤과 달리 나는 달콤한 껍질과 새콤한 속을 함께 먹으라고 권합니다."], ["Value small fruit and whole-fruit recipes that reduce peeling waste and celebrate seasonal harvests.", "작은 열매와 통째로 쓰는 조리법을 소중히 하여 껍질 쓰레기를 줄이고 제철 수확을 즐겨 주세요."], ["I love Earth in one bright bite where opposites refuse to separate.", "나는 서로 반대되는 맛이 헤어지지 않는 밝은 한입 속에서 지구를 사랑합니다."]]}, {"number": 41, "kind": "과일", "name": "한라봉", "english": "Hallabong", "file": "hallabong.gif", "sentences": [["My raised top resembles a small mountain shaped by Jeju wind and winter sun.", "솟아오른 꼭지는 제주 바람과 겨울 햇살이 빚은 작은 산을 닮았습니다."], ["Power greenhouses efficiently and strengthen island farming against storms and changing temperatures.", "온실 에너지를 효율적으로 사용하고 폭풍과 기온 변화에 섬 농업이 견디도록 힘을 길러 주세요."], ["My fragrance is a postcard from volcanic soil to every winter table.", "내 향기는 화산 토양이 겨울 식탁마다 보내는 엽서입니다."]]}, {"number": 42, "kind": "과일", "name": "천혜향", "english": "Cheonhyehyang", "file": "cheonhyehyang.gif", "sentences": [["My name promises heavenly fragrance, but that perfume begins with patient farmers and healthy soil.", "내 이름은 하늘이 내린 향을 약속하지만 그 향기는 농민의 인내와 건강한 흙에서 시작됩니다."], ["Reward quality without forcing excessive heating or cosmetic perfection in citrus production.", "감귤 생산에서 과도한 난방과 외형의 완벽함을 강요하지 말고 진정한 품질에 보상해 주세요."], ["I love Earth when careful cultivation becomes aroma rather than invisible waste.", "세심한 재배가 보이지 않는 낭비가 아니라 향기가 될 때 나는 지구를 사랑합니다."]]}, {"number": 43, "kind": "과일", "name": "유자", "english": "Yuzu", "file": "yuzu.gif", "sentences": [["I am too tart to disappear casually, so cooks preserve my peel, juice, and scent with care.", "나는 무심히 먹어 없어지기에는 너무 새콤해서 사람들은 껍질과 즙과 향을 정성껏 보존합니다."], ["Maintain regional yuzu groves and use low-sugar preservation and complete-fruit processing.", "지역 유자밭을 유지하고 당을 줄인 보존법과 열매 전체를 쓰는 가공을 활용해 주세요."], ["A spoonful of yuzu tea lets winter borrow a golden voice from autumn.", "유자차 한 숟갈은 겨울이 가을의 황금빛 목소리를 빌리게 합니다."]]}, {"number": 44, "kind": "과일", "name": "모과", "english": "Quince", "file": "quince.gif", "sentences": [["My hard flesh and deep perfume ask for transformation rather than instant convenience.", "단단한 과육과 깊은 향기는 즉각적인 편리함보다 변화를 기다려 달라고 말합니다."], ["Preserve hardy garden trees and process fallen quince before fragrance becomes food waste.", "강인한 정원 나무를 지키고 떨어진 모과의 향기가 음식물 쓰레기가 되기 전에 가공해 주세요."], ["I admire Earth for making patience an ingredient.", "나는 기다림을 하나의 재료로 만드는 지구를 존경합니다."]]}, {"number": 45, "kind": "과일", "name": "매실", "english": "Japanese Apricot", "file": "japanese_apricot.gif", "sentences": [["I arrive green and sharply sour, inviting time to finish the work that the tree began.", "나는 푸르고 매우 새콤한 모습으로 와서 나무가 시작한 일을 시간이 마무리하게 합니다."], ["Use safe fermentation, reusable containers, and local harvest networks to prevent surplus waste.", "안전한 발효와 재사용 용기와 지역 수확 연결망으로 남는 열매의 낭비를 막아 주세요."], ["I love Earth through the slow alchemy that turns spring fruit into a year of flavor.", "나는 봄 열매를 한 해의 맛으로 바꾸는 느린 변화 속에서 지구를 사랑합니다."]]}, {"number": 46, "kind": "과일", "name": "오디", "english": "Mulberry", "file": "mulberry.gif", "sentences": [["My dark juice stains fingers with proof that eating can be a memorable encounter.", "내 검은 즙은 먹는 일이 기억에 남는 만남이라는 증거를 손가락에 물들입니다."], ["Plant mulberry trees in diverse farms where fruit, leaves, birds, and silkworm traditions coexist.", "열매와 잎과 새와 누에의 전통이 공존하는 다양한 농장에 뽕나무를 심어 주세요."], ["I love an Earth that signs its summer letters in purple ink.", "나는 여름 편지에 보라색 잉크로 서명하는 지구를 사랑합니다."]]}, {"number": 47, "kind": "과일", "name": "앵두", "english": "Nanking Cherry", "file": "nanking_cherry.gif", "sentences": [["I glow like a tiny red bead on a shrub that can shelter a garden edge.", "나는 정원 가장자리를 보호하는 관목 위에서 작은 붉은 구슬처럼 빛납니다."], ["Keep edible hedges and share small local harvests that industrial markets often overlook.", "먹을 수 있는 생울타리를 보전하고 대형 시장이 지나치는 작은 지역 수확물을 나눠 주세요."], ["Earth's generosity sometimes arrives in fruits too small for a supermarket standard.", "지구의 너그러움은 때로 슈퍼마켓 규격에 너무 작은 열매로 찾아옵니다."]]}, {"number": 48, "kind": "과일", "name": "보이즌베리", "english": "Boysenberry", "file": "boysenberry.gif", "sentences": [["I carry the tangled family history of several berries in one deep-colored fruit.", "나는 여러 베리의 얽힌 가족사를 짙은 색 열매 하나에 품고 있습니다."], ["Protect crop diversity and keep rare varieties alive through community gardens and seed collections.", "공동체 정원과 유전자원 보존으로 작물 다양성을 지키고 희귀 품종을 살아 있게 해 주세요."], ["I love Earth for creating new flavor without erasing its ancestors.", "나는 조상을 지우지 않고 새로운 맛을 만들어 내는 지구를 사랑합니다."]]}, {"number": 49, "kind": "과일", "name": "아사이베리", "english": "Acai Berry", "file": "acai_berry.gif", "sentences": [["I grow high on Amazon palms and became famous far from the communities that first valued me.", "나는 아마존 야자나무 높이 자라며 처음 나를 소중히 여긴 공동체에서 멀리 떨어진 곳까지 유명해졌습니다."], ["Support forest-based harvests and fair local livelihoods instead of clearing diverse Amazon land.", "다양한 아마존 숲을 없애지 말고 숲 기반 수확과 지역 주민의 공정한 생계를 지원해 주세요."], ["The rainforest I love is worth more standing than flattened for a passing trend.", "내가 사랑하는 열대우림은 한때의 유행을 위해 밀어 버리는 것보다 서 있을 때 훨씬 가치 있습니다."]]}, {"number": 50, "kind": "과일", "name": "잭프루트", "english": "Jackfruit", "file": "jackfruit.gif", "sentences": [["I grow directly from a sturdy trunk because an enormous fruit needs serious support.", "거대한 열매에는 든든한 지지가 필요하기에 나는 튼튼한 줄기에서 바로 자랍니다."], ["Use adaptable tree crops and turn seeds, flesh, and fiber into food with very little waste.", "적응력 있는 나무 작물을 활용하고 씨와 과육과 섬유를 거의 버리지 않고 먹거리로 만들어 주세요."], ["I love Earth for hanging a whole neighborhood meal from one tree.", "나는 나무 한 그루에 온 동네의 식사를 매달아 주는 지구를 사랑합니다."]]}, {"number": 51, "kind": "채소", "name": "당근", "english": "Carrot", "file": "carrot.gif", "sentences": [["Most of my bright orange work happens underground, beyond the applause of sunlight.", "내 밝은 주황빛 작업 대부분은 햇빛의 박수도 들리지 않는 땅속에서 이루어집니다."], ["Build loose living soil and sell crooked roots instead of wasting vegetables for shape alone.", "부드럽고 살아 있는 흙을 만들고 모양만으로 굽은 뿌리채소를 버리지 말고 판매해 주세요."], ["I love Earth for coloring the darkness beneath our feet.", "나는 우리 발밑의 어둠을 물들이는 지구를 사랑합니다."]]}, {"number": 52, "kind": "채소", "name": "감자", "english": "Potato", "file": "potato.gif", "sentences": [["I multiply quietly beneath a modest plant and have fed societies through difficult seasons.", "나는 수수한 식물 아래에서 조용히 늘어나 어려운 계절마다 사람들을 먹여 살렸습니다."], ["Rotate crops, protect soil health, and store tubers well so blight and waste do not rule the harvest.", "돌려짓기와 건강한 토양과 알맞은 저장으로 역병과 낭비가 수확을 지배하지 않게 해 주세요."], ["A humble potato reminds me that Earth often hides abundance out of sight.", "소박한 감자는 지구가 종종 보이지 않는 곳에 풍요를 숨긴다는 사실을 일깨웁니다."]]}, {"number": 53, "kind": "채소", "name": "고구마", "english": "Sweet Potato", "file": "sweet_potato.gif", "sentences": [["My vines cover the soil while swollen roots store sunlight for lean months.", "내 덩굴은 흙을 덮고 굵은 뿌리는 먹거리가 부족한 달을 위해 햇빛을 저장합니다."], ["Use me in climate-resilient farming and eat nutritious leaves as well as roots where appropriate.", "기후 회복력 농업에 나를 활용하고 알맞은 곳에서는 뿌리뿐 아니라 영양 많은 잎도 먹어 주세요."], ["I love the Earth that makes both my spreading roof and buried treasure edible.", "나는 뻗어 가는 지붕과 묻힌 보물 모두를 먹을 수 있게 만든 지구를 사랑합니다."]]}, {"number": 54, "kind": "채소", "name": "양파", "english": "Onion", "file": "onion.gif", "sentences": [["Peel away my layers and I may bring tears before I bring sweetness to the pan.", "내 겹을 벗기면 팬에 단맛을 내기 전에 먼저 눈물이 날 수 있습니다."], ["Cure and store bulbs efficiently, and compost skins rather than sending them to mixed waste.", "구근을 효율적으로 말리고 저장하며 껍질은 일반 쓰레기가 아니라 퇴비로 보내 주세요."], ["Earth speaks honestly through me: growth has layers, and flavor may begin with tears.", "성장에는 여러 겹이 있고 맛은 눈물에서 시작될 수 있다고 지구는 나를 통해 솔직히 말합니다."]]}, {"number": 55, "kind": "채소", "name": "대파", "english": "Green Onion", "file": "green_onion.gif", "sentences": [["Cut my green leaves and careful regrowth can offer another harvest from the same base.", "내 초록 잎을 잘라도 잘 돌보면 같은 밑동에서 다시 수확할 수 있습니다."], ["Regrow kitchen ends, plan succession planting, and use the whole stalk from white to green.", "부엌에서 남은 뿌리를 다시 기르고 이어짓기를 계획하며 흰 부분부터 초록 잎까지 모두 사용해 주세요."], ["I love Earth's gentle habit of saying, 'Try growing again.'", "나는 ‘다시 자라 보렴’이라고 다정히 말하는 지구의 습관을 사랑합니다."]]}, {"number": 56, "kind": "채소", "name": "마늘", "english": "Garlic", "file": "garlic.gif", "sentences": [["One bulb divides into cloves, each carrying the plan for another whole plant.", "구근 하나는 여러 쪽으로 나뉘며 각 쪽은 다시 온전한 식물이 될 설계도를 품습니다."], ["Save locally adapted garlic seed and reduce unnecessary chemical treatment through healthy rotations.", "지역에 적응한 마늘 종구를 보전하고 건강한 돌려짓기로 불필요한 화학 처리를 줄여 주세요."], ["I love Earth when a small clove gives courage to soil and supper alike.", "작은 마늘 한 쪽이 흙과 저녁 식사 모두에 힘을 줄 때 나는 지구를 사랑합니다."]]}, {"number": 57, "kind": "채소", "name": "배추", "english": "Napa Cabbage", "file": "napa_cabbage.gif", "sentences": [["My broad leaves fold inward like a green book written for winter kimchi.", "내 넓은 잎은 겨울 김치를 위해 쓰인 초록 책처럼 안쪽으로 포개집니다."], ["Match planting to weather, protect soil, and share surplus cabbages before price swings create waste.", "날씨에 맞춰 심고 흙을 보호하며 가격 변동으로 낭비되기 전에 남는 배추를 나눠 주세요."], ["I treasure the Earth that lets a field continue living through fermentation.", "나는 밭의 생명이 발효를 통해 계속 이어지게 하는 지구를 소중히 여깁니다."]]}, {"number": 58, "kind": "채소", "name": "양배추", "english": "Cabbage", "file": "cabbage.gif", "sentences": [["I wrap leaf around leaf until a loose plant becomes a firm green globe.", "나는 느슨한 식물이 단단한 초록 구가 될 때까지 잎으로 잎을 감쌉니다."], ["Use crop rotation and beneficial insects to manage pests without exhausting soil or spraying blindly.", "흙을 지치게 하거나 무분별하게 약을 뿌리지 말고 돌려짓기와 천적 곤충으로 해충을 관리해 주세요."], ["My many leaves make one head, a small model of Earth's cooperation.", "수많은 잎이 머리 하나를 이루는 내 모습은 지구 협력의 작은 모형입니다."]]}, {"number": 59, "kind": "채소", "name": "상추", "english": "Lettuce", "file": "lettuce.gif", "sentences": [["I turn seed into a tender bowl of leaves faster than many crops can make a plan.", "나는 많은 작물이 계획을 세우기도 전에 씨앗을 부드러운 잎 그릇으로 바꿉니다."], ["Grow me near consumers and use precise water systems because freshness should not require long transport.", "신선함 때문에 긴 운송이 필요하지 않도록 소비지 가까이에서 정밀한 물 관리로 길러 주세요."], ["I love Earth in the cool crunch of a leaf harvested minutes before lunch.", "나는 점심 몇 분 전에 수확한 잎의 시원한 아삭함 속에서 지구를 사랑합니다."]]}, {"number": 60, "kind": "채소", "name": "시금치", "english": "Spinach", "file": "spinach.gif", "sentences": [["Cold weather can deepen my sweetness while my green leaves gather brief winter light.", "추운 날씨는 내 단맛을 깊게 하고 초록 잎은 짧은 겨울 햇빛을 모읍니다."], ["Protect leafy greens with clean water and cool storage, and use stems rather than trimming away nutrition.", "깨끗한 물과 저온 저장으로 잎채소를 지키고 영양 많은 줄기를 잘라 버리지 말고 활용해 주세요."], ["Earth's quiet strength tastes green in a winter spinach leaf.", "지구의 조용한 힘은 겨울 시금치 잎에서 초록빛 맛이 납니다."]]}, {"number": 61, "kind": "채소", "name": "오이", "english": "Cucumber", "file": "cucumber.gif", "sentences": [["I climb by curling tendrils and store cool water behind a prickly green skin.", "나는 말린 덩굴손으로 올라가며 가시 돋친 초록 껍질 뒤에 시원한 물을 저장합니다."], ["Train vines vertically and irrigate at the roots to save land, reduce disease, and waste less water.", "덩굴을 세로로 유인하고 뿌리에 물을 주어 땅과 물을 아끼고 병을 줄여 주세요."], ["I love Earth for making refreshment grow on a climbing thread.", "나는 가느다란 덩굴에 상쾌함을 자라게 하는 지구를 사랑합니다."]]}, {"number": 62, "kind": "채소", "name": "토마토", "english": "Tomato", "file": "tomato.gif", "sentences": [["Botanically a fruit and commonly a vegetable, I refuse to let one label limit my usefulness.", "식물학적으로는 과일이고 흔히 채소로 쓰이는 나는 한 가지 이름이 쓰임을 제한하게 두지 않습니다."], ["Grow diverse disease-resistant varieties and capture greenhouse heat and water efficiently.", "다양하고 병에 강한 품종을 기르며 온실의 열과 물을 효율적으로 활용해 주세요."], ["I love a planet where sunlight can become sauce, salad, seed, and debate.", "나는 햇빛이 소스와 샐러드와 씨앗과 토론이 되는 지구를 사랑합니다."]]}, {"number": 63, "kind": "채소", "name": "방울토마토", "english": "Cherry Tomato", "file": "cherry_tomato.gif", "sentences": [["I pack a full tomato summer into a bite small enough to roll away.", "나는 굴러갈 만큼 작은 한입에 토마토의 여름 전체를 담습니다."], ["Harvest whole clusters carefully and use reusable packaging instead of burying small fruit in plastic.", "송이째 조심히 수확하고 작은 열매를 플라스틱에 파묻지 말고 재사용 포장을 활용해 주세요."], ["Earth gives me joy in miniature without making the flavor small.", "지구는 맛은 줄이지 않은 채 기쁨을 작은 크기로 나에게 줍니다."]]}, {"number": 64, "kind": "채소", "name": "가지", "english": "Eggplant", "file": "eggplant.gif", "sentences": [["My purple skin shines like evening, while my pale flesh eagerly absorbs the flavors around it.", "내 보라색 껍질은 저녁처럼 빛나고 하얀 속은 주변의 맛을 기꺼이 받아들입니다."], ["Use mulch and crop rotation to conserve moisture and interrupt soil-borne disease.", "덮개와 돌려짓기로 수분을 보전하고 토양 병해의 고리를 끊어 주세요."], ["I love Earth's lesson that openness can be a culinary strength.", "나는 받아들이는 마음이 요리의 강점이 될 수 있다는 지구의 교훈을 사랑합니다."]]}, {"number": 65, "kind": "채소", "name": "애호박", "english": "Korean Zucchini", "file": "korean_zucchini.gif", "sentences": [["I grow so quickly that yesterday's flower can soon become tomorrow's oversized squash.", "나는 너무 빨리 자라 어제의 꽃이 곧 내일의 커다란 호박이 될 수 있습니다."], ["Harvest at useful sizes and cook blossoms or surplus fruit before rapid growth becomes waste.", "알맞은 크기에 수확하고 빠른 성장이 낭비가 되기 전에 꽃과 남는 열매도 요리해 주세요."], ["I admire Earth's speed when a soft green fruit seems to appear overnight.", "나는 부드러운 초록 열매가 하룻밤 사이 나타나는 듯한 지구의 속도에 감탄합니다."]]}, {"number": 66, "kind": "채소", "name": "단호박", "english": "Kabocha Squash", "file": "kabocha.gif", "sentences": [["My hard green shell stores dense orange sweetness long after the vine has dried.", "단단한 초록 껍질은 덩굴이 마른 뒤에도 짙은 주황빛 단맛을 오래 저장합니다."], ["Cure squash properly and rely on its natural storage life instead of unnecessary refrigeration.", "호박을 알맞게 후숙하고 불필요한 냉장 대신 본래의 저장성을 활용해 주세요."], ["I love Earth for packaging winter comfort in a durable bowl.", "나는 겨울의 포근함을 튼튼한 그릇에 포장하는 지구를 사랑합니다."]]}, {"number": 67, "kind": "채소", "name": "늙은호박", "english": "Pumpkin", "file": "pumpkin.gif", "sentences": [["Time makes me larger, tougher, and ready to carry autumn into the cold season.", "시간은 나를 더 크고 단단하게 만들어 가을을 추운 계절까지 운반할 준비를 시킵니다."], ["Save seeds, eat flesh, compost fibers, and treat carved pumpkins as food rather than disposable decoration.", "씨는 보관하고 과육은 먹고 섬유는 퇴비로 보내며 조각한 호박도 일회용 장식이 아니라 음식으로 대해 주세요."], ["My golden interior is Earth's warm answer to a longer night.", "내 황금빛 속은 길어진 밤에 지구가 보내는 따뜻한 대답입니다."]]}, {"number": 68, "kind": "채소", "name": "브로콜리", "english": "Broccoli", "file": "broccoli.gif", "sentences": [["People eat my unopened flower buds before my yellow bloom surprises them.", "사람들은 노란 꽃이 피어 놀라게 하기 전에 열리지 않은 내 꽃봉오리를 먹습니다."], ["Use stems and leaves as food and protect brassica fields through rotation and biological control.", "줄기와 잎도 먹거리로 쓰고 돌려짓기와 생물학적 방제로 배추과 밭을 보호해 주세요."], ["I love Earth for serving a green forest on a dinner plate.", "나는 저녁 접시에 초록 숲을 차려 주는 지구를 사랑합니다."]]}, {"number": 69, "kind": "채소", "name": "콜리플라워", "english": "Cauliflower", "file": "cauliflower.gif", "sentences": [["My pale curd stays tender because broad leaves shelter it from strong sun.", "내 하얀 꽃덩이는 넓은 잎이 강한 햇빛을 가려 주어 부드럽게 자랍니다."], ["Accept cream, purple, and uneven heads while using the leaves and core instead of discarding them.", "크림색과 보라색과 고르지 않은 모양도 받아들이고 잎과 중심 줄기도 버리지 말고 사용해 주세요."], ["Earth reminds me that protection can create softness without hiding worth.", "보호는 가치를 숨기지 않으면서 부드러움을 만들 수 있다고 지구는 알려 줍니다."]]}, {"number": 70, "kind": "채소", "name": "파프리카", "english": "Bell Pepper", "file": "bell_pepper.gif", "sentences": [["Green, yellow, orange, and red can be stages of one fruit rather than four different arguments.", "초록과 노랑과 주황과 빨강은 네 가지 다툼이 아니라 한 열매의 서로 다른 성장 단계일 수 있습니다."], ["Harvest for true demand and avoid heated perfection that spends too much energy on color.", "실제 수요에 맞춰 수확하고 색을 완벽하게 만들려고 지나친 난방 에너지를 쓰지 말아 주세요."], ["I love Earth for letting ripeness conduct an orchestra of colors.", "나는 익음이 여러 색의 오케스트라를 지휘하게 하는 지구를 사랑합니다."]]}, {"number": 71, "kind": "채소", "name": "피망", "english": "Green Pepper", "file": "green_pepper.gif", "sentences": [["I am harvested while green, carrying a fresh bitterness that later ripeness would transform.", "나는 초록일 때 수확되어 나중의 익음이 바꿀 신선한 쌉쌀함을 지니고 있습니다."], ["Value every maturity stage and plan harvests so edible peppers are not rejected for minor scars.", "모든 성장 단계를 가치 있게 여기고 작은 흠 때문에 먹을 수 있는 피망이 버려지지 않도록 수확을 계획해 주세요."], ["Earth tastes lively when youth is appreciated without pretending to be sweetness.", "젊음이 단맛인 척하지 않아도 존중받을 때 지구는 생기 있는 맛을 냅니다."]]}, {"number": 72, "kind": "채소", "name": "고추", "english": "Chili Pepper", "file": "chili_pepper.gif", "sentences": [["A small amount of my heat can travel through an entire pot and awaken every ingredient.", "내 매운맛은 적은 양으로도 냄비 전체를 돌아다니며 모든 재료를 깨웁니다."], ["Preserve local pepper varieties and dry harvests efficiently with sun or clean energy.", "지역 고추 품종을 보전하고 햇빛이나 청정에너지로 수확물을 효율적으로 말려 주세요."], ["I love Earth's spark, measured not in flames but in flavor.", "나는 불꽃이 아니라 풍미로 측정되는 지구의 불씨를 사랑합니다."]]}, {"number": 73, "kind": "채소", "name": "청양고추", "english": "Cheongyang Chili Pepper", "file": "cheongyang_chili.gif", "sentences": [["My fierce Korean heat arrives from a slender green body that never needs to shout about its size.", "한국의 강렬한 매운맛은 크기를 자랑할 필요 없는 가느다란 초록 몸에서 나옵니다."], ["Protect regional seed identity and help farms adapt pungent crops to unstable heat and rainfall.", "지역 종자의 정체성을 지키고 불안정한 기온과 강수에 매운 작물이 적응하도록 농가를 도와주세요."], ["I love Earth for proving that courage can fit inside one green bite.", "나는 용기가 초록 한입 안에도 들어갈 수 있음을 보여 주는 지구를 사랑합니다."]]}, {"number": 74, "kind": "채소", "name": "무", "english": "Korean Radish", "file": "korean_radish.gif", "sentences": [["My white root swells underground while green leaves announce that no part needs to be wasted.", "내 하얀 뿌리는 땅속에서 굵어지고 초록 잎은 어느 부분도 버릴 필요가 없다고 알립니다."], ["Use roots, greens, and dried leaves, and manage autumn surpluses through storage and community sharing.", "뿌리와 잎과 말린 시래기를 모두 쓰고 가을의 남는 수확을 저장과 공동 나눔으로 관리해 주세요."], ["I love the Earth that writes winter kimchi with a root grown in darkness.", "나는 어둠 속에서 자란 뿌리로 겨울 김치를 쓰는 지구를 사랑합니다."]]}, {"number": 75, "kind": "채소", "name": "순무", "english": "Turnip", "file": "turnip.gif", "sentences": [["I place a round edible shoulder at the soil line, halfway between the underground and the sky.", "나는 땅속과 하늘의 중간인 지표면에 둥글고 먹을 수 있는 어깨를 내놓습니다."], ["Grow quick cool-season roots between major crops to cover soil and diversify harvests.", "주요 작물 사이에 빨리 자라는 서늘한 계절 뿌리작물을 심어 흙을 덮고 수확을 다양화해 주세요."], ["My position teaches me to love both the dark earth and open air equally.", "내 자리는 어두운 흙과 열린 공기를 똑같이 사랑하라고 가르칩니다."]]}, {"number": 76, "kind": "채소", "name": "연근", "english": "Lotus Root", "file": "lotus_root.gif", "sentences": [["My tunnels of air run through the mud, connecting an elegant flower to an edible underwater stem.", "내 공기 통로는 진흙을 지나 우아한 꽃과 먹을 수 있는 물속줄기를 연결합니다."], ["Protect ponds from pollution and harvest lotus without destroying the wetland community around it.", "연못을 오염에서 지키고 주변 습지 공동체를 파괴하지 않으면서 연근을 수확해 주세요."], ["I love Earth for drawing lace inside a root hidden in brown water.", "나는 갈색 물속에 숨은 뿌리 안에 레이스를 그리는 지구를 사랑합니다."]]}, {"number": 77, "kind": "채소", "name": "우엉", "english": "Burdock Root", "file": "burdock_root.gif", "sentences": [["My root travels deep, and my hooked burrs once inspired a human fastening invention.", "내 뿌리는 깊이 내려가고 갈고리 열매는 인간의 새로운 접착 장치 발명에 영감을 주었습니다."], ["Loosen soil with organic matter and harvest carefully so deep roots do not demand destructive tillage.", "유기물로 흙을 부드럽게 하고 깊은 뿌리를 캐느라 땅을 파괴하지 않도록 조심히 수확해 주세요."], ["I love Earth where a stubborn seed hook can teach engineers a new idea.", "나는 끈질긴 씨앗 갈고리도 기술자에게 새 생각을 가르치는 지구를 사랑합니다."]]}, {"number": 78, "kind": "채소", "name": "셀러리", "english": "Celery", "file": "celery.gif", "sentences": [["Water rises through my crisp stalks along channels that crunch when bitten.", "물은 한입 베면 아삭한 소리를 내는 내 줄기의 통로를 따라 올라갑니다."], ["Use efficient irrigation and market outer stalks and leaves instead of trimming me into wasteful perfection.", "효율적으로 물을 주고 완벽한 모양으로 다듬어 낭비하지 말고 바깥 줄기와 잎도 판매해 주세요."], ["I love Earth's green plumbing, built without metal or pumps.", "나는 금속이나 펌프 없이 만든 지구의 초록 배관을 사랑합니다."]]}, {"number": 79, "kind": "채소", "name": "아스파라거스", "english": "Asparagus", "file": "asparagus.gif", "sentences": [["Each spear pushes from a perennial crown that can keep producing for many springs.", "내 창 모양 새순은 여러 봄 동안 계속 생산할 수 있는 여러해살이 뿌리에서 올라옵니다."], ["Protect long-lived beds with compost and careful weed control rather than repeatedly disturbing soil.", "흙을 계속 뒤집지 말고 퇴비와 세심한 잡초 관리로 오래 사는 밭을 보호해 주세요."], ["I love Earth for sending the same roots a fresh green message every year.", "나는 같은 뿌리에서 해마다 신선한 초록 소식을 보내는 지구를 사랑합니다."]]}, {"number": 80, "kind": "채소", "name": "콩나물", "english": "Soybean Sprouts", "file": "soybean_sprouts.gif", "sentences": [["In darkness and water, a hard soybean becomes a pale, crisp stem within days.", "어둠과 물속에서 단단한 콩은 며칠 만에 하얗고 아삭한 줄기로 변합니다."], ["Grow sprouts with safe recycled systems and use energy-efficient temperature control close to consumers.", "안전한 순환식 물 관리와 에너지 효율적인 온도 조절로 소비지 가까이에서 콩나물을 길러 주세요."], ["I admire Earth's talent for turning stored possibility into rapid growth.", "나는 저장된 가능성을 빠른 성장으로 바꾸는 지구의 재능에 감탄합니다."]]}, {"number": 81, "kind": "채소", "name": "숙주나물", "english": "Mung Bean Sprouts", "file": "mung_bean_sprouts.gif", "sentences": [["I rise from a small mung bean with a delicate stem that asks to be eaten fresh.", "나는 작은 녹두에서 여린 줄기로 올라와 신선할 때 먹어 달라고 요청합니다."], ["Keep sprouting water clean and shorten distribution so freshness does not depend on excessive packaging.", "재배용 물을 깨끗이 하고 유통 거리를 줄여 신선함이 과도한 포장에 의존하지 않게 해 주세요."], ["Earth whispers through my growth that beginnings need little more than care, water, and time.", "시작에는 돌봄과 물과 시간이면 충분하다고 지구는 내 성장을 통해 속삭입니다."]]}, {"number": 82, "kind": "채소", "name": "깻잎", "english": "Perilla Leaf", "file": "perilla_leaf.gif", "sentences": [["Touch my serrated leaf and a uniquely Korean fragrance answers immediately.", "톱니 모양 잎을 만지면 한국적인 독특한 향기가 곧바로 대답합니다."], ["Save local seed lines and grow aromatic leaves with fewer disposable trays and plastic wraps.", "지역 종자를 보전하고 일회용 용기와 비닐 포장을 줄여 향긋한 잎을 길러 주세요."], ["I love Earth when one green leaf can hold rice, memory, and summer scent together.", "초록 잎 한 장이 밥과 기억과 여름 향을 함께 품을 때 나는 지구를 사랑합니다."]]}, {"number": 83, "kind": "채소", "name": "부추", "english": "Garlic Chives", "file": "garlic_chives.gif", "sentences": [["Cut me above the crown and slender green leaves return for another meal.", "뿌리 위에서 나를 자르면 가느다란 초록 잎이 다음 식사를 위해 다시 돌아옵니다."], ["Harvest repeatedly without exhausting the bed, feeding soil between seasons with compost.", "밭을 지치게 하지 않도록 반복 수확하고 계절 사이에는 퇴비로 흙을 먹여 주세요."], ["I love Earth's resilience, which grows back quietly rather than boasting.", "나는 자랑하지 않고 조용히 다시 자라는 지구의 회복력을 사랑합니다."]]}, {"number": 84, "kind": "채소", "name": "미나리", "english": "Water Dropwort", "file": "water_dropwort.gif", "sentences": [["My hollow stems rise from shallow water, making clean wetlands part of every bite.", "내 속 빈 줄기는 얕은 물에서 올라오므로 깨끗한 습지가 한입 한입의 일부가 됩니다."], ["Test water quality and cultivate me without turning streams into fertilizer channels.", "수질을 검사하고 하천을 비료 통로로 만들지 않으면서 미나리를 길러 주세요."], ["I love the clear boundary where water and green stems breathe together.", "나는 물과 초록 줄기가 함께 숨 쉬는 맑은 경계를 사랑합니다."]]}, {"number": 85, "kind": "채소", "name": "쑥갓", "english": "Crown Daisy", "file": "crown_daisy.gif", "sentences": [["My leaves carry a bold aroma, and if left alone I raise cheerful yellow flowers.", "내 잎은 뚜렷한 향을 지니고 그대로 두면 밝은 노란 꽃을 피웁니다."], ["Grow seasonal greens with minimal heating and let some plants bloom for insects and seed.", "난방을 최소화해 제철 잎채소를 기르고 일부는 곤충과 씨앗을 위해 꽃피게 해 주세요."], ["I love Earth when dinner and a pollinator garden emerge from the same plant.", "저녁 식사와 꽃가루받이 정원이 같은 식물에서 나올 때 나는 지구를 사랑합니다."]]}, {"number": 86, "kind": "채소", "name": "케일", "english": "Kale", "file": "kale.gif", "sentences": [["Frost can sweeten my sturdy leaves instead of ending the harvest.", "서리는 수확을 끝내는 대신 내 튼튼한 잎을 더 달게 할 수 있습니다."], ["Use hardy winter greens to extend local seasons with less heated production.", "강인한 겨울 잎채소를 활용해 난방 생산을 줄이면서 지역의 제철 기간을 늘려 주세요."], ["I love Earth's toughness when cold becomes flavor rather than defeat.", "추위가 패배가 아니라 맛이 될 때 나는 지구의 강인함을 사랑합니다."]]}, {"number": 87, "kind": "채소", "name": "청경채", "english": "Bok Choy", "file": "bok_choy.gif", "sentences": [["My white spoons of stem hold a fountain of tender green leaves.", "내 하얀 숟가락 모양 줄기는 부드러운 초록 잎의 분수를 받치고 있습니다."], ["Grow quick brassicas in cool seasons and manage pests with nets, rotation, and beneficial insects.", "서늘한 계절에 빨리 자라는 배추과 작물을 기르고 그물과 돌려짓기와 천적으로 해충을 관리해 주세요."], ["I love Earth for designing a vegetable that looks ready to serve itself.", "나는 스스로를 바로 담아낼 준비가 된 듯한 채소를 설계한 지구를 사랑합니다."]]}, {"number": 88, "kind": "채소", "name": "비트", "english": "Beet", "file": "beet.gif", "sentences": [["My red pigment travels from root to cutting board, refusing to keep its presence secret.", "내 붉은 색소는 뿌리에서 도마까지 이동하며 존재를 숨기지 않습니다."], ["Use both roots and nutritious leaves, and accept size differences instead of grading away food.", "뿌리와 영양 많은 잎을 모두 쓰고 크기가 다르다는 이유로 먹거리를 버리지 말아 주세요."], ["I love an Earth bold enough to stain our hands with the color of soil-grown energy.", "나는 흙에서 자란 에너지의 색으로 손을 물들일 만큼 대담한 지구를 사랑합니다."]]}, {"number": 89, "kind": "채소", "name": "콜라비", "english": "Kohlrabi", "file": "kohlrabi.gif", "sentences": [["My swollen stem sits above ground like a small green planet with leaves in orbit.", "내 굵은 줄기는 잎을 궤도에 둔 작은 초록 행성처럼 땅 위에 앉아 있습니다."], ["Diversify brassica harvests and cook leaves and peel trimmings instead of discarding most of the plant.", "배추과 수확을 다양화하고 잎과 손질한 껍질도 요리해 식물 대부분을 버리지 말아 주세요."], ["I love Earth when a stem forgets the usual shape and invents a world of its own.", "나는 줄기가 평범한 모양을 잊고 자기만의 세계를 발명할 때 지구를 사랑합니다."]]}, {"number": 90, "kind": "채소", "name": "옥수수", "english": "Corn", "file": "corn.gif", "sentences": [["Rows of kernels form only when silk threads catch pollen carried across the field.", "수염 한 올 한 올이 밭을 건너온 꽃가루를 받아야 알갱이의 줄이 완성됩니다."], ["Protect crop diversity, reduce fertilizer runoff, and reserve fertile land for food as well as fuel and feed.", "작물 다양성을 지키고 비료 유출을 줄이며 비옥한 땅을 연료와 사료뿐 아니라 사람의 먹거리에도 사용해 주세요."], ["I hear Earth's abundance rustling through a field, but abundance must never become monoculture.", "나는 밭의 바스락거림에서 지구의 풍요를 듣지만 그 풍요가 단일재배가 되어서는 안 됩니다."]]}, {"number": 91, "kind": "채소", "name": "완두콩", "english": "Pea", "file": "pea.gif", "sentences": [["I line up round green seeds inside a pod while roots cooperate with bacteria to gather nitrogen.", "나는 꼬투리 안에 둥근 초록 씨를 줄 세우고 뿌리에서는 세균과 협력해 질소를 모읍니다."], ["Include legumes in rotations so farms can build fertility with less synthetic fertilizer.", "돌려짓기에 콩과 작물을 넣어 합성비료를 덜 쓰면서 밭의 비옥함을 높여 주세요."], ["I love Earth for packing cooperation both above and below the soil.", "나는 땅 위와 아래 모두에 협력을 담아 둔 지구를 사랑합니다."]]}, {"number": 92, "kind": "채소", "name": "강낭콩", "english": "Kidney Bean", "file": "kidney_bean.gif", "sentences": [["My curved seed resembles an organ while quietly storing protein for a future plant and a human meal.", "내 굽은 씨앗은 장기를 닮았으며 미래의 식물과 사람의 식사를 위한 단백질을 조용히 저장합니다."], ["Dry beans well, save regional varieties, and use legumes to make nutritious diets less resource-intensive.", "콩을 잘 말리고 지역 품종을 보전하며 자원 부담이 적은 영양 식단에 콩류를 활용해 주세요."], ["I love the practical Earth that stores tomorrow in a small patterned seed.", "나는 작은 무늬 씨앗 안에 내일을 저장하는 실용적인 지구를 사랑합니다."]]}, {"number": 93, "kind": "채소", "name": "풋콩", "english": "Edamame", "file": "edamame.gif", "sentences": [["I am a soybean enjoyed green, before drying changes my texture and possibilities.", "나는 마르면서 질감과 가능성이 바뀌기 전 초록일 때 즐기는 콩입니다."], ["Rotate legume crops and use pods for compost or feed rather than mixed rubbish.", "콩과 작물을 돌려짓고 꼬투리는 일반 쓰레기 대신 퇴비나 사료로 활용해 주세요."], ["Earth gives one seed many futures, and I celebrate the delicious green chapter.", "지구는 씨앗 하나에 여러 미래를 주며 나는 그중 맛있는 초록 장을 기념합니다."]]}, {"number": 94, "kind": "채소", "name": "죽순", "english": "Bamboo Shoot", "file": "bamboo_shoot.gif", "sentences": [["I push through soil with remarkable speed, carrying the beginning of a towering grass.", "나는 거대한 풀의 시작을 품고 놀라운 속도로 흙을 뚫고 올라옵니다."], ["Harvest selectively so bamboo groves keep enough shoots for wildlife, soil stability, and renewal.", "대나무 숲이 야생동물과 토양 안정과 재생을 위한 새순을 충분히 남기도록 골라서 수확해 주세요."], ["I love Earth's upward ambition, but growth must always leave roots and neighbors intact.", "나는 위로 향하는 지구의 포부를 사랑하지만 성장은 뿌리와 이웃을 온전히 남겨야 합니다."]]}, {"number": 95, "kind": "채소", "name": "토란", "english": "Taro", "file": "taro.gif", "sentences": [["My broad heart-shaped leaves catch tropical rain while edible corms swell below.", "내 넓은 하트 모양 잎은 열대의 비를 받고 먹을 수 있는 알줄기는 아래에서 굵어집니다."], ["Preserve wetland-friendly traditional cultivation and prepare taro safely before eating.", "습지와 조화를 이루는 전통 재배법을 보전하고 토란은 먹기 전에 안전하게 조리해 주세요."], ["I love Earth where a leaf becomes an umbrella and mud becomes nourishment.", "나는 잎이 우산이 되고 진흙이 영양이 되는 지구를 사랑합니다."]]}, {"number": 96, "kind": "채소", "name": "생강", "english": "Ginger", "file": "ginger.gif", "sentences": [["My knotted rhizome stores warmth and fragrance beneath narrow green shoots.", "내 울퉁불퉁한 뿌리줄기는 가느다란 초록 싹 아래에 따뜻함과 향을 저장합니다."], ["Use shade, organic matter, and crop rotation to protect tropical soil from disease and erosion.", "그늘과 유기물과 돌려짓기를 활용해 열대 토양을 병과 침식에서 지켜 주세요."], ["I love Earth for placing a warming spark in the cool darkness underground.", "나는 서늘한 땅속 어둠에 따뜻한 불씨를 둔 지구를 사랑합니다."]]}, {"number": 97, "kind": "채소", "name": "양상추", "english": "Iceberg Lettuce", "file": "iceberg_lettuce.gif", "sentences": [["I fold crisp pale leaves into a cool head named after the ice once used to transport me.", "나는 아삭하고 옅은 잎을 시원한 결구로 접으며 과거 운송에 쓰인 얼음에서 이름을 얻었습니다."], ["Grow close to markets and improve cold chains efficiently so freshness costs less energy and plastic.", "시장 가까이에서 기르고 저온 유통을 효율화해 신선함에 드는 에너지와 플라스틱을 줄여 주세요."], ["I love the clean snap of Earth-made water held inside a leaf.", "나는 잎 안에 담긴 지구의 물이 내는 맑은 아삭 소리를 사랑합니다."]]}, {"number": 98, "kind": "채소", "name": "루콜라", "english": "Arugula", "file": "arugula.gif", "sentences": [["My peppery leaves bring wild sharpness to a cultivated plate.", "내 알싸한 잎은 재배된 접시에 야생의 선명함을 더합니다."], ["Let some plants flower for pollinators and save seed from locally adapted leafy greens.", "일부는 꽃을 피워 곤충에게 내어 주고 지역에 적응한 잎채소의 씨앗을 받아 주세요."], ["I love Earth when a salad still remembers the untamed meadow.", "나는 샐러드가 아직 길들지 않은 초원을 기억할 때 지구를 사랑합니다."]]}, {"number": 99, "kind": "채소", "name": "근대", "english": "Swiss Chard", "file": "swiss_chard.gif", "sentences": [["My white, yellow, pink, or red stems lift broad leaves like colorful river channels.", "흰색과 노랑과 분홍과 빨강 줄기는 화려한 강줄기처럼 넓은 잎을 들어 올립니다."], ["Harvest outer leaves repeatedly and keep living roots producing instead of clearing whole beds at once.", "밭 전체를 한꺼번에 없애지 말고 바깥 잎부터 반복 수확해 살아 있는 뿌리가 계속 생산하게 해 주세요."], ["I love Earth's stained-glass windows when sunlight passes through my stems.", "나는 햇빛이 내 줄기를 통과할 때 나타나는 지구의 스테인드글라스를 사랑합니다."]]}, {"number": 100, "kind": "채소", "name": "치커리", "english": "Chicory", "file": "chicory.gif", "sentences": [["My leaves carry a clean bitterness, while my deep root can become food, fiber, or a roasted drink.", "내 잎은 맑은 쓴맛을 지니고 깊은 뿌리는 먹거리와 식이섬유와 볶은 음료가 될 수 있습니다."], ["Use deep-rooted crops to diversify fields and value bitter flavors that reduce the demand for excessive sweetness.", "깊이 뿌리내리는 작물로 밭을 다양화하고 지나친 단맛의 요구를 줄이는 쓴맛을 소중히 해 주세요."], ["I love Earth for ending this council with a blue flower and an honest taste.", "나는 푸른 꽃과 솔직한 맛으로 이 회의를 마무리하게 해 준 지구를 사랑합니다."]]}];const council=document.getElementById('council'),q=document.getElementById('q'),kind=document.getElementById('kind'),pick=document.getElementById('pick'),count=document.getElementById('count');pick.innerHTML+=records.map(r=>`<option value="${r.number}">${r.number}. ${r.name}</option>`).join('');council.innerHTML=records.map(r=>`<article class="item ${r.kind==='과일'?'fruit':'vegetable'}" data-n="${r.number}" data-k="${r.kind}" data-s="${(r.name+' '+r.english+' '+r.file+' '+r.sentences.flat().join(' ')).toLowerCase()}"><div class="head"><div class="badge">${r.number}</div><div><h2>${r.name} · ${r.english}</h2><div class="meta">${r.kind} · ${r.file}</div></div></div>${r.sentences.map((s,i)=>`<div class="pair"><div class="sn">${(r.number-1)*3+i+1}</div><div><p class="en" lang="en">${s[0]}</p><p class="ko" lang="ko">${s[1]}</p></div></div>`).join('')}</article>`).join('');function filter(){let a=0,s=0;document.querySelectorAll('.item').forEach(c=>{const on=c.dataset.s.includes(q.value.trim().toLowerCase())&&(!kind.value||c.dataset.k===kind.value)&&(!pick.value||c.dataset.n===pick.value);c.classList.toggle('hide',!on);if(on){a++;s+=3}});count.textContent=`${s} / 300문장 · ${a}종`}q.oninput=filter;kind.onchange=filter;pick.onchange=filter;function speak(lang){speechSynthesis.cancel();const sel=lang==='en-US'?'.en':'.ko',u=new SpeechSynthesisUtterance([...document.querySelectorAll('.item:not(.hide)')].flatMap(c=>[...c.querySelectorAll(sel)].map(x=>x.textContent)).join(' '));u.lang=lang;u.rate=lang==='en-US'?.84:.94;speechSynthesis.speak(u)}</script></body></html>
