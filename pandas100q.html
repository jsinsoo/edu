ndas as pd\n\ndf=pd.DataFrame({'날짜':['2026-01-01','2026-02-03']})\ndf['날짜']=pd.to_datetime(df['날짜'])\nprint('첫연도:', df.loc[0,'날짜'].year)\nprint('둘째월:', df.loc[1,'날짜'].month)\nprint('둘째일:', df.loc[1,'날짜'].day)", "answer": "첫연도: 2026\n둘째월: 2\n둘째일: 3", "explain": "문자열을 datetime으로 변환합니다."}, {"cat": "기초", "sub": "pandas", "title": "기초 pandas 예제 20", "code": "import pandas as pd\n\ndf=pd.DataFrame({'점수':[90,70,80]})\ndf['순위']=df['점수'].rank(ascending=False)\nprint('첫순위:', df.loc[0,'순위'])\nprint('둘째순위:', df.loc[1,'순위'])\nprint('셋째순위:', df.loc[2,'순위'])", "answer": "첫순위: 1.0\n둘째순위: 3.0\n셋째순위: 2.0", "explain": "내림차순 순위입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 1", "code": "import pandas as pd\n\nclass BasicPandas1:\n    def run(self):\n        df=pd.DataFrame({'이름':['A','B'], '점수':[80,90]})\n        print('행수:', len(df))\n        print('열수:', len(df.columns))\n        print('점수합:', df['점수'].sum())\n\napp = BasicPandas1()\napp.run()", "answer": "행수: 2\n열수: 2\n점수합: 170", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 2행 2열이고 점수 합은 170입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 2", "code": "import pandas as pd\n\nclass BasicPandas2:\n    def run(self):\n        s=pd.Series([3,5,7])\n        print('개수:', s.count())\n        print('합계:', s.sum())\n        print('평균:', s.mean())\n\napp = BasicPandas2()\napp.run()", "answer": "개수: 3\n합계: 15\n평균: 5.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. Series 원소 3개의 합은 15, 평균은 5입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 3", "code": "import pandas as pd\n\nclass BasicPandas3:\n    def run(self):\n        df=pd.DataFrame({'가격':[1000,2000,3000]})\n        df['할인가']=df['가격']*0.9\n        print('열목록:', list(df.columns))\n        print('첫할인가:', df.loc[0,'할인가'])\n        print('할인가합:', df['할인가'].sum())\n\napp = BasicPandas3()\napp.run()", "answer": "열목록: ['가격', '할인가']\n첫할인가: 900.0\n할인가합: 5400.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 할인가 열을 추가하고 10% 할인값을 계산합니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 4", "code": "import pandas as pd\n\nclass BasicPandas4:\n    def run(self):\n        df=pd.DataFrame({'이름':['민수','지아','하늘'], '점수':[55,75,95]})\n        r=df[df['점수']>=70]\n        print('선택수:', len(r))\n        print('첫선택:', r.iloc[0]['이름'])\n        print('최고점:', r['점수'].max())\n\napp = BasicPandas4()\napp.run()", "answer": "선택수: 2\n첫선택: 지아\n최고점: 95", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 70점 이상은 지아와 하늘입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 5", "code": "import pandas as pd\n\nclass BasicPandas5:\n    def run(self):\n        df=pd.DataFrame({'상품':['A','B','C'], '매출':[300,100,200]})\n        r=df.sort_values('매출')\n        print('첫상품:', r.iloc[0]['상품'])\n        print('마지막상품:', r.iloc[-1]['상품'])\n        print('매출합:', r['매출'].sum())\n\napp = BasicPandas5()\napp.run()", "answer": "첫상품: B\n마지막상품: A\n매출합: 600", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 매출 오름차순으로 B, C, A입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 6", "code": "import pandas as pd\n\nclass BasicPandas6:\n    def run(self):\n        df=pd.DataFrame({'값':[1,None,3]})\n        print('처리전결측:', df['값'].isna().sum())\n        df['값']=df['값'].fillna(0)\n        print('처리후결측:', df['값'].isna().sum())\n        print('합계:', df['값'].sum())\n\napp = BasicPandas6()\napp.run()", "answer": "처리전결측: 1\n처리후결측: 0\n합계: 4.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. None을 0으로 채워 결측이 없어집니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 7", "code": "import pandas as pd\n\nclass BasicPandas7:\n    def run(self):\n        s=pd.Series(['사과','배','사과','귤'])\n        c=s.value_counts()\n        print('사과:', c['사과'])\n        print('종류수:', len(c))\n        print('전체:', s.count())\n\napp = BasicPandas7()\napp.run()", "answer": "사과: 2\n종류수: 3\n전체: 4", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 사과는 2개이고 전체는 4개입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 8", "code": "import pandas as pd\n\nclass BasicPandas8:\n    def run(self):\n        df=pd.DataFrame({'A':[10,20], 'B':[30,40]})\n        print('첫행둘째열:', df.iloc[0,1])\n        print('둘째행첫열:', df.iloc[1,0])\n        print('전체합:', df.values.sum())\n\napp = BasicPandas8()\napp.run()", "answer": "첫행둘째열: 30\n둘째행첫열: 20\n전체합: 100", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. iloc는 위치 기반 인덱싱입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 9", "code": "import pandas as pd\n\nclass BasicPandas9:\n    def run(self):\n        df=pd.DataFrame({'이름':['A','B'], '점수':[88,99]}, index=['a','b'])\n        print('인덱스:', list(df.index))\n        print('b이름:', df.loc['b','이름'])\n        print('b점수:', df.loc['b','점수'])\n\napp = BasicPandas9()\napp.run()", "answer": "인덱스: ['a', 'b']\nb이름: B\nb점수: 99", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. loc는 라벨 기반 인덱싱입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 10", "code": "import pandas as pd\n\nclass BasicPandas10:\n    def run(self):\n        df=pd.DataFrame({'old':[1,2,3]})\n        df=df.rename(columns={'old':'new'})\n        print('열목록:', list(df.columns))\n        print('합계:', df['new'].sum())\n        print('평균:', df['new'].mean())\n\napp = BasicPandas10()\napp.run()", "answer": "열목록: ['new']\n합계: 6\n평균: 2.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 열 이름을 old에서 new로 바꿉니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 11", "code": "import pandas as pd\n\nclass BasicPandas11:\n    def run(self):\n        df=pd.DataFrame({'A':[1,2], 'B':[3,4], 'C':[5,6]})\n        df=df.drop(columns=['B'])\n        print('열수:', len(df.columns))\n        print('열목록:', list(df.columns))\n        print('전체합:', df.values.sum())\n\napp = BasicPandas11()\napp.run()", "answer": "열수: 2\n열목록: ['A', 'C']\n전체합: 14", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. B 열을 삭제하면 A와 C만 남습니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 12", "code": "import pandas as pd\n\nclass BasicPandas12:\n    def run(self):\n        df=pd.DataFrame({'값':['1','2','3']})\n        df['값']=df['값'].astype(int)\n        print('자료형:', str(df['값'].dtype))\n        print('합계:', df['값'].sum())\n        print('최대:', df['값'].max())\n\napp = BasicPandas12()\napp.run()", "answer": "자료형: int64\n합계: 6\n최대: 3", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 문자열 숫자를 정수형으로 변환합니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 13", "code": "import pandas as pd\n\nclass BasicPandas13:\n    def run(self):\n        df=pd.DataFrame({'반':['A','A','B','C']})\n        print('고유값:', list(df['반'].unique()))\n        print('고유수:', df['반'].nunique())\n        print('전체수:', len(df))\n\napp = BasicPandas13()\napp.run()", "answer": "고유값: ['A', 'B', 'C']\n고유수: 3\n전체수: 4", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 고유값은 A, B, C입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 14", "code": "import pandas as pd\n\nclass BasicPandas14:\n    def run(self):\n        df=pd.DataFrame({'점수':[10,20,30,40]})\n        print('최소:', df['점수'].min())\n        print('최대:', df['점수'].max())\n        print('범위:', df['점수'].max()-df['점수'].min())\n\napp = BasicPandas14()\napp.run()", "answer": "최소: 10\n최대: 40\n범위: 30", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 최대와 최소의 차이는 30입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 15", "code": "import pandas as pd\n\nclass BasicPandas15:\n    def run(self):\n        df=pd.DataFrame({'값':[10,20,30,40]})\n        h=df.head(2)\n        t=df.tail(2)\n        print('head합:', h['값'].sum())\n        print('tail합:', t['값'].sum())\n        print('전체합:', df['값'].sum())\n\napp = BasicPandas15()\napp.run()", "answer": "head합: 30\ntail합: 70\n전체합: 100", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 앞 2개 합은 30, 뒤 2개 합은 70입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 16", "code": "import pandas as pd\n\nclass BasicPandas16:\n    def run(self):\n        df=pd. : "import pandas as pd\n\nclass AppliedPandas2:\n    def run(self):\n        df=pd.DataFrame({'반':['A','A','B','B'], '점수':[70,90,60,80]})\n        g=df.groupby('반')['점수'].mean()\n        print('A평균:', g['A'])\n        print('B평균:', g['B'])\n        print('전체평균:', df['점수'].mean())\n\napp = AppliedPandas2()\napp.run()", "answer": "A평균: 80.0\nB평균: 70.0\n전체평균: 75.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 반별 평균과 전체 평균을 비교합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 3", "code": "import pandas as pd\n\nclass AppliedPandas3:\n    def run(self):\n        df=pd.DataFrame({'월':[1,1,2,2], '상품':['A','B','A','B'], '매출':[10,20,30,40]})\n        p=df.pivot(index='월',columns='상품',values='매출')\n        print('1월A:', p.loc[1,'A'])\n        print('2월B:', p.loc[2,'B'])\n        print('전체합:', p.values.sum())\n\napp = AppliedPandas3()\napp.run()", "answer": "1월A: 10\n2월B: 40\n전체합: 100", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. pivot으로 월과 상품별 매출 표를 만듭니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 4", "code": "import pandas as pd\n\nclass AppliedPandas4:\n    def run(self):\n        a=pd.DataFrame({'id':[1,2,3], '이름':['A','B','C']})\n        b=pd.DataFrame({'id':[1,2,3], '점수':[80,90,70]})\n        m=pd.merge(a,b,on='id')\n        print('행수:', len(m))\n        print('열수:', len(m.columns))\n        print('B점수:', m.loc[1,'점수'])\n\napp = AppliedPandas4()\napp.run()", "answer": "행수: 3\n열수: 3\nB점수: 90", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. id 기준으로 두 DataFrame을 병합합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 5", "code": "import pandas as pd\n\nclass AppliedPandas5:\n    def run(self):\n        a=pd.DataFrame({'값':[1,2]})\n        b=pd.DataFrame({'값':[3,4]})\n        c=pd.concat([a,b],ignore_index=True)\n        print('행수:', len(c))\n        print('합계:', c['값'].sum())\n        print('마지막:', c.iloc[-1]['값'])\n\napp = AppliedPandas5()\napp.run()", "answer": "행수: 4\n합계: 10\n마지막: 4", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. concat으로 행을 이어 붙입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 6", "code": "import pandas as pd\n\nclass AppliedPandas6:\n    def run(self):\n        df=pd.DataFrame({'성별':['M','F','M','F']})\n        df['표시']=df['성별'].map({'M':'남','F':'여'})\n        print('첫표시:', df.loc[0,'표시'])\n        print('남수:', (df['표시']=='남').sum())\n        print('여수:', (df['표시']=='여').sum())\n\napp = AppliedPandas6()\napp.run()", "answer": "첫표시: 남\n남수: 2\n여수: 2", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. map으로 M/F를 남/여로 변환합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 7", "code": "import pandas as pd\n\nclass AppliedPandas7:\n    def run(self):\n        df=pd.DataFrame({'등급':['상','중','하','상']})\n        df['등급']=df['등급'].replace({'상':'A','중':'B','하':'C'})\n        print('첫등급:', df.loc[0,'등급'])\n        print('마지막등급:', df.loc[3,'등급'])\n        print('A개수:', (df['등급']=='A').sum())\n\napp = AppliedPandas7()\napp.run()", "answer": "첫등급: A\n마지막등급: A\nA개수: 2", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. replace로 등급 문자를 변환합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 8", "code": "import pandas as pd\n\nclass AppliedPandas8:\n    def run(self):\n        df=pd.DataFrame({'값':[10,20,30,40]})\n        df['이동평균']=df['값'].rolling(2).mean()\n        print('둘째:', df.loc[1,'이동평균'])\n        print('셋째:', df.loc[2,'이동평균'])\n        print('넷째:', df.loc[3,'이동평균'])\n\napp = AppliedPandas8()\napp.run()", "answer": "둘째: 15.0\n셋째: 25.0\n넷째: 35.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 2개 단위 이동평균입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 9", "code": "import pandas as pd\n\nclass AppliedPandas9:\n    def run(self):\n        df=pd.DataFrame({'매출':[10,20,30]})\n        df['누적']=df['매출'].cumsum()\n        print('첫누적:', df.loc[0,'누적'])\n        print('둘째누적:', df.loc[1,'누적'])\n        print('마지막누적:', df.loc[2,'누적'])\n\napp = AppliedPandas9()\napp.run()", "answer": "첫누적: 10\n둘째누적: 30\n마지막누적: 60", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 누적합은 10, 30, 60입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 10", "code": "import pandas as pd\n\nclass AppliedPandas10:\n    def run(self):\n        df=pd.DataFrame({'점수':[40,65,85,95]})\n        r=df.query('점수 >= 60')\n        print('통과수:', len(r))\n        print('최저통과:', r['점수'].min())\n        print('최고통과:', r['점수'].max())\n\napp = AppliedPandas10()\napp.run()", "answer": "통과수: 3\n최저통과: 65\n최고통과: 95", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. query로 60점 이상을 선택합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 11", "code": "import pandas as pd\n\nclass AppliedPandas11:\n    def run(self):\n        df=pd.DataFrame({'지역':['서울','부산','대구','제주'], '값':[1,2,3,4]})\n        r=df[df['지역'].isin(['서울','대구'])]\n        print('선택수:', len(r))\n        print('합계:', r['값'].sum())\n        print('마지막지역:', r.iloc[-1]['지역'])\n\napp = AppliedPandas11()\napp.run()", "answer": "선택수: 2\n합계: 4\n마지막지역: 대구", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. isin으로 서울과 대구를 선택합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 12", "code": "import pandas as pd\n\nclass AppliedPandas12:\n    def run(self):\n        df=pd.DataFrame({'id':[1,1,2,3,3], '값':[10,10,20,30,30]})\n        r=df.drop_duplicates()\n        print('행수:', len(r))\n        print('값합:', r['값'].sum())\n        print('중복표시수:', df.duplicated().sum())\n\napp = AppliedPandas12()\napp.run()", "answer": "행수: 3\n값합: 60\n중복표시수: 2", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 실행합니다. 중복 행 2개를 제거하면 3행이 남습니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 13", "code": "import pandas as pd\n\nclass AppliedPandas13:\n    def run(self):\n        df=pd.DataFrame({'반':['A','A','B'], '점수':[80,90,70]})\n        r=df.sort_values(['반','점수'], ascending=[True,False])\n        print('첫반:', r.iloc[0]['반'])\n        print('첫점수:', r.iloc[0]['점수'])\n        print('마지막점수:', r.iloc[-1]['점수'])\n\napp function norm(s){
    return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");
}
function esc(s){
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function render(){
    const qbox=document.getElementById("questions");
    const nav=document.getElementById("navBtns");
    let out="", navOut="", current="";
    QUESTIONS.forEach((q,i)=>{
        const group=q.cat+" - "+q.sub;
        if(group!==current){
            current=group;
            out+=`<h2>${group}</h2>`;
            navOut+=`<button class="group-btn" onclick="location.hash='q${i+1}'">${group}</button>`;
        }
        navOut+=`<button onclick="location.hash='q${i+1}'">${i+1}번</button>`;
        out+=`
        <div class="card" id="q${i+1}">
            <span class="badge">${i+1}번 · ${q.cat} · ${q.sub}</span>
            <h3>${q.title}</h3>
            <p><b>문제.</b> 다음 pandas 코드의 출력 결과를 쓰시오. 모든 출력은 3줄 이상입니다.</p>
            <pre><code>${esc(q.code)}</code></pre>
            <textarea id="ans${i}" placeholder="출력 결과를 줄 단위로 입력하세요."></textarea>
            <div id="res${i}" class="result"></div>
        </div>`;
    });
    qbox.innerHTML=out;
    nav.innerHTML=navOut;
}
function gradeAll(){
    let correct=0;
    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML=`
        <div>${ok ? '<span class="correct">정답</span>' : '<span class="wrong">오답</span>'}</div>
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
    const score=Math.round(correct/QUESTIONS.length*100);
    document.getElementById("scoreBox").innerHTML=`총점: <b>${score}점</b> / 정답: <b>${correct}</b>개 / 전체: <b>${QUESTIONS.length}</b>문항`;
}
function showAllSolutions(){
    QUESTIONS.forEach((q,i)=>{
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML=`<b>정답 출력</b><pre><code>${esc(q.answer)}</code></pre><b>상세 풀이</b><br>${q.explain}`;
    });
}
function downloadTxt(){
    gradeAll();
    let sid=document.getElementById("studentId").value.trim()||"학번";
    let name=document.getElementById("studentName").value.trim()||"이름";
    let now=new Date();
    let stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"_"+String(now.getHours()).padStart(2,"0")+"-"+String(now.getMinutes()).padStart(2,"0")+"-"+String(now.getSeconds()).padStart(2,"0");
    let correct=0, lines=[];
    lines.push("pandas 서술형 평가 결과","학번: "+sid,"이름: "+name,"응시시각: "+stamp,"");
    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        lines.push(`[${i+1}번] ${q.cat} - ${q.sub} - ${q.title} : ${ok ? "정답" : "오답"}`);
        lines.push("학생 답안:");
        lines.push(user || "(미입력)");
        lines.push("정답:");
        lines.push(q.answer);
        lines.push("상세 풀이: "+q.explain);
        lines.push("----------------------------------------");
    });
    let score=Math.round(correct/QUESTIONS.length*100);
    lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+QUESTIONS.length);
    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${sid}_${name}_pandas_${score}점_${stamp}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
}
render();
</script>
