sicPandas11()\napp.run()", "answer": "결측수: 0\n합계: 4.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 결측을 0으로 채워 합계는 4.0입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 12", "code": "import pandas as pd\n\nclass BasicPandas12:\n    def run(self):\n        s = pd.Series(['A','B','A','C'])\n        c = s.value_counts()\n        print('A개수:', c['A'])\n        print('종류수:', len(c))\n\napp = BasicPandas12()\napp.run()", "answer": "A개수: 2\n종류수: 3", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. A는 2개, 종류는 3개입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 13", "code": "import pandas as pd\n\nclass BasicPandas13:\n    def run(self):\n        df = pd.DataFrame({'값':[10,20,30]})\n        h = df.head(2)\n        print('head행수:', len(h))\n        print('마지막값:', h.iloc[-1]['값'])\n\napp = BasicPandas13()\napp.run()", "answer": "head행수: 2\n마지막값: 20", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. head(2)는 10,20 두 행입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 14", "code": "import pandas as pd\n\nclass BasicPandas14:\n    def run(self):\n        df = pd.DataFrame({'값':[10,20,30]})\n        t = df.tail(2)\n        print('tail행수:', len(t))\n        print('첫값:', t.iloc[0]['값'])\n\napp = BasicPandas14()\napp.run()", "answer": "tail행수: 2\n첫값: 20", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. tail(2)는 20,30 두 행입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 15", "code": "import pandas as pd\n\nclass BasicPandas15:\n    def run(self):\n        df = pd.DataFrame({'old':[1,2]})\n        df = df.rename(columns={'old':'new'})\n        print('열목록:', list(df.columns))\n        print('합계:', df['new'].sum())\n\napp = BasicPandas15()\napp.run()", "answer": "열목록: ['new']\n합계: 3", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 열 이름 old가 new로 바뀌었습니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 16", "code": "import pandas as pd\n\nclass BasicPandas16:\n    def run(self):\n        df = pd.DataFrame({'A':[1,2], 'B':[3,4]})\n        df = df.drop(columns=['B'])\n        print('열수:', len(df.columns))\n        print('A합:', df['A'].sum())\n\napp = BasicPandas16()\napp.run()", "answer": "열수: 1\nA합: 3", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. B 열을 삭제하면 A만 남습니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 17", "code": "import pandas as pd\n\nclass BasicPandas17:\n    def run(self):\n        df = pd.DataFrame({'값':['1','2']})\n        df['값'] = df['값'].astype(int)\n        print('자료형:', str(df['값'].dtype))\n        print('합계:', df['값'].sum())\n\napp = BasicPandas17()\napp.run()", "answer": "자료형: int64\n합계: 3", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 문자열 숫자를 정수로 변환합니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 18", "code": "import pandas as pd\n\nclass BasicPandas18:\n    def run(self):\n        df = pd.DataFrame({'반':['A','A','B']})\n        print('고유값:', list(df['반'].unique()))\n        print('고유수:', df['반'].nunique())\n\napp = BasicPandas18()\napp.run()", "answer": "고유값: ['A', 'B']\n고유수: 2", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 고유값은 A와 B입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 19", "code": "import pandas as pd\n\nclass BasicPandas19:\n    def run(self):\n        df = pd.DataFrame({'점수':[10,20,30]})\n        print('최소:', df['점수'].min())\n        print('최대:', df['점수'].max())\n\napp = BasicPandas19()\napp.run()", "answer": "최소: 10\n최대: 30", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 최솟값은 10, 최댓값은 30입니다."}, {"cat": "기초", "sub": "pandas OOP", "title": "기초 pandas OOP 예제 20", "code": "import pandas as pd\n\nclass BasicPandas20:\n    def run(self):\n        df = pd.DataFrame({'값':[5,6]}, index=['a','b'])\n        print('인덱스:', list(df.index))\n        print('b값:', df.loc['b','값'])\n\napp = BasicPandas20()\napp.run()", "answer": "인덱스: ['a', 'b']\nb값: 6", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 인덱스 b의 값은 6입니다."}, {"cat": "응용", "sub": "pandas", ": "반은 오름차순, 점수는 내림차순입니다."}, {"cat": "응용", "sub": "pandas", "title": "응용 pandas 예제 14", "code": "import pandas as pd\n\ndf = pd.DataFrame({'점수':[40,65,85]})\nr = df.query('점수 >= 60')\nprint('통과수:', len(r))\nprint('최고:', r['점수'].max())", "answer": "통과수: 2\n최고: 85", "explain": "query로 60점 이상을 선택합니다."}, {"cat": "응용", "sub": "pandas", "title": "응용 pandas 예제 15", "code": "import pandas as pd\n\ndf = pd.DataFrame({'지역':['서울','부산','대구'], '값':[1,2,3]})\nr = df[df['지역'].isin(['서울','대구'])]\nprint('선택수:', len(r))\nprint('합계:', r['값'].sum())", "answer": "선택수: 2\n합계: 4", "explain": "서울과 대구가 선택됩니다."}, {"cat": "응용", "sub": "pandas", "title": "응용 pandas 예제 16", "code": "import pandas as pd\n\ndf = pd.DataFrame({'성별':['M','F','M']})\ndf['표시'] = df['성별'].map({'M':'남','F':'여'})\nprint('첫표시:', df.loc[0,'표시'])\nprint('여개수:', (df['표시']=='여').sum())", "answer": "첫표시: 남\n여개수: 1", "explain": "map으로 값을 변환합니다."}, {"cat": "응용", "sub": "pandas", "title": "응용 pandas 예제 17", "code": "import pandas as pd\n\ndf = pd.DataFrame({'등급':['상','중','하']})\ndf['등급'] = df['등급'].replace({'상':'A','중':'B','하':'C'})\nprint('첫등급:', df.loc[0,'등급'])\nprint('마지막:', df.loc[2,'등급'])", "answer": "첫등급: A\n마지막: C", "explain": "replace로 등급명을 바꿉니다."}, {"cat": "응용", "sub": "pandas", "title": "응용 pandas 예제 18", "code": "import pandas as pd\n\ndf = pd.DataFrame({'값':[10,20,30]})\ndf['이동평균'] = df['값'].rolling(2).mean()\nprint('둘째:', df.loc[1,'이동평균'])\nprint('셋째:', df.loc[2,'이동평균'])", "answer": "둘째: 15.0\n셋째: 25.0", "explain": "2개씩 이동평균을 계산합니다."}, {"cat": "응용", "sub": "pandas", "title": "응용 pandas 예제 19", "code": "import pandas as pd\n\ndf = pd.DataFrame({'매출':[10,20,30]})\ndf['누적'] = df['매출'].cumsum()\nprint('둘째누적:', df.loc[1,'누적'])\nprint('마지막누적:', df.loc[2,'누적'])", "answer": "둘째누적: 30\n마지막누적: 60", "explain": "누적합은 10,30,60입니다."}, {"cat": "응용", "sub": "pandas", "title": "응용 pandas 예제 20", "code": "import pandas as pd\n\ndf = pd.DataFrame({'값':[10,20,30]})\nr = df.sample(2, random_state=1).sort_index()\nprint('선택행수:', len(r))\  run(self):\n        df = pd.DataFrame({'날짜':['2026-01-01','2026-01-03']})\n        df['날짜'] = pd.to_datetime(df['날짜'])\n        print('연도:', df.loc[0,'날짜'].year)\n        print('일:', df.loc[1,'날짜'].day)\n\napp = AppliedPandas9()\napp.run()", "answer": "연도: 2026\n일: 3", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 문자열 날짜를 datetime으로 바꿉니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 10", "code": "import pandas as pd\n\nclass AppliedPandas10:\n    def run(self):\n        df = pd.DataFrame({'이름':['A','B','C'], '점수':[90,70,80]})\n        df['순위'] = df['점수'].rank(ascending=False)\n        print('A순위:', df.loc[0,'순위'])\n        print('B순위:', df.loc[1,'순위'])\n\napp = AppliedPandas10()\napp.run()", "answer": "A순위: 1.0\nB순위: 3.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 내림차순 순위입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 11", "code": "import pandas as pd\n\nclass AppliedPandas11:\n    def run(self):\n        df = pd.DataFrame({'나이':[10,20,30]})\n        df['구간'] = pd.cut(df['나이'], bins=[0,19,40], labels=['청소년','성인'])\n        print('첫구간:', df.loc[0,'구간'])\n        print('둘째구간:', df.loc[1,'구간'])\n\napp = AppliedPandas11()\napp.run()", "answer": "첫구간: 청소년\n둘째구간: 성인", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 10은 청소년, 20은 성인 구간입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 12", "code": "import pandas as pd\n\nclass AppliedPandas12:\n    def run(self):\n        df = pd.DataFrame({'id':[1,1,2], '값':[10,10,20]})\n        r = df.drop_duplicates()\n        print('행수:', len(r))\n        print('값합:', r['값'].sum())\n\napp = AppliedPandas12()\napp.run()", "answer": "행수: 2\n값합: 30", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 중복 행 제거 후 2행입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 13", "code": "import pandas as pd\n\nclass AppliedPandas13:\n    def run(self):\n        df = pd.DataFrame({'반':['A','A','B'], '점수':[80,90,70]})\n        r = df.sort_values(['반','점수'], ascending=[True,False])\n        print('첫반:', r.iloc[0]['반'])\n        print('첫점수:', r.iloc[0]['점수'])\n\napp = AppliedPandas13()\napp.run()", "answer": "첫반: A\n첫점수: 90", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 반은 오름차순, 점수는 내림차순입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 14", "code": "import pandas as pd\n\nclass AppliedPandas14:\n    def run(self):\n        df = pd.DataFrame({'점수':[40,65,85]})\n        r = df.query('점수 >= 60')\n        print('통과수:', len(r))\n        print('최고:', r['점수'].max())\n\napp = AppliedPandas14()\napp.run()", "answer": "통과수: 2\n최고: 85", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. query로 60점 이상을 선택합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 15", "code": "import pandas as pd\n\nclass AppliedPandas15:\n    def run(self):\n        df = pd.DataFrame({'지역':['서울','부산','대구'], '값':[1,2,3]})\n        r = df[df['지역'].isin(['서울','대구'])]\n        print('선택수:', len(r))\n        print('합계:', r['값'].sum())\n\napp = AppliedPandas15()\napp.run()", "answer": "선택수: 2\n합계: 4", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 서울과 대구가 선택됩니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 16", "code": "import pandas as pd\n\nclass AppliedPandas16:\n    def run(self):\n        df = pd.DataFrame({'성별':['M','F','M']})\n        df['표시'] = df['성별'].map({'M':'남','F':'여'})\n        print('첫표시:', df.loc[0,'표시'])\n        print('여개수:', (df['표시']=='여').sum())\n\napp = AppliedPandas16()\napp.run()", "answer": "첫표시: 남\n여개수: 1", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. map으로 값을 변환합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 17", "code": "import pandas as pd\n\nclass AppliedPandas17:\n    def run(self):\n        df = pd.DataFrame({'등급':['상','중','하']})\n        df['등급'] = df['등급'].replace({'상':'A','중':'B','하':'C'})\n        print('첫등급:', df.loc[0,'등급'])\n        print('마지막:', df.loc[2,'등급'])\n\napp = AppliedPandas17()\napp.run()", "answer": "첫등급: A\n마지막: C", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. replace로 등급명을 바꿉니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 18", "code": "import pandas as pd\n\nclass AppliedPandas18:\n    def run(self):\n        df = pd.DataFrame({'값':[10,20,30]})\n        df['이동평균'] = df['값'].rolling(2).mean()\n        print('둘째:', df.loc[1,'이동평균'])\n        print('셋째:', df.loc[2,'이동평균'])\n\napp = AppliedPandas18()\napp.run()", "answer": "둘째: 15.0\n셋째: 25.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 2개씩 이동평균을 계산합니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 19", "code": "import pandas as pd\n\nclass AppliedPandas19:\n    def run(self):\n        df = pd.DataFrame({'매출':[10,20,30]})\n        df['누적'] = df['매출'].cumsum()\n        print('둘째누적:', df.loc[1,'누적'])\n        print('마지막누적:', df.loc[2,'누적'])\n\napp = AppliedPandas19()\napp.run()", "answer": "둘째누적: 30\n마지막누적: 60", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 누적합은 10,30,60입니다."}, {"cat": "응용", "sub": "pandas OOP", "title": "응용 pandas OOP 예제 20", "code": "import pandas as pd\n\nclass AppliedPandas20:\n    def run(self):\n        df = pd.DataFrame({'값':[10,20,30]})\n        r = df.sample(2, random_state=1).sort_index()\n        print('선택행수:', len(r))\n        print('인덱스:', list(r.index))\n\napp = AppliedPandas20()\napp.run()", "answer": "선택행수: 2\n인덱스: [0, 2]", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. random_state로 표본 추출 결과를 고정합니다."}, {"cat": "심화", "sub": "pandas", "title": "심화 pandas 예제 1", "code": "import pandas as pd\n\ndf = pd.DataFrame({'지역':['서울','서울','부산'], '상품':['A','B','A'], '매출':[10,20,30]})\ng = df.groupby(['지역','상품'])['매출'].sum()\nprint('서울A:', g[('서울','A')])\nprint('부산A:', g[('부산','A')])", "answer": "서울A: 10\n부산A: 30", "explain": "다중 기준 groupby입니다."}, {"cat": "심화", "sub": "pandas", "title": "심화 pandas 예제 2", "code": "import pandas as pd\n\ndf = pd.DataFrame({'반':['A','A','B'], '성별':['남','여','남'], '수':[2,3,4]})\ng = df.groupby(['반','성별'])['수'].sum().unstack(fill_value=0)\nprint(' , "title": "심화 pandas OOP 예제 1", "code": "import pandas as pd\n\nclass AdvancedPandas1:\n    def run(self):\n        df = pd.DataFrame({'지역':['서울','서울','부산'], '상품':['A','B','A'], '매출':[10,20,30]})\n        g = df.groupby(['지역','상품'])['매출'].sum()\n        print('서울A:', g[('서울','A')])\n        print('부산A:', g[('부산','A')])\n\napp = AdvancedPandas1()\napp.run()", "answer": "서울A: 10\n부산A: 30", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 다중 기준 groupby입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 2", "code": "import pandas as pd\n\nclass AdvancedPandas2:\n    def run(self):\n        df = pd.DataFrame({'반':['A','A','B'], '성별':['남','여','남'], '수':[2,3,4]})\n        g = df.groupby(['반','성별'])['수'].sum().unstack(fill_value=0)\n        print('A여:', g.loc['A','여'])\n        print('B여:', g.loc['B','여'])\n\napp = AdvancedPandas2()\napp.run()", "answer": "A여: 3\nB여: 0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. unstack으로 표 형태를 바꾸고 없는 값은 0입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 3", "code": "import pandas as pd\n\nclass AdvancedPandas3:\n    def run(self):\n        df = pd.DataFrame({'이름':['A','B'], '국어':[80,90], '수학':[70,100]})\n        m = df.melt(id_vars='이름', var_name='과목', value_name='점수')\n        print('행수:', len(m))\n        print('첫과목:', m.loc[0,'과목'])\n\napp = AdvancedPandas3()\napp.run()", "answer": "행수: 4\n첫과목: 국어", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. melt로 긴 형식 데이터가 됩니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 4", "code": "import pandas as pd\n\nclass AdvancedPandas4:\n    def run(self):\n        df = pd.DataFrame({'이름':['A','A','B','B'], '과목':['국어','수학','국어','수학'], '점수':[80,90,70,60]})\n        p = df.pivot(index='이름', columns='과목', values='점수')\n        print('A수학:', p.loc['A','수학'])\n        print('B국어:', p.loc['B','국어'])\n\napp = AdvancedPandas4()\napp.run()", "answer": "A수학: 90\nB국어: 70", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. pivot으로 넓은 표를 만듭니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 5", "code": "import pandas as pd\n\nclass AdvancedPandas5:\n    def run(self):\n        left = pd.DataFrame({'id':[1,2,3]})\n        right = pd.DataFrame({'id':[1,2], '값':[10,20]})\n        m = pd.merge(left,right,on='id',how='left')\n        print('행수:', len(m))\n        print('결측:', m['값'].isna().sum())\n\napp = AdvancedPandas5()\napp.run()", "answer": "행수: 3\n결측: 1", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. left join에서 id 3은 결측입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 6", "code": "import pandas as pd\n\nclass AdvancedPandas6:\n    def run(self):\n        df = pd.DataFrame({'시작':pd.to_datetime(['2026-01-01','2026-01-03']), '끝':pd.to_datetime(['2026-01-02','2026-01-06'])})\n        df['기간'] = (df['끝']-df['시작']).dt.days\n        print('첫기간:', df.loc[0,'기간'])\n        print('총기간:', df['기간'].sum())\n\napp = AdvancedPandas6()\napp.run()", "answer": "첫기간: 1\n총기간: 4", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 기간은 1일과 3일입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 7", "code": "import pandas as pd\n\nclass AdvancedPandas7:\n    def run(self):\n        df = pd.DataFrame({'날짜':pd.to_datetime(['2026-01-01','2026-01-02','2026-02-01']), '매출':[10,20,30]})\n        df = df.set_index('날짜')\n        r = df.resample('ME').sum()\n        print('1월:', r.iloc[0]['매출'])\n        print('2월:', r.iloc[1]['매출'])\n\napp = AdvancedPandas7()\napp.run()", "answer": "1월: 30\n2월: 30", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 월말 기준으로 월별 합계를 냅니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 8", "code": "import pandas as pd\n\nclass AdvancedPandas8:\n    def run(self):\n        df = pd.DataFrame({'값':[1,2,3]})\n        r = df.assign(두배=lambda x:x['값']*2).query('두배 >= 4')\n        print('행수:', len(r))\n        print('합:', r['두배'].sum())\n\napp = AdvancedPandas8()\napp.run()", "answer": "행수: 2\n합: 10", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. nclass AdvancedPandas13:\n    def run(self):\n        df = pd.DataFrame({'이름':['A','B'], '취미':[['독서','운동'],['게임']]})\n        e = df.explode('취미')\n        print('행수:', len(e))\n        print('둘째취미:', e.iloc[1]['취미'])\n\napp = AdvancedPandas13()\napp.run()", "answer": "행수: 3\n둘째취미: 운동", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 리스트가 행 단위로 펼쳐집니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 14", "code": "import pandas as pd\n\nclass AdvancedPandas14:\n    def run(self):\n        df = pd.DataFrame({'등급':['상','중','상']})\n        df['등급'] = df['등급'].astype('category')\n        print('자료형:', str(df['등급'].dtype))\n        print('범주수:', len(df['등급'].cat.categories))\n\napp = AdvancedPandas14()\napp.run()", "answer": "자료형: category\n범주수: 2", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 범주는 상과 중 두 개입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 15", "code": "import pandas as pd\n\nclass AdvancedPandas15:\n    def run(self):\n        df = pd.DataFrame({'값':[10,20,30,40]})\n        df['구간'] = pd.qcut(df['값'], q=2, labels=['낮음','높음'])\n        print('첫구간:', df.loc[0,'구간'])\n        print('마지막구간:', df.loc[3,'구간'])\n\napp = AdvancedPandas15()\napp.run()", "answer": "첫구간: 낮음\n마지막구간: 높음", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. qcut으로 분위 구간을 나눕니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 16", "code": "import pandas as pd\n\nclass AdvancedPandas16:\n    def run(self):\n        df = pd.DataFrame({'x':[1,2,3], 'y':[2,4,6]})\n        c = df.corr()\n        print('상관:', round(c.loc['x','y'], 1))\n        print('자기상관:', c.loc['x','x'])\n\napp = AdvancedPandas16()\napp.run()", "answer": "상관: 1.0\n자기상관: 1.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 완전한 양의 상관입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 17", "code": "import pandas as pd\n\nclass AdvancedPandas17:\n    def run(self):\n        df = pd.DataFrame({'매출':[100,130,160]})\n        df['전일'] = df['매출'].shift(1)\n        df['증가'] = df['매출'] - df['전일']\n        print('둘째증가:', df.loc[1,'증가'])\n        print('셋째증가:', df.loc[2,'증가'])\n\napp = AdvancedPandas17()\napp.run()", "answer": "둘째증가: 30.0\n셋째증가: 30.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 전 행과의 차이가 모두 30입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 18", "code": "import pandas as pd\n\nclass AdvancedPandas18:\n    def run(self):\n        df = pd.DataFrame({'점수':[100,80,60]})\n        df['백분위'] = df['점수'].rank(pct=True)\n        print('60점:', round(df.loc[2,'백분위'],2))\n        print('100점:', round(df.loc[0,'백분위'],2))\n\napp = AdvancedPandas18()\napp.run()", "answer": "60점: 0.33\n100점: 1.0", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 기본 rank는 오름차순입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 19", "code": "import pandas as pd\n\nclass AdvancedPandas19:\n    def run(self):\n        df = pd.DataFrame({'성별':['남','여','남'], '합격':['Y','Y','N']})\n        t = pd.crosstab(df['성별'], df['합격'])\n        print('남Y:', t.loc['남','Y'])\n        print('여Y:', t.loc['여','Y'])\n\napp = AdvancedPandas19()\napp.run()", "answer": "남Y: 1\n여Y: 1", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. 교차표에서 남Y와 여Y는 각각 1입니다."}, {"cat": "심화", "sub": "pandas OOP", "title": "심화 pandas OOP 예제 20", "code": "import pandas as pd\n\nclass AdvancedPandas20:\n    def run(self):\n        df = pd.DataFrame({'값':[1,2,3]})\n        def add_total(x):\n            x['누적'] = x['값'].cumsum()\n            return x\n        r = df.pipe(add_total)\n        print('마지막누적:', r.loc[2,'누적'])\n        print('열수:', len(r.columns))\n\napp = AdvancedPandas20()\napp.run()", "answer": "마지막누적: 6\n열수: 2", "explain": "클래스의 run() 메서드 안에서 pandas 연산을 수행합니다. pipe로 누적 열을 추가합니다."}];

function norm(s){
    return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");
}
function esc(s){
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function render(){
    const qbox=document.getElementById("questions");
    const nav=document.getElementById("navBtns");
    let out="", navOut="", current="";
    QUESTIONS.forEach((q,i)=>{
        const group = q.cat + " - " + q.sub;
        if(group!==current){
            current=group;
            out += `<h2>${group}</h2>`;
            navOut += `<button style="background:#0f172a;color:white;margin-top:10px" onclick="location.hash='q${i+1}'">${group}</button>`;
        }
        navOut += `<button onclick="location.hash='q${i+1}'">${i+1}번</button>`;
        out += `
        <div class="card" id="q${i+1}">
            <span class="badge">${i+1}번 · ${q.cat} · ${q.sub}</span>
            <h3>${q.title}</h3>
            <p><b>문제.</b> 다음 pandas 코드의 출력 결과를 쓰시오.</p>
            <pre><code>${esc(q.code)}</code></pre>
            <textarea id="ans${i}" placeholder="출력 결과를 줄 단위로 입력하세요."></textarea>
            <div id="res${i}" class="result"></div>
        </div>`;
    });
    qbox.innerHTML=out;
    nav.innerHTML=navOut;
}
function gradeAll(){
    let correct=0;
    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <div>${ok ? '<span class="correct">정답</span>' : '<span class="wrong">오답</span>'}</div>
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
    const score=Math.round(correct/QUESTIONS.length*100);
    document.getElementById("scoreBox").innerHTML =
        `총점: <b>${score}점</b> / 정답: <b>${correct}</b>개 / 전체: <b>${QUESTIONS.length}</b>문항`;
}
function showAllSolutions(){
    QUESTIONS.forEach((q,i)=>{
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
}
function downloadTxt(){
    gradeAll();
    let sid=document.getElementById("studentId").value.trim() || "학번";
    let name=document.getElementById("studentName").value.trim() || "이름";
    let now=new Date();
    let stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"_"+String(now.getHours()).padStart(2,"0")+"-"+String(now.getMinutes()).padStart(2,"0")+"-"+String(now.getSeconds()).padStart(2,"0");

    let correct=0;
    let lines=[];
    lines.push("pandas 서술형 평가 결과");
    lines.push("학번: "+sid);
    lines.push("이름: "+name);
    lines.push("응시시각: "+stamp);
    lines.push("");

    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        lines.push(`[${i+1}번] ${q.cat} - ${q.sub} - ${q.title} : ${ok ? "정답" : "오답"}`);
        lines.push("학생 답안:");
        lines.push(user || "(미입력)");
        lines.push("정답:");
        lines.push(q.answer);
        lines.push("상세 풀이: "+q.explain);
        lines.push("----------------------------------------");
    });
    let score=Math.round(correct/QUESTIONS.length*100);
    lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+QUESTIONS.length);

    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${sid}_${name}_pandas_${score}점_${stamp}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
}
render();
</script>
