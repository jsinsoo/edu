["코알라","The koala asked people to plant connected corridors of native eucalyptus trees.","코알라는 토종 유칼립투스나무로 연결된 생태 통로를 심어 달라고 요청했습니다."],

["순록","The reindeer asked roads and industries not to block ancient Arctic migrations.","순록은 도로와 산업시설이 오래된 북극 이동로를 막지 말아 달라고 요청했습니다."],
["무스","The moose warned that warmer wetlands bring heat stress and changing parasites.","무스는 따뜻해진 습지가 열 스트레스와 달라진 기생충 문제를 가져온다고 경고했습니다."],
["엘크","The elk supported balanced forests where grazing, predators, and young trees coexist.","엘크는 풀을 뜯는 동물과 포식자와 어린나무가 공존하는 균형 잡힌 숲을 지지했습니다."],
["가젤","The gazelle requested open migration paths across healthy, unfenced plains.","가젤은 건강하고 울타리 없는 평원을 가로지르는 열린 이동로를 요청했습니다."],
["임팔라","The impala shared water carefully with smaller animals during the drought.","임팔라는 가뭄 동안 작은 동물들과 물을 조심스럽게 나누었습니다."],
["누","The wildebeest explained that great migrations move nutrients across vast ecosystems.","누는 대규모 이동이 광대한 생태계 전체에 영양분을 옮긴다고 설명했습니다."],
["오카피","The okapi spoke softly for hidden rainforest species that people rarely see.","오카피는 사람들이 좀처럼 보지 못하는 숨은 열대우림 생물들을 대신해 조용히 말했습니다."],
["멧돼지","The wild boar asked towns to manage food waste and protect forest boundaries.","멧돼지는 도시가 음식물 쓰레기를 관리하고 숲의 경계를 보호해 달라고 요청했습니다."],
["혹멧돼지","The warthog showed that burrows and grazing both create habitats for other species.","혹멧돼지는 굴과 풀 뜯기가 다른 생물들의 서식지를 만들기도 한다고 보여 주었습니다."],
["낙타","The camel demonstrated careful water use and solar power in a desert community.","낙타는 사막 공동체에서 신중한 물 사용과 태양광 에너지를 보여 주었습니다."],
["라마","The llama carried fairly traded goods along a low-impact mountain trail.","라마는 환경 부담이 적은 산길을 따라 공정무역 상품을 운반했습니다."],
["알파카","The alpaca asked clothing makers to value durable fibers and responsible farming.","알파카는 의류 생산자들에게 튼튼한 섬유와 책임 있는 농업을 중시해 달라고 요청했습니다."],
["당나귀","The donkey delivered books and water filters without burning fossil fuel.","당나귀는 화석연료를 태우지 않고 책과 정수 필터를 운반했습니다."],
["말","The horse helped restore a trail designed for people, wildlife, and healthy soil.","말은 사람과 야생동물과 건강한 흙을 위해 설계된 길을 복원하는 데 힘을 보탰습니다."],
["산양","The mountain goat requested safe cliffs protected from excessive development.","산양은 지나친 개발로부터 보호되는 안전한 절벽을 요청했습니다."],
["큰뿔양","The bighorn sheep crossed a wildlife bridge to reach seasonal feeding grounds.","큰뿔양은 계절 먹이터에 도달하기 위해 생태 다리를 건넜습니다."],
["아이벡스","The ibex warned that shrinking glaciers change every stream below the mountains.","아이벡스는 줄어드는 빙하가 산 아래의 모든 하천을 바꾼다고 경고했습니다."],
["비버","The beaver built wetlands that slowed floods, filtered water, and sheltered wildlife.","비버는 홍수를 늦추고 물을 정화하며 야생동물을 보호하는 습지를 만들었습니다."],
["카피바라","The capybara welcomed many species to a peaceful and carefully protected riverbank.","카피바라는 평화롭고 세심하게 보호된 강둑으로 여러 생물을 맞아들였습니다."],
["친칠라","The chinchilla asked miners to protect the dry mountain habitat it calls home.","친칠라는 광산업자들에게 자신의 보금자리인 건조한 산악 서식지를 보호해 달라고 요청했습니다."],
["호저","The porcupine reminded drivers to slow down where forest roads cross animal paths.","호저는 숲길과 동물 이동로가 만나는 곳에서 운전자들이 속도를 줄여야 한다고 일깨웠습니다."],
["청설모","The red squirrel stored seeds that later grew into climate-resilient trees.","청설모가 저장한 씨앗은 훗날 기후변화에 강한 나무로 자랐습니다."],
["프레리도그","The prairie dog showed that underground towns create shelter for many neighbors.","프레리도그는 지하 도시가 여러 이웃에게 보금자리를 제공한다고 보여 주었습니다."],
["큰돌고래","The bottlenose dolphin asked boats to reduce plastic waste, speed, and underwater noise.","큰돌고래는 선박에 플라스틱 쓰레기와 속도와 수중 소음을 줄여 달라고 요청했습니다."],
["범고래","The orca explained that clean oceans need healthy food webs from coast to deep sea.","범고래는 깨끗한 바다에 해안부터 심해까지 건강한 먹이그물이 필요하다고 설명했습니다."],
["흰긴수염고래","The blue whale carried carbon deep into the ocean through its enormous life cycle.","흰긴수염고래는 거대한 생애 주기를 통해 탄소를 깊은 바다로 운반했습니다."],
["혹등고래","The humpback whale sang for quieter shipping lanes and safer migrations.","혹등고래는 더 조용한 항로와 안전한 이동을 바라며 노래했습니다."],
["향유고래","The sperm whale asked humans to protect mysterious deep-sea habitats from pollution.","향유고래는 신비로운 심해 서식지를 오염으로부터 보호해 달라고 사람들에게 요청했습니다."],
["듀공","The dugong guarded seagrass meadows that feed animals and capture carbon.","듀공은 동물에게 먹이를 주고 탄소를 흡수하는 해초 초원을 지켰습니다."],
["바다코끼리","The walrus warned that disappearing sea ice removes vital places to rest.","바다코끼리는 사라지는 해빙이 꼭 필요한 휴식처를 없앤다고 경고했습니다."],
["잔점박이물범","The spotted seal requested clean coasts, safe ice, and fishing nets that spare wildlife.","잔점박이물범은 깨끗한 해안과 안전한 얼음, 야생동물을 해치지 않는 그물을 요청했습니다."],
["큰박쥐","The flying fox planted forests by carrying pollen and seeds through the night.","큰박쥐는 밤새 꽃가루와 씨앗을 옮기며 숲을 심었습니다."],
["흡혈박쥐","The vampire bat taught the council that even feared animals have important ecological roles.","흡혈박쥐는 두려움의 대상인 동물도 중요한 생태적 역할을 한다고 회의 참가자들에게 가르쳤습니다."]
];
const list=document.getElementById('list'),q=document.getElementById('q'),count=document.getElementById('count');
list.innerHTML=data.map((x,i)=>`<article class="card" data-s="${x.join(' ').toLowerCase()}"><div class="num">${i+1}</div><div class="body"><div class="animal">${x[0]} · turtle${String(i+1).padStart(2,'0')}.gif</div><p class="en" lang="en">${x[1]}</p><p class="ko" lang="ko">${x[2]}</p></div></article>`).join('');
q.oninput=()=>{let n=0;document.querySelectorAll('.card').forEach(c=>{const on=c.dataset.s.includes(q.value.trim().toLowerCase());c.classList.toggle('hide',!on);if(on)n++});count.textContent=`${n} / ${data.length}`};
function speak(lang){speechSynthesis.cancel();const sel=lang==='en-US'?'.en':'.ko',u=new SpeechSynthesisUtterance([...document.querySelectorAll('.card:not(.hide)')].map(c=>c.querySelector(sel).textContent).join(' '));u.lang=lang;u.rate=lang==='en-US'?.85:.95;speechSynthesis.speak(u)}
</script>
</body></html>
