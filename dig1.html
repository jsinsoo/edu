<script>
const UNITS=[{"unit": "5-1", "title": "디지털 기술과 진로 설계", "code_label": "디지털 기술과 진로 설계 기초 파이썬 코드 서술형 문제", "concept": "디지털 기술은 인공지능, 빅데이터, 사물인터넷, 클라우드, 로봇, 메타버스 등 다양한 분야와 연결되어 사회와 직업 세계를 변화시키고 있다. 진로 설계는 자신의 흥미, 적성, 가치관을 파악하고 관련 직업과 필요한 역량을 탐색하여 학습 계획과 실천 전략을 세우는 과정이다. 디지털 사회에서는 문제 해결력, 데이터 활용 능력, 협업 능력, 의사소통 능력, 윤리 의식이 중요하다.", "codes": [{"title": "흥미 기반 진로 추천", "code": "interest=\"데이터\"\ncareer=\"데이터 분석가\" if interest==\"데이터\" else \"디지털 기획자\"\nprint(\"관심 분야:\",interest)\nprint(\"추천 진로:\",career)\nprint(\"필요 역량:\",\"분석력\")", "answer": "관심 분야: 데이터\n추천 진로: 데이터 분석가\n필요 역량: 분석력", "explain": "관심 분야가 데이터이면 데이터 분석가 진로와 연결할 수 있다."}, {"title": "디지털 역량 점검", "code": "skills=[\"코딩\",\"협업\",\"문제해결\"]\ncount=len(skills)\nprint(\"보유 역량:\",skills)\nprint(\"역량 개수:\",count)\nprint(\"진로 준비:\",\"기초 양호\")", "answer": "보유 역량: ['코딩', '협업', '문제해결']\n역량 개수: 3\n진로 준비: 기초 양호", "explain": "디지털 진로 설계에서는 보유 역량을 점검해야 한다."}, {"title": "직업 분야 분류", "code": "job=\"AI 개발자\"\nfield=\"인공지능\" if \"AI\" in job else \"일반 디지털\"\nprint(\"직업:\",job)\nprint(\"관련 분야:\",field)\nprint(\"학습 과목:\",\"프로그래밍\")", "answer": "직업: AI 개발자\n관련 분야: 인공지능\n학습 과목: 프로그래밍", "explain": "AI 개발자는 인공지능 분야와 관련된다."}, {"title": "학습 계획 세우기", "code": "goal=\"앱 개발자\"\nplan=[\"파이썬\",\"자료구조\",\"프로젝트\"]\nprint(\"진로 목표:\",goal)\nprint(\"학습 계획:\",plan)\nprint(\"첫 단계:\",plan[0])", "answer": "진로 목표: 앱 개발자\n학습 계획: ['파이썬', '자료구조', '프로젝트']\n첫 단계: 파이썬", "explain": "진로 목표에 맞춰 단계적 학습 계획을 세운다."}, {"title": "미래 직업 변화", "code": "tech=\"자동화\"\nchange=\"반복 업무 감소\" if tech==\"자동화\" else \"변화 분석 필요\"\nprint(\"핵심 기술:\",tech)\nprint(\"직업 변화:\",change)\nprint(\"필요 태도:\",\"평생 학습\")", "answer": "핵심 기술: 자동화\n직업 변화: 반복 업무 감소\n필요 태도: 평생 학습", "explain": "자동화는 직업 구조를 변화시키므로 지속적 학습이 필요하다."}, {"title": "역량 우선순위", "code": "abilities={\"코딩\":80,\"소통\":70,\"윤리\":90}\nbest=max(abilities,key=abilities.get)\nprint(\"역량 점수:\",abilities)\nprint(\"가장 높은 역량:\",best)\nprint(\"점수:\",abilities[best])", "answer": "역량 점수: {'코딩': 80, '소통': 70, '윤리': 90}\n가장 높은 역량: 윤리\n점수: 90", "explain": -5678\n전화번호 포함: True\n판단: 보호 필요", "explain": "전화번호 같은 개인정보는 공유 전 보호해야 한다."}, {"title": "출처 표시 OOP", "code": "class Citation:\n    def __init__(self, source):\n        self.source=source\n    def show(self):\n        print(\"자료 출처:\",self.source)\n        print(\"출처 표시:\",self.source!=\"\")\n        print(\"공유 태도:\",\"책임 있는 사용\")\n\nc=Citation(\"공공데이터포털\")\nc.show()", "answer": "자료 출처: 공공데이터포털\n출처 표시: True\n공유 태도: 책임 있는 사용", "explain": "정보 공유 시 출처를 표시해야 한다."}, {"title": "접근 권한 검사 OOP", "code": "class AccessControl:\n    def __init__(self, role):\n        self.role=role\n    def allow(self):\n        allowed=self.role in [\"교사\",\"관리자\"]\n        print(\"사용자 역할:\",self.role)\n        print(\"접근 허용:\",allowed)\n        print(\"보호 방식:\",\"권한 관리\")\n\na=AccessControl(\"학생\")\na.allow()", "answer": "사용자 역할: 학생\n접근 허용: False\n보호 방식: 권한 관리", "explain": "중요 정보는 권한에 따라 접근을 제한해야 한다."}, {"title": "비밀번호 강도 OOP", "code": "class PasswordChecker:\n    def __init__(self,password):\n        self.password=password\n    def check(self):\n        strong=len(self.password)>=8\n        print(\"비밀번호 길이:\",len(self.password))\n        print(\"강한 비밀번호:\",strong)\n        print(\"권장:\",\"8자 이상\")\n\npc=PasswordChecker(\"abc12345\")\npc.check()", "answer": "비밀번호 길이: 8\n강한 비밀번호: True\n권장: 8자 이상", "explain": "강한 비밀번호는 정보 보호의 기본이다."}, {"title": "자료 공유 허가 OOP", "code": "class FileShare:\n    def __init__(self,owner,permission):\n        self.owner=owner\n        self.permission=permission\n    def status(self):\n        print(\"소유자:\",self.owner)\n        print(\"권한:\",self.permission)\n        print(\"다운로드 가능:\",self.permission==\"편집 가능\")\n\nf=FileShare(\"민수\",\"보기 가능\")\nf.status()", "answer": "소유자: 민수\n권한: 보기 가능\n다운로드 가능: False", "explain": "공유 권한에 따라 가능한 행동이 달라진다."}, {"title": "저작권 확인 OOP", "code": "class Copyright:\n    def __init__(self,license_type):\n        self.license_type=license_type\n    def check(self):\n        usable=self.license_type in [\"CC BY\",\"공공누리\"]\n        print(\"라이선스:\",self.license_type)\n        print(\"사용 가능:\",usable)\n        print(\"조건:\",\"출처 표시\")\n\ncr=Copyright(\"CC BY\")\ncr.check()", "answer": "라이선스: CC BY\n사용 가능: True\n조건: 출처 표시", "explain": "저작권과 라이선스를 확인하고 조건을 지켜야 한다."}, {"title": "암호화 기초 OOP", "code": "class SimpleEncryptor:\n    def __init__(self,text):\n        self.text=text\n    def encrypt(self):\n        result=\"*\"*len(self.text)\n        print(\"원문:\",self.text)\n        print(\"암호화:\",result)\n        print(\"목적:\",\"내용 보호\")\n\ne=SimpleEncryptor(\"secret\")\ne.encrypt()", "answer": "원문: secret\n암호화: ******\n목적: 내용 보호", "explain": "암호화는 내용을 알아보기 어렵게 바꾸어 보호한다."}, {"title": "공유 전 점검 OOP", "code": "class ShareChecklist:\n    def __init__(self,privacy,source):\n        self.privacy=privacy\n        self.source=source\n    def check(self):\n        ok=(not self.privacy) and self.source\n        print(\"개인정보 포함:\",self.privacy)\n        print(\"출처 있음:\",self.source)\n        print(\"공유 가능:\",ok)\n\nch=ShareChecklist(False,True)\nch.check()", "answer": "개인정보 포함: False\n출처 있음: True\n공유 가능: True", "explain": "개인정보와 출처를 모두 확인해야 한다."}, {"title": "로그 기록 OOP", "code": "class AccessLog:\n    def __init__(self,user,action):\n        self.user=user\n        self.action=action\n    def record(self):\n        print(\"사용자:\",self.user)\n        print(\"활동:\",self.action)\n        print(\"기록 목적:\",\"보안 점검\")\n\nlog=AccessLog(\"user01\",\"파일 열람\")\nlog.record()", "answer": "사용자: user01\n활동: 파일 열람\n기록 목적: 보안 점검", "explain": "접근 기록은 보안 점검과 책임 추적에 도움이 된다."}], "ox": [["정보 공유 시 개인정보 포함 여부를 확인해야 한다.", "O", "개인정보 유출을 막기 위해 필요하다."], ["출처 표시 없이 모든 자료를 자유롭게 사용해도 된다.", "X", "저작권과 출처를 지켜야 한다."], ["정보 보호는 무단 접근을 막는 활동을 포함한다.", "O", "접근 권한 관리가 중요하다."], ["비밀번호는 짧고 단순할수록 안전하다.", "X", "길고 복잡할수록 안전하다."], ["공개 범위 설정은 정보 보호와 관련 있다.", "O", "누가 볼 수 있는지 제한한다."], ["접근 권한은 사용자 역할에 따라 달라질 수 있다.", "O", "관리자, 교사, 학생 등 역할에 따라 권한을 나눈다."], ["저작권이 있는 자료는 사용 조건을 확인해야 한다.", "O", "라이선스 조건을 확인해야 한다."], ["암호화는 정보를 보호하는 방법 중 하나이다.", "O", "내용을 알아보기 어렵게 만든다."], ["공유 전 점검은 불필요하다.", "X", "개인정보와 출처를 확인해야 한다."], ["접근 로그는 보안 점검에 도움이 될 수 있다.", "O", "누가 무엇을 했는지 기록할 수 있다."]], "mc": [["정보 공유 전 확인해야 할 것은?", ["개인정보 포함 여부", "마우스 색", "책상 높이", "화면 밝기", "전원 버튼"], 0, "개인정보 유출을 막아야 한다."], ["정보 보호의 목적은?", ["무단 접근과 유출 방지", "무조건 공개", "자료 삭제만", "출처 제거", "권한 무시"], 0, "정보를 안전하게 지키는 것이다."], ["출처 표시가 필요한 이유는?", ["저작권과 책임 있는 사용 때문", "글자색 때문", "마우스 속도 때문", "파일명 길이 때문", "컴퓨터 배경 때문"], 0, "타인의 자료 사용에는 출처 표시가 중요하다."], ["강한 비밀번호 조건으로 적절한 것은?", ["충분한 길이와 복잡성", "이름만 사용", "1234만 사용", "생일만 사용", "한 글자만 사용"], 0, "길고 복잡한 비밀번호가 안전하다."], ["접근 권한 관리의 목적은?", ["필요한 사람만 접근하게 하기", "모두 무조건 공개", "자료를 항상 삭제", "출처 없애기", "암호 끄기"], 0, "권한에 따라 접근을 제한한다."], ["공개 범위 설정과 관련 있는 것은?", ["보기 가능한 대상 정하기", "키보드 색 정하기", "모니터 크기 재기", "책상 옮기기", "종이 자르기"], 0, "공개 범위는 접근 대상을 정한다."], ["저작권 확인이 필요한 상황은?", ["타인의 자료를 공유할 때", "마우스를 움직일 때", "창을 닫을 때", "전원을 켤 때", "글자를 크게 할 때"], 0, "자료 사용 조건을 확인해야 한다."], ["암호화의 의미는?", ["내용을 알아보기 어렵게 변환", "자료를 무조건 삭제", "화면을 밝게 함", "소리를 줄임", "마우스를 잠금"], 0, "암호화는 정보 보호 방법이다."], ["접근 로그의 역할은?", ["활동 기록과 보안 점검", "그림 색칠", "종이 접기", "전원 차단", "자료 무시"], 0, "접근 기록은 보안 점검에 도움된다."], ["공유 가능한 자료의 조건으로 적절한 것은?", ["개인정보가 없고 출처가 명확함", "개인정보가 많음", "출처가 없음", "권한이 없음", "저작권 무시"], 0, "개인정보와 출처를 확인해야 한다."]]}, {"unit": "5-3", "title": "정보 보안과 디지털 윤리", "code_label": "정보 보안과 디지털 윤리 OOP 파이썬 코드 서술형 문제", "concept": "정보 보안은 정보의 기밀성, 무결성, 가용성을 지키는 활동이다. 악성코드, 피싱, 비밀번호 탈취, 개인정보 유출, 계정 도용 등 다양한 보안 위협에 대비해야 한다. 디지털 윤리는 온라인 공간에서 타인의 권리와 인격을 존중하고, 허위 정보 유포, 사이버 폭력, 저작권 침해, 개인정보 침해를 하지 않는 책임 있는 태도이다. OOP 방식으로 보안 점검, 윤리 판단, 위험 탐지 기능을 객체로 구조화할 수 있다.", "codes": [{"title": "피싱 의심 검사 OOP", "code": "class PhishingChecker:\n    def __init__(self,url):\n        self.url=url\n    def check(self):\n        danger=\"login\" in self.url and \"secure\" not in self.url\n        print(\"URL:\",self.url)\n        print(\"피싱 의심:\",danger)\n        print(\"대응:\",\"접속 주의\" if danger else \"확인 후 사용\")\n\np=PhishingChecker(\"http://login-example.com\")\np.check()", "answer": "URL: http://login-example.com\n피싱 의심: True\n대응: 접속 주의", "explain": "의심스러운 로그인 URL은 피싱 위험이 있을 수 있다."}, {"title": "비밀번호 안전성 OOP", "code": "class PasswordSecurity:\n    def __init__(self,password):\n        self.password=password\n    def check(self):\n        safe=len(self.password)>=10 and any(ch.isdigit() for ch in self.password)\n        print(\"길이:\",len(self.password))\n        print(\"숫자 포함:\",any(ch.isdigit() for ch in self.password))\n        print(\"안전:\",safe)\n\nps=PasswordSecurity(\"safe123456\")\nps.check()", "answer": "길이: 10\n숫자 포함: True\n안전: True", "explain": "비밀번호는 길이와 복잡성이 중요하다."}, {"title": "개인정보 보호 OOP", "code": "class PersonalInfo:\n    def __init__(self,data):\n        self.data=data\n    def detect(self):\n        has_private=\"주민번호\" in self.data\n        print(\"자료:\",self.data)\n        print(\"민감정보 포함:\",has_private)\n        print(\"처리:\",\"비공개\" if has_private else \"공유 가능\")\n\npi=PersonalInfo(\"주민번호 포함 문서\")\npi.detect()", "answer": "자료: 주민번호 포함 문서\n민감정보 포함: True\n처리: 비공개", "explain": "민감정보는 공개하지 않아야 한다."}, {"title": "저작권 윤리 OOP", "code": "class DigitalEthics:\n    def __init__(self,source):\n        self.source=source\n    def check(self):\n        ethical=self.source!=\"무단 복사\"\n        print(\"자료 사용:\",self.source)\n        print(\"윤리적 사용:\",ethical)\n        print(\"원칙:\",\"출처와 허가 확인\")\n\nde=DigitalEthics(\"출처 표시\")\nde.check()", "answer": "자료 사용: 출처 표시\n윤리적 사용: True\n원칙: 출처와 허가 확인", "explain": "저작권을 지키고 출처를 표시해야 한다."}, {"title": "악성코드 위험 OOP", "code": "class MalwareDetector:\n    def __init__(self,filename):\n        self.filename=filename\n    def scan(self):\n        risky=self.filename.endswith(\".exe\")\n        print(\"파일명:\",self.filename)\n        print(\"위험 가능성:\",risky)\n        print(\"대응:\",\"검사 후 실행\")\n\nm=MalwareDetector(\"free_game.exe\")\nm.scan()", "answer": "파일명: free_game.exe\n위험 가능성: True\n대응: 검사 후 실행", "explain": "실행 파일은 악성코드 가능성을 주의해야 한다."}, {"title": "사이버 폭력 판단 OOP", "code": "class CommentChecker:\n    def __init__(self,comment):\n        self.comment=comment\n    def check(self):\n        harmful=\"바보\" in self.comment\n        print(\"댓글:\",self.comment)\n        print(\"상처 가능:\",harmful)\n        print(\"윤리:\",\"존중 표현 사용\")\n\ncc=CommentChecker(\"너는 바보야\")\ncc.check()", "answer": "댓글: 너는 바보야\n상처 가능: True\n윤리: 존중 표현 사용", "explain": "온라인에서도 타인을 존중해야 한다."}, {"title": "허위 정보 점검 OOP", "code": "class FakeNewsChecker:\n    def __init__(self,verified):\n        self.verified=verified\n    def check(self):\n        print(\"출처 확인:\",self.verified)\n        print(\"공유 가능:\",self.verified)\n        print(\"원칙:\",\"확인 후 공유\")\n\nf=FakeNewsChecker(False)\nf.check()", "answer": "출처 확인: False\n공유 가능: False\n원칙: 확인 후 공유", "explain": "출처가 확인되지 않은 정보는 공유하지 않아야 한다."}, {"title": "보안 3요소 OOP", "code": "class SecurityCIA:\n    def __init__(self):\n        self.items=[\"기밀성\",\"무결성\",\"가용성\"]\n    def show(self):\n        print(\"보안 요소:\",self.items)\n        print(\"개수:\",len(self.items))\n        print(\"목표:\",\"정보 보호\")\n\ncia=SecurityCIA()\ncia.show()", "answer": "보안 요소: ['기밀성', '무결성', '가용성']\n개수: 3\n목표: 정보 보호", "explain": "정보 보안의 3요소는 기밀성, 무결성, 가용성이다."}, {"title": "2단계 인증 OOP", "code": "class TwoFactorAuth:\n    def __init__(self,password_ok,code_ok):\n        self.password_ok=password_ok\n        self.code_ok=code_ok\n    def login(self):\n        success=self.password_ok and self.code_ok\n        print(\"비밀번호 확인:\",self.password_ok)\n        print(\"인증 코드 확인:\",self.code_ok)\n        print(\"로그인 성공:\",success)\n\ntfa=TwoFactorAuth(True,True)\ntfa.login()", "answer": "비밀번호 확인: True\n인증 코드 확인: True\n로그인 성공: True", "explain": "2단계 인증은 계정 보안을 강화한다."}, {"title": "디지털 발자국 OOP", "code": "class DigitalFootprint:\n    def __init__(self,post_count):\n        self.post_count=post_count\n    def check(self):\n        print(\"게시글 수:\",self.post_count)\n        print(\"디지털 발자국 존재:\",self.post_count>0)\n        print(\"주의:\",\"신중한 게시\")\n\ndf=DigitalFootprint(12)\ndf.check()", "answer": "게시글 수: 12\n디지털 발자국 존재: True\n주의: 신중한 게시", "explain": function norm(s){return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function render(){
 let out="",nav="";
 UNITS.forEach((u,ui)=>{
  nav+=`<button class="group-btn" onclick="location.hash='unit${ui}'">${u.unit} ${u.title}</button><button onclick="location.hash='concept${ui}'">개념 설명</button>`;
  out+=`<section id="unit${ui}"><h2>${u.unit} ${u.title}</h2></section><div class="card" id="concept${ui}"><span class="badge">${u.unit}</span><h3>개념 설명</h3><div class="concept">${esc(u.concept)}</div></div><h2>${u.code_label}</h2>`;

  nav+=`<button onclick="location.hash='ox${ui}'">OX 10문항</button>`;out+=`<div class="card" id="ox${ui}"><span class="badge">${u.unit}</span><h3>OX 10문항</h3><div class="quizbox">${renderOX(ui,u)}</div></div>`;

 });

function renderOX(ui,u){return u.ox.map((o,j)=>`<div class="quizitem"><b>OX-${j+1}.</b> ${esc(o[0])}<br><select id="ox_${ui}_${j}"><option value="">선택</option><option value="O">O</option><option value="X">X</option></select><div id="oxRes_${ui}_${j}" class="result"></div></div>`).join("");}
function renderMC(ui,u){return u.mc.map((m,j)=>`<div class="quizitem"><b>객관식-${j+1}.</b> ${esc(m[0])}<br>${m[1].map((c,k)=>`<label class="choice-label"><input type="radio" name="mc_${ui}_${j}" value="${k}"> ${k+1}. ${esc(c)}</label>`).join("")}<div id="mcRes_${ui}_${j}" class="result"></div></div>`).join("");}
function gradeAll(){
 let correct=0,total=0;
 UNITS.forEach((u,ui)=>{
  u.codes.forEach((c,ci)=>{total++;let user=norm(document.getElementById(`codeAns_${ui}_${ci}`).value),ok=user===norm(c.answer);if(ok)correct++;let r=document.getElementById(`codeRes_${ui}_${ci}`);r.style.display="block";r.innerHTML=`<div>${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'}</div><b>정답 출력</b><pre><code>${esc(c.answer)}</code></pre><b>상세 풀이</b><br>${c.explain}`; });
  u.ox.forEach((o,j)=>{total++;let val=document.getElementById(`ox_${ui}_${j}`).value,ok=val===o[1];if(ok)correct++;let r=document.getElementById(`oxRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'} · 정답: <b>${o[1]}</b><br>${o[2]}`; });

function showAllSolutions(){UNITS.forEach((u,ui)=>{u.codes.forEach((c,ci)=>{let r=document.getElementById(`codeRes_${ui}_${ci}`);r.style.display="block";r.innerHTML=`<b>정답 출력</b><pre><code>${esc(c.answer)}</code></pre><b>상세 풀이</b><br>${c.explain}`;});u.ox.forEach((o,j)=>{let r=document.getElementById(`oxRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`정답: <b>${o[1]}</b><br>${o[2]}`;});u.mc.forEach((m,j)=>{let r=document.getElementById(`mcRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`정답: <b>${m[2]+1}번</b><br>${m[3]}`;});});}
