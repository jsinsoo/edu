<script>
const UNITS=[{"unit": "4-1", "title": "인공지능과 에이전트", "concept": "인공지능은 탐색, 추론, 학습 등 인간의 지적 능력을 컴퓨터로 구현하는 기술이다. 지능 에이전트는 센서로 환경을 인식하고, 인공지능으로 판단한 뒤, 구동기를 통해 행동한다. 인공지능 비서, 의료 진단 시스템, 대화형 영어 학습기, 자율주행 자동차, 스마트 냉장고, 화성 탐사 로봇 등이 지능 에이전트의 사례이다. 인공지능은 인간의 반복적이고 복잡한 일을 도울 수 있지만, 감정·공감·창의성·윤리적 판단은 인간의 역할이 중요하다.", "codes": [{"title": "스마트 스피커 에이전트", "code": "sensor=\"음성 명령\"\ndecision=\"음악 추천\"\naction=\"스피커로 재생\"\nprint(\"인식:\",sensor)\nprint(\"판단:\",decision)\nprint(\"행동:\",action)", "answer": "인식: 음성 명령\n판단: 음악 추천\n행동: 스피커로 재생", "explain": "음성을 인식하고 음악 추천을 판단하여 재생한다."}, {"title": "챗봇 에이전트", "code": "user_input=\"급식 알려줘\"\nanswer=\"오늘 급식 정보를 보여줍니다.\" if \"급식\" in user_input else \"질문을 다시 입력하세요.\"\nprint(\"입력:\",user_input)\nprint(\"판단:\",\"급식 요청\")\nprint(\"응답:\",answer)", "answer": "입력: 급식 알려줘\n판단: 급식 요청\n응답: 오늘 급식 정보를 보여줍니다.", "explain": "입력을 인식하고 요청 의도를 판단해 응답한다."}, {"title": "자율주행 자동차", "code": "distance=3\naction=\"감속\" if distance<5 else \"주행 유지\"\nprint(\"센서 거리:\",distance)\nprint(\"판단:\",\"위험\")\nprint(\"행동:\",action)", "answer": "센서 거리: 3\n판단: 위험\n행동: 감속", "explain": "거리 센서 정보를 바탕으로 위험을 판단한다."}, {"title": "의료 진단 보조", "code": "symptom_score=8\nresult=\"정밀 검사 권장\" if symptom_score>=7 else \"경과 관찰\"\nprint(\"증상 점수:\",symptom_score)\nprint(\"판단:\",result)\nprint(\"역할:\",\"의사 결정 보조\")", "answer": "증상 점수: 8\n판단: 정밀 검사 권장\n역할: 의사 결정 보조", "explain": "의료진의 판단을 보조하는 지능 에이전트 사례이다."}, {"title": "스마트 냉장고", "code": "ingredients=[\"계란\",\"우유\",\"치즈\"]\nmenu=\"오믈렛\" if \"계란\" in ingredients and \"치즈\" in ingredients else \"샐러드\"\nprint(\"인식 재료:\",ingredients)\nprint(\"추천 메뉴:\",menu)\nprint(\"행동:\",\"레시피 안내\")", "answer": "인식 재료: ['계란', '우유', '치즈']\n추천 메뉴: 오믈렛\n행동: 레시피 안내", "explain": "재료를 인식하고 메뉴를 추천한다."}, {"title": "인공지능 세탁기", "code": "weight=7\nfabric=\"면\"\nmode=\"강력 세탁\" if weight>=5 else \"표준 세탁\"\nprint(\"의류 재질:\",fabric)\nprint(\"무게:\",weight)\nprint(\"세탁 모드:\",mode)", "answer": "의류 재질: 면\n무게: 7\n세탁 모드: 강력 세탁", "explain": "의류 정보를 바탕으로 세탁 방식을 선택한다."}, {"title": "화성 탐사 로봇", " function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function render(){

}
function renderOX(ui,u){return u.ox.map((o,j)=>`<div class="quizitem"><b>OX-${j+1}.</b> ${esc(o[0])}<br><select id="ox_${ui}_${j}"><option value="">선택</option><option value="O">O</option><option value="X">X</option></select><div id="oxRes_${ui}_${j}" class="result"></div></div>`).join("");}
function renderMC(ui,u){return u.mc.map((m,j)=>`<div class="quizitem"><b>객관식-${j+1}.</b> ${esc(m[0])}<br>${m[1].map((c,k)=>`<label class="choice-label"><input type="radio" name="mc_${ui}_${j}" value="${k}"> ${k+1}. ${esc(c)}</label>`).join("")}<div id="mcRes_${ui}_${j}" class="result"></div></div>`).join("");}
function gradeAll(){
 let correct=0,total=0;
 UNITS.forEach((u,ui)=>{
  u.codes.forEach((c,ci)=>{total++;let user=norm(document.getElementById(`codeAns_${ui}_${ci}`).value),ok=user===norm(c.answer);if(ok)correct++;let r=document.getElementById(`codeRes_${ui}_${ci}`);r.style.display="block";r.innerHTML=`<div>${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'}</div><b>정답 출력</b><pre><code>${esc(c.answer)}</code></pre><b>상세 풀이</b><br>${c.explain}`; });
  u.ox.forEach((o,j)=>{total++;let val=document.getElementById(`ox_${ui}_${j}`).value,ok=val===o[1];if(ok)correct++;let r=document.getElementById(`oxRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'} · 정답: <b>${o[1]}</b><br>${o[2]}`; });
  u.mc.forEach((m,j)=>{total++;let chk=document.querySelector(`input[name="mc_${ui}_${j}"]:checked`),val=chk?Number(chk.value):-1,ok=val===m[2];if(ok)correct++;let r=document.getElementById(`mcRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'} · 정답: <b>${m[2]+1}번</b><br>${m[3]}`; });
 });
 let score=Math.round(correct/total*100);document.getElementById("scoreBox").innerHTML=`총점: <b>${score}점</b> / 정답: <b>${correct}</b>개 / 전체: <b>${total}</b>문항`;
}
function showAllSolutions(){UNITS.forEach((u,ui)=>{u.codes.forEach((c,ci)=>{let r=document.getElementById(`codeRes_${ui}_${ci}`);r.style.display="block";r.innerHTML=`<b>정답 출력</b><pre><code>${esc(c.answer)}</code></pre><b>상세 풀이</b><br>${c.explain}`;});u.ox.forEach((o,j)=>{let r=document.getElementById(`oxRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`정답: <b>${o[1]}</b><br>${o[2]}`;});u.mc.forEach((m,j)=>{let r=document.getElementById(`mcRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`정답: <b>${m[2]+1}번</b><br>${m[3]}`;});});}
function downloadTxt(){
 gradeAll();let sid=document.getElementById("studentId").value.trim()||"학번",name=document.getElementById("studentName").value.trim()||"이름",now=new Date(),stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"_"+String(now.getHours()).padStart(2,"0")+"-"+String(now.getMinutes()).padStart(2,"0")+"-"+String(now.getSeconds()).padStart(2,"0");
 let correct=0,total=0,lines=["4단원 인공지능과 기계학습 평가 결과","학번: "+sid,"이름: "+name,"응시시각: "+stamp,""];
 UNITS.forEach((u,ui)=>{lines.push("["+u.unit+" "+u.title+"]");u.codes.forEach((c,ci)=>{total++;let user=norm(document.getElementById(`codeAns_${ui}_${ci}`).value),ok=user===norm(c.answer);if(ok)correct++;lines.push(`코드 서술형 ${ci+1} ${c.title} : ${ok?"정답":"오답"}`,"학생 답안:",user||"(미입력)","정답:",c.answer,"풀이: "+c.explain);});u.ox.forEach((o,j)=>{total++;let val=document.getElementById(`ox_${ui}_${j}`).value,ok=val===o[1];if(ok)correct++;lines.push(`OX-${j+1} : ${ok?"정답":"오답"} / 학생:${val||"미선택"} / 정답:${o[1]} / 풀이:${o[2]}`);});u.mc.forEach((m,j)=>{total++;let chk=document.querySelector(`input[name="mc_${ui}_${j}"]:checked`),val=chk?Number(chk.value):-1,ok=val===m[2];if(ok)correct++;lines.push(`객관식-${j+1} : ${ok?"정답":"오답"} / 학생:${val>=0?val+1:"미선택"} / 정답:${m[2]+1} / 풀이:${m[3]}`);});lines.push("----------------------------------------");});
 let score=Math.round(correct/total*100);lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+total);let blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${sid}_${name}_pandas_${score}점_${stamp}.txt`;a.click();URL.revokeObjectURL(a.href);
}
render();
</script></body></html>
