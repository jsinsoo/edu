</style></head><body><header><h1>📊 데이터 시각화 서술형 평가 100문항</h1><p>line/bar/scatter/histogram/pie/box/count/heatmap/subplot/FacetGrid/pairplot/회귀선/animation 등<br>각 문항은 서로 다른 시각화를 생성하며, 코드 안의 <b>print() 출력 결과</b>를 작성합니다.</p></header>
<div class="wrap"><nav><h3>📌 문항 이동</h3><div id="navBtns"></div></nav><main><div class="notice">그래프 창의 모양이 아니라 코드 안의 <b>print()</b> 출력 결과를 쓰는 서술형 문제입니다. 제목, label, legend 등 시각화 구성 요소가 코드에 포함되어 있습니다.</div><div class="info"><label>학번<br><input id="studentId" placeholder="학번"></label><label>이름<br><input id="studentName" placeholder="이름"></label></div><div class="btns"><button class="action" onclick="gradeAll()">채점하기</button><button class="action secondary" onclick="downloadTxt()">TXT 산출</button><button class="action gray" onclick="showAllSolutions()">상세 풀이 모두 보기</button></div><div id="scoreBox" class="scorebox">아직 채점하지 않았습니다.</div><div id="questions"></div></main></div>
<script>
const QUESTIONS=[{"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 1", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3]\ny=[2,4,6]\nplt.plot(x,y,label='double')\nplt.title('Line Plot')\nplt.xlabel('x')\nplt.ylabel('y')\nplt.legend()\nprint('그래프:', 'line plot')\nprint('마지막y:', y[-1])", "answer": "그래프: line plot\n마지막y: 6", "explain": "line plot을 생성하고 마지막 y값 6을 출력합니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 2", "code": "import matplotlib.pyplot as plt\n\nitems=['A','B','C']\nvalues=[4,7,5]\nplt.bar(items,values,label='sales')\nplt.title('Bar Plot')\nplt.xlabel('item')\nplt.ylabel('value')\nplt.legend()\nprint('그래프:', 'bar plot')\nprint('합계:', sum(values))", "answer": "그래프: bar plot\n합계: 16", "explain": "bar plot을 생성하고 값의 합 16을 출력합니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 3", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3,4]\ny=[3,5,4,8]\nplt.scatter(x,y,label='points')\nplt.title('Scatter Plot')\nplt.xlabel('study')\nplt.ylabel('score')\nplt.legend()\nprint('그래프:', 'scatter plot')\nprint('최댓값:', max(y))", "answer": "그래프: scatter plot\n최댓값: 8", "explain": "scatter plot을 생성하고 y 최댓값 8을 출력합니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 4", "code": "import matplotlib.pyplot as plt\n\ndata=[1,2,2,3,3,3]\nplt.hist(data,bins=3,label='frequency')\nplt.title('Histogram')\nplt.xlabel('value')\nplt.ylabel('count')\nplt.legend()\nprint('그래프:', 'histogram')\nprint('자료수:', len(data))", "answer": "그래프: histogram\n자료수: 6", "explain": "histogram을 생성하고 자료 수 6을 출력합니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 5", "code": "import matplotlib.pyplot as plt\n\nsizes=[20,30,50]\nlabels=['A','B','C']\nplt.pie(sizes,labels=labels)\nplt.title('Pie Chart')\nprint('그래프:', 'pie chart')\nprint('전체:', sum(sizes))", "answer": "그래프: pie chart\n전체: 100", "explain": "pie chart의 전체 합은 100입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 6", "code": "import matplotlib.pyplot as plt\n\ndata=[10,20,30,40,50]\nplt.boxplot(data)\nplt.title('Box Plot')\nplt.ylabel('score')\nprint('그래프:', 'box plot')\nprint('범위:', max(data)-min(data))", "answer": "그래프: box plot\n범위: 40", "explain": "box plot 자료의 범위는 50-10=40입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 7", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'반':['A','A','B','C','C']})\nsns.countplot(data=df,x='반')\nplt.title('Count Plot')\nplt.xlabel('class')\nplt.ylabel('count')\nprint('그래프:', 'count plot')\nprint('A개수:', (df['반']=='A').sum())", "answer": "그래프: count plot\nA개수: 2", "explain": "count plot에서 A반은 2개입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 8", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'국어':[80,90], '수학':[70,100]})\nsns.heatmap(df,annot=True)\nplt.title('Basic Heatmap')\nprint('그래프:', 'heatmap')\nprint('행열:', df.shape)", "answer": "그래프: heatmap\n행열: (2, 2)", "explain": "기초 heatmap 자료는 2행 2열입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 9", "code": "import matplotlib.pyplot as plt\n\nfig,axs=plt.subplots(1,2)\naxs[0].plot([1,2],[2,4],label='left')\naxs[1].bar(['A','B'],[3,5],label='right')\naxs[0].set_title('Line')\naxs[1].set_title('Bar')\nprint('그래프:', 'subplot')\nprint('축개수:', len(fig.axes))", "answer": "그래프: subplot\n축개수: 2", "explain": "subplot을 1행 2열로 만들었으므로 축은 2개입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 10", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3]\ny=[1,4,9]\nplt.plot(x,y,label='square')\nplt.title('Title Label Legend')\nplt.xlabel('number')\nplt.ylabel('square')\nplt.legend()\nprint('제목:', 'Title Label Legend')\nprint('범례:', 'square')", "answer": "제목: Title Label Legend\n범례: square", "explain": "title, xlabel, ylabel, legend를 모두 설정합니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 11", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3]\ny=[2,3,5]\nplt.step(x,y,label='step')\nplt.title('Step Chart')\nplt.legend()\nprint('그래프:', 'step plot')\nprint('끝값:', y[-1])", "answer": "그래프: step plot\n끝값: 5", "explain": "step plot의 마지막 y값은 5입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 12", "code": "import matplotlib.pyplot as plt\n\nx=[1,2,3]\ny=[3,6,9]\nplt.fill_between(x,y,label='area')\nplt.title('Area Chart')\nplt.legend()\nprint('그래프:', 'area chart')\nprint('y합:', sum(y))", "answer": "그래프: area chart\ny합: 18", "explain": "영역 그래프의 y 합은 18입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 13", "code": "import matplotlib.pyplot as plt\n\nlabels=['Kim','Lee','Park']\nscores=[80,95,75]\nplt.barh(labels,scores,label='score')\nplt.title('Horizontal Bar')\nplt.legend()\nprint('그래프:', 'horizontal bar')\nprint('최고점:', max(scores))", "answer": "그래프: horizontal bar\n최고점: 95", "explain": "수평 막대그래프 최고점은 95입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 14", "code": "import seaborn as sns\nimport matplotlib.pyplot as plt\n\nx=[1,2,3]\ny=[2,5,10]\nsns.lineplot(x=x,y=y,label='sns line')\nplt.title('Seaborn Line')\nplt.xlabel('x')\nplt.ylabel('y')\nprint('그래프:', 'seaborn line')\nprint('마지막:', y[-1])", "answer": "그래프: seaborn line\n마지막: 10", "explain": "seaborn lineplot의 마지막 값은 10입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 15", "code": "import seaborn as sns\nimport matplotlib.pyplot as plt\n\nx=[1,2,3]\ny=[9,6,3]\nsns.scatterplot(x=x,y=y,label='sns scatter')\nplt.title('Seaborn Scatter')\nprint('그래프:', 'seaborn scatter')\nprint('최소:', min(y))", "answer": "그래프: seaborn scatter\n최소: 3", "explain": "seaborn scatterplot의 y 최솟값은 3입니다."}, {"cat": "기초", "sub": "데이터 시각화", "title": "기초 데이터 시각화 예제 16", "code": "import seaborn as sns\nimport matplotlib.pyplot as plt\n\ndata=[2,2,4,6,8]\nsns.histplot(data,bins=4,label='sns hist')\nplt.title('Seaborn Hist')\nprint('그래프:', 'seaborn histogram')\nprint('평균:', sum(data)/len(data))", "answer": "그래프: seaborn histogram\n평균: 4.4", "explain": "평균은 22/5=4.4입니다."}, {"cat": "데이터 시각화 OOP", "title": "기초 데이터 시각화 OOP 예제 2", "code": "import matplotlib.pyplot as plt\n\nclass BasicViz2:\n    def draw(self):\n        items=['A','B','C']\n        values=[4,7,5]\n        plt.bar(items,values,label='sales')\n        plt.title('Bar Plot')\n        plt.xlabel('item')\n        plt.ylabel('value')\n        plt.legend()\n        print('그래프:', 'bar plot')\n        print('합계:', sum(values))\n\napp = BasicViz2()\napp.draw()", "answer": "그래프: bar plot\n합계: 16", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. bar plot을 생성하고 값의 합 16을 출력합니다."}, {"cat": "기초", "sub": "데이터 시각화 OOP", "title": "기초 데이터 시각화 OOP 예제 3", "code": "import matplotlib.pyplot as plt\n\nclass BasicViz3:\n    def draw(self):\n        x=[1,2,3,4]\n        y=[3,5,4,8]\n        plt.scatter(x,y,label='points')\n        plt.title('Scatter Plot')\n        plt.xlabel('study')\n        plt.ylabel('score')\n        plt.legend()\n        print('그래프:', 'scatter plot')\n        print('최댓값:', max(y))\n\napp = BasicViz3()\napp.draw()", "answer": "그래프: scatter plot\n최댓값: 8", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. scatter plot을 생성하고 y 최댓값 8을 출력합니다."}, {"cat": "기초", "sub": "데이터 시각화 OOP", "title": "기초 데이터 시각화 OOP 예제 4", "code": "import matplotlib.pyplot as plt\n\nclass BasicViz4:\n    def draw(self):\n        data=[1,2,2,3,3,3]\n        plt.hist(data,bins=3,label='frequency')\n        plt.title('Histogram')\n        plt.xlabel('value')\n        plt.ylabel('count')\n        plt.legend()\n        print('그래프:', 'histogram')\n        print('자료수:', len(data))\n\napp = BasicViz4()\napp.draw()", "answer": "그래프: histogram\n자료수: 6", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. histogram을 생성하고 자료 수 6을 출력합니다."}, {"cat": "기초", "sub": "데이터 시각화 OOP", "title": "기초 데이터 시각화 OOP 예제 5", "code": "import matplotlib.pyplot as plt\n\nclass BasicViz5:\n    def draw(self):\n        sizes=[20,30,50]\n        labels=['A','B','C']\n        plt.pie(sizes,labels=labels)\n        plt.title('Pie Chart')\n (self):\n        df=pd.DataFrame({'월':[1,2,3], '매출':[100,130,160]})\n        df['증가']=df['매출'].diff()\n        plt.bar(df['월'],df['증가'].fillna(0))\n        print('둘째증가:', df.loc[1,'증가'])\n        print('셋째증가:', df.loc[2,'증가'])\n\napp = AppliedViz14()\napp.draw()", "answer": "둘째증가: 30.0\n셋째증가: 30.0", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 전월 대비 증가량 그래프입니다."}, {"cat": "응용", "sub": "데이터 시각화 OOP", "title": "응용 데이터 시각화 OOP 예제 15", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass AppliedViz15:\n    def draw(self):\n        df=pd.DataFrame({'광고비':[10,20,30], '매출':[100,180,260]})\n        sns.regplot(data=df,x='광고비',y='매출')\n        print('광고비합:', df['광고비'].sum())\n        print('매출증가:', df['매출'].iloc[-1]-df['매출'].iloc[0])\n\napp = AppliedViz15()\napp.draw()", "answer": "광고비합: 60\n매출증가: 160", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 광고비와 매출의 회귀선 산점도입니다."}, {"cat": "응용", "sub": "데이터 시각화 OOP", "title": "응용 데이터 시각화 OOP 예제 16", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nclass AppliedViz16:\n    def draw(self):\n        df=pd.DataFrame({'지역':['서울','부산','대구'], '인구':[900,340,240]})\n        plt.pie(df['인구'],labels=df['지역'])\n        print('지역수:', len(df))\n        print('인구합:', df['인구'].sum())\n\napp = AppliedViz16()\napp.draw()", "answer": "지역수: 3\n인구합: 1480", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 지역별 인구 원그래프입니다."}, {"cat": "응용", "sub": "데이터 시각화 OOP", "title": "응용 데이터 시각화 OOP 예제 17", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nclass AppliedViz17:\n    def draw(self):\n        df=pd.DataFrame({'카테고리':['A','B','C'], '값':[5,8,6]})\n        fig,axs=plt.subplots(1,2)\n        axs[0].bar(df['카테고리'],df['값'])\n        axs[1].plot(df['카테고리'],df['값'])\n        print('축개수:', len(fig.axes))\n        print('값합:', df['값'].sum())\n\napp = AppliedViz17()\napp.draw()", "answer": "축개수: 2\n값합: 19", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 막대그래프와 선그래프를 subplot으로 함께 생성합니다."}, {"cat": "응용", "sub": "데이터 시각화 OOP", "title": "응용 데이터 시각화 OOP 예제 18", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass AppliedViz18:\n    def draw(self):\n        df=pd.DataFrame({'성별':['남','여','남','여'], '합격':['Y','Y','N','Y']})\n        t=pd.crosstab(df['성별'],df['합격'])\n        sns.heatmap(t,annot=True)\n        print('남Y:', t.loc['남','Y'])\n        print('여Y:', t.loc['여','Y'])\n\napp = AppliedViz18()\napp.draw()", "answer": "남Y: 1\n여Y: 2", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 교차표 heatmap을 생성합니다."}, {"cat": "응용", "sub": "데이터 시각화 OOP", "title": "응용 데이터 시각화 OOP 예제 19", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nclass AppliedViz19:\n    def draw(self):\n        df=pd.DataFrame({'시간':[1,2,3,4], '속도':[10,20,30,40]})\n        plt.fill_between(df['시간'],df['속도'])\n        print('속도합:', df['속도'].sum())\n        print('최대속도:', df['속도'].max())\n\napp = AppliedViz19()\napp.draw()", "answer": "속도합: 100\n최대속도: 40", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 시간-속도 영역 그래프를 생성합니다."}, {"cat": "응용", "sub": "데이터 시각화 OOP", "title": "응용 데이터 시각화 OOP 예제 20", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass AppliedViz20:\n    def draw(self):\n        df=pd.DataFrame({'연령대':['10대','20대','30대','20대'], '구매':[1,3,2,4]})\n        sns.barplot(data=df,x='연령대',y='구매')\n        print('구매합:', df['구매'].sum())\n        print('연령대수:', df['연령대'].nunique())\n\napp = AppliedViz20()\napp.draw()", "answer": "구매합: 10\n연령대수: 3", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 연령대별 구매 데이터를 시각화합니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 1", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'지역':['서울','서울','부산','부산'], '월':[1,2,1,2], '매출':[10,20,30,40]})\nsns.FacetGrid(df,col='지역').map_dataframe(sns.lineplot,x='월',y='매출')\nprint('그래프:', 'FacetGrid')\nprint('지역수:', df['지역'].nunique())", "answer": "그래프: FacetGrid\n지역수: 2", "explain": "지역별로 나뉜 FacetGrid 선그래프를 생성합니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 2", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'a':[1,2,3], 'b':[2,4,6], 'c':[3,6,9]})\nsns.pairplot(df)\nprint('그래프:', 'pairplot')\nprint('열수:', len(df.columns))", "answer": "그래프: pairplot\n열수: 3", "explain": "세 변수의 pairplot을 생성합니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 3", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'x':[1,2,3,4], 'y':[3,5,7,9]})\nsns.regplot(data=df,x='x',y='y')\nprint('그래프:', 'regplot')\nprint('y증가:', df['y'].iloc[-1]-df['y'].iloc[0])", "answer": "그래프: regplot\ny증가: 6", "explain": "회귀선을 포함한 regplot입니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 4", "code": "import matplotlib.pyplot as plt\n\nfig,ax1=plt.subplots()\nax2=ax1.twinx()\nax1.plot([1,2,3],[10,20,30],label='sales')\nax2.plot([1,2,3],[1,4,9],label='profit')\nprint('그래프:', '다중축')\nprint('축개수:', len(fig.axes))", "answer": "그래프: 다중축\n축개수: 2", "explain": "twinx로 y축이 두 개인 그래프를 만듭니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 5", "code": "import matplotlib.pyplot as plt\nfrom matplotlib.animation import FuncAnimation\n\nfig,ax=plt.subplots()\nline,=ax.plot([],[])\ndef update(frame):\n    line.set_data([0,frame],[0,frame*frame])\n    return line,\nani=FuncAnimation(fig,update,frames=3)\nprint('그래프:', 'animation')\nprint('프레임수:', 3)", "answer": "그래프: animation\n프레임수: 3", "explain": "FuncAnimation 기초 예제입니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 6", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'월':[1,2,3], '매출':[10,20,30], '이익':[2,5,9]})\nfig,axs=plt.subplots(2,2)\naxs[0,0].plot(df['월'],df['매출'])\naxs[0,1].bar(df['월'],df['이익'])\naxs[1,0].scatter(df['매출'],df['이익'])\naxs[1,1].hist(df['매출'])\nprint('그래프:', 'dashboard')\nprint('축개수:', len(fig.axes))", "answer": "그래프: dashboard\n축개수: 4", "explain": "대시보드형 2x2 subplot입니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 7", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'A':[1,2,3,4], 'B':[2,4,6,8], 'C':[4,3,2,1]})\ncorr=df.corr()\nsns.heatmap(corr,annot=True,cmap='coolwarm')\nprint('그래프:', '고급 heatmap')\nprint('AB상관:', round(corr.loc['A','B'],1))", "answer": "그래프: 고급 heatmap\nAB상관: 1.0", "explain": "cmap과 annot을 사용한 고급 heatmap입니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 8", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'값':[10,20,30,40,50]})\ndf['rolling']=df['값'].rolling(3).mean()\nplt.plot(df['rolling'],label='rolling')\nplt.legend()\nprint('그래프:', 'rolling graph')\nprint('마지막평균:', df['rolling'].iloc[-1])", "answer": "그래프: rolling graph\n마지막평균: 40.0", "explain": "3개 단위 rolling 평균 그래프입니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 9", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'날짜':pd.to_datetime(['2026-01-01','2026-01-02','2026-01-03']), '값':[100,120,90]})\nplt.plot(df['날짜'],df['값'],label='time')\nplt.legend()\nprint('그래프:', '시계열')\nprint('최댓값:', df['값'].max())", "answer": "그래프: 시계열\n최댓값: 120", "explain": "날짜 기반 시계열 선그래프입니다."}, {"cat": "심화", "sub": "데이터 시각화", "title": "심화 데이터 시각화 예제 10", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\ndf=pd.DataFrame({'그룹':['A','A','B','B'], 'x':[1,2,1,2], 'y':[3,4,5,6]})\ng=sns.FacetGrid(df,col='그룹')\ng.map_dataframe(sns.scatterplot,x='x',y='y')\nprint('그래프:', 'Facet scatter')\nprint('그룹수:', df['그룹'].nunique())", "answer": "그래프: Facet scatter\n그룹수: 2", "explain": "그룹별 산점도 FacetGrid입니다."}, {"cat": "심화", "sub": "데이터 시각화 OOP", "title": "심화 데이터 시각화 OOP 예제 1", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass AdvancedViz1:\n    def draw(self):\n otlib.pyplot as plt\n\nclass AdvancedViz8:\n    def draw(self):\n        df=pd.DataFrame({'값':[10,20,30,40,50]})\n        df['rolling']=df['값'].rolling(3).mean()\n        plt.plot(df['rolling'],label='rolling')\n        plt.legend()\n        print('그래프:', 'rolling graph')\n        print('마지막평균:', df['rolling'].iloc[-1])\n\napp = AdvancedViz8()\napp.draw()", "answer": "그래프: rolling graph\n마지막평균: 40.0", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 3개 단위 rolling 평균 그래프입니다."}, {"cat": "심화", "sub": "데이터 시각화 OOP", "title": "심화 데이터 시각화 OOP 예제 9", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nclass AdvancedViz9:\n    def draw(self):\n        df=pd.DataFrame({'날짜':pd.to_datetime(['2026-01-01','2026-01-02','2026-01-03']), '값':[100,120,90]})\n        plt.plot(df['날짜'],df['값'],label='time')\n        plt.legend()\n        print('그래프:', '시계열')\n        print('최댓값:', df['값'].max())\n\napp = AdvancedViz9()\napp.draw()", "answer": "그래프: 시계열\n최댓값: 120", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 날짜 기반 시계열 선그래프입니다."}, {"cat": "심화", "sub": "데이터 시각화 OOP", "title": "심화 데이터 시각화 OOP 예제 10", "code": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nclass AdvancedViz10:\n    def draw(self):\n        df=pd.DataFrame({'그룹':['A','A','B','B'], 'x':[1,2,1,2], 'y':[3,4,5,6]})\n        g=sns.FacetGrid(df,col='그룹')\n        g.map_dataframe(sns.scatterplot,x='x',y='y')\n        print('그래프:', 'Facet scatter')\n        print('그룹수:', df['그룹'].nunique())\n\napp = AdvancedViz10()\napp.draw()", "answer": "그래프: Facet scatter\n그룹수: 2", "explain": "클래스의 draw() 메서드 안에서 같은 데이터 시각화 코드를 실행합니다. 그룹별 산점도 FacetGrid입니다."}];
function norm(s){return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function render(){const qbox=document.getElementById("questions"),nav=document.getElementById("navBtns");let out="",navOut="",current="";QUESTIONS.forEach((q,i)=>{const group=q.cat+" - "+q.sub;if(group!==current){current=group;out+=`<h2>${group}</h2>`;navOut+=`<button class="group-btn" onclick="location.hash='q${i+1}'">${group}</button>`;}navOut+=`<button onclick="location.hash='q${i+1}'">${i+1}번</button>`;out+=`<div class="card" id="q${i+1}"><span class="badge">${i+1}번 · ${q.cat} · ${q.sub}</span><h3>${q.title}</h3><p><b>문제.</b> 다음 데이터 시각화 코드의 출력 결과를 쓰시오.</p><pre><code>${esc(q.code)}</code></pre><textarea id="ans${i}" placeholder="출력 결과를 줄 단위로 입력하세요."></textarea><div id="res${i}" class="result"></div></div>`;});qbox.innerHTML=out;nav.innerHTML=navOut;}
function gradeAll(){let correct=0;QUESTIONS.forEach((q,i)=>{const user=norm(document.getElementById("ans"+i).value),answer=norm(q.answer),ok=user===answer;if(ok)correct++;const res=document.getElementById("res"+i);res.style.display="block";res.innerHTML=`<div>${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'}</div><b>정답 출력</b><pre><code>${esc(q.answer)}</code></pre><b>상세 풀이</b><br>${q.explain}`;});const score=Math.round(correct/QUESTIONS.length*100);document.getElementById("scoreBox").innerHTML=`총점: <b>${score}점</b> / 정답: <b>${correct}</b>개 / 전체: <b>${QUESTIONS.length}</b>문항`;}
function showAllSolutions(){QUESTIONS.forEach((q,i)=>{const res=document.getElementById("res"+i);res.style.display="block";res.innerHTML=`<b>정답 출력</b><pre><code>${esc(q.answer)}</code></pre><b>상세 풀이</b><br>${q.explain}`;});}
function downloadTxt(){gradeAll();let sid=document.getElementById("studentId").value.trim()||"학번";let name=document.getElementById("studentName").value.trim()||"이름";let now=new Date();let stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"_"+String(now.getHours()).padStart(2,"0")+"-"+String(now.getMinutes()).padStart(2,"0")+"-"+String(now.getSeconds()).padStart(2,"0");let correct=0,lines=[];lines.push("데이터 시각화 서술형 평가 결과","학번: "+sid,"이름: "+name,"응시시각: "+stamp,"");QUESTIONS.forEach((q,i)=>{const user=norm(document.getElementById("ans"+i).value),answer=norm(q.answer),ok=user===answer;if(ok)correct++;lines.push(`[${i+1}번] ${q.cat} - ${q.sub} - ${q.title} : ${ok?"정답":"오답"}`,"학생 답안:",user||"(미입력)","정답:",q.answer,"상세 풀이: "+q.explain,"----------------------------------------");});let score=Math.round(correct/QUESTIONS.length*100);lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+QUESTIONS.length);const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${sid}_${name}_데이터시각화_${score}점_${stamp}.txt`;a.click();URL.revokeObjectURL(a.href);}
render();
</script></body></html>
