<script>
const QUESTIONS = [{"cat": "pandas", "title": "DataFrame 합계", "code": "import pandas as pd\n\ndf = pd.DataFrame({'이름':['민수','지아'], '점수':[80,90]})\nprint('행수:', len(df))\nprint('점수합:', df['점수'].sum())", "answer": "행수: 2\n점수합: 170", "explain": "DataFrame은 2행이고 점수 80+90=170입니다."}, {"cat": "pandas", "title": "평균 계산", "code": "import pandas as pd\n\ns = pd.Series([10, 20, 30])\nprint('자료수:', s.count())\nprint('평균:', s.mean())", "answer": "자료수: 3\n평균: 20.0", "explain": "Series의 값은 3개이고 평균은 60/3=20.0입니다."}, {"cat": "pandas", "title": "열 추가", "code": "import pandas as pd\n\ndf = pd.DataFrame({'가격':[1000,2000]})\ndf['할인가'] = df['가격'] * 0.9\nprint('열목록:', list(df.columns))\nprint('첫할인가:', df.loc[0,'할인가'])", "answer": "열목록: ['가격', '할인가']\n첫할인가: 900.0", "explain": "새 열 할인가가 추가되고 첫 값은 1000×0.9=900.0입니다."}, {"cat": "pandas", "title": "조건 필터", "code": "import pandas as pd\n\ndf = pd.DataFrame({'이름':['A','B','C'], '점수':[50,70,90]})\npassed = df[df['점수'] >= 60]\nprint('통과수:', len(passed))\nprint('첫통과:', passed.iloc[0]['이름'])", "answer": "통과수: 2\n첫통과: B", "explain": "60점 이상은 B와 C 두 명이고 첫 통과자는 B입니다."}, {"cat": "pandas", "title": "groupby", "code": "import pandas as pd\n\ndf = pd.DataFrame({'반':['1반','1반','2반'], '점수':[80,90,70]})\ng = df.groupby('반')['점수'].mean()\nprint('1반평균:', g['1반'])\nprint('2반평균:', g['2반'])", "answer": "1반평균: 85.0\n2반평균: 70.0", "explain": "1반 평균은 (80+90)/2=85.0, 2반은 70.0입니다."}, {"cat": "pandas", "title": "정렬", "code": "import pandas as pd\n\ndf = pd.DataFrame({'상품':['A','B'], '매출':[300,100]})\nsorted_df = df.sort_values('매출')\nprint('첫상품:', sorted_df.iloc[0]['상품'])\nprint('첫매출:', sorted_df.iloc[0]['매출'])", "answer": "첫상품: B\n첫매출: 100", "explain": "매출 오름차순 정렬 시 B가 먼저 오고 매출은 100입니다."}, {"cat": "pandas", "title": "결측치 처리", "code": "import pandas as pd\n\ndf = pd.DataFrame({'점수':[80,None,100]})\ndf['점수'] = df['점수'].fillna(0)\nprint('결측수:', df['점수'].isna().sum())\nprint('합계:', df['점수'].sum())", "answer": "결측수: 0\n합계: 180.0", "explain": "None을 0으로 채워 결측이 0개가 되고 합계는 180.0입니다."}, {"cat": "pandas", "title": "value_counts", "code": "import pandas as pd\n\ns = pd.Series(['사과','배','사과'])\nc = s.value_counts()\nprint('사과:', c['사과'])\nprint('종류수:', len(c))", "answer": "사과: 2\n종류수: 2", "explain": "사과는 2번, 과일 종류는 사과와 배 2개입니다."}, {"cat": "pandas", "title": "apply", "code": "import pandas as pd\n\ndf = pd.DataFrame({'점수':[55,75]})\ndf['결과'] = df['점수'].apply(lambda x: '합격' if x>=60 else '불합격')\nprint('첫결과:', df.loc[0,'결과'])\nprint('둘째결과:', df.loc[1,'결과'])", "answer": "첫결과: 불합격\n둘째결과: 합격", "explain": "55는 60 미만이라 불합격, 75는 합격입니다."}, {"cat": "pandas", "title": "pivot_table", "code": "import pandas as pd\n\ndf = pd.DataFrame({'지역':['서울','서울','부산'], '매출':[100,200,300]})\np = pd.pivot_table(df, values='매출', index='지역', aggfunc='sum')\nprint('서울:', p.loc['서울','매출'])\nprint('부산:', p.loc['부산','매출'])", "answer": "서울: 300\n부산: 300", "explain": "서울 매출은 100+200=300, 부산은 300입니다."}, {"cat": "pandas OOP", "title": "DataAnalyzer 합계", "code": "import pandas as pd\n\nclass DataAnalyzer:\n    def __init__(self):\n        self.df = pd.DataFrame({'점수':[10,20]})\n    def total(self):\n        return self.df['점수'].sum()\n\na = DataAnalyzer()\nprint('행수:', len(a.df))\nprint('합계:', a.total())", "answer": "행수: 2\n합계: 30", "explain": "객체 내부 DataFrame은 2행이고 점수 합은 30입니다."}, {"cat": "pandas OOP", "title": "StudentTable 평균", "code": "import pandas as pd\n\nclass StudentTable:\n    def __init__(self, scores):\n        self.df = pd.DataFrame({'점수':scores})\n    def mean(self):\n        return self.df['점수'].mean()\n\nt = StudentTable([70,90])\nprint('개수:', len(t.df))\nprint('평균:', t.mean())", "answer": "개수: 2\n평균: 80.0", "explain": "두 점수 평균은 80.0입니다."}, {"cat": "pandas OOP", "title": "SalesFilter", "code": "import pandas as pd\n\nclass SalesFilter:\n    def __init__(self):\n        self.df = pd.DataFrame({'상품':['A','B','C'], '매출':[50,120,200]})\n    def high(self):\n        return self.df[self.df['매출']>=100]\n\nsf = SalesFilter()\nh = sf.high()\nprint('고매출수:', len(h))\nprint('첫상품:', h.iloc[0]['상품'])", "answer": "고매출수: 2\n첫상품: B", "explain": "매출 100 이상은 B, C이고 첫 상품은 B입니다."}, {"cat": "pandas OOP", "title": "MissingHandler", "code": "import pandas as pd\n\nclass MissingHandler:\n    def __init__(self):\n        self.df = pd.DataFrame({'값':[1,None,3]})\n    def clean(self):\n        self.df['값'] = self.df['값'].fillna(0)\n\nmh = MissingHandler()\nmh.clean()\nprint('결측:', mh.df['값'].isna().sum())\nprint('합계:', mh.df['값'].sum())", "answer": "결측: 0\n합계: 4.0", "explain": "None을 0으로 바꾸어 합계는 1+0+3=4.0입니다."}, {"cat": "pandas OOP", "title": "GroupReporter", "code": "import pandas as pd\n\nclass GroupReporter:\n    def __init__(self):\n        self.df = pd.DataFrame({'반':['A','A','B'], '점수':[60,80,100]})\n    def report(self):\n        return self.df.groupby('반')['점수'].mean()\n\ngr = GroupReporter()\nr = gr.report()\nprint('A평균:', r['A'])\nprint('B평균:', r['B'])", "answer": "A평균: 70.0\nB평균: 100.0", "explain": "A 평균은 70.0, B 평균은 100.0입니다."}, {"cat": "pandas OOP", "title": "ColumnMaker", "code": "import pandas as pd\n\nclass ColumnMaker:\n    def __init__(self):\n        self.df = pd.DataFrame({'원가':[100,200]})\n    def make(self):\n        self.df['부가세'] = self.df['원가'] * 0.1\n\ncm = ColumnMaker()\ncm.make()\nprint('열수:', len(cm.df.columns))\nprint('부가세합:', cm.df['부가세'].sum())", "answer": "열수: 2\n부가세합: 30.0", "explain": "원가와 부가세 2개 열이며 부가세 합은 10+20=30.0입니다."}, {"cat": "pandas OOP", "title": "Sorter", "code": "import pandas as pd\n\nclass Sorter:\n    def __init__(self):\n        self.df = pd.DataFrame({'이름':['A','B'], '점수':[90,70]})\n    def low_first(self):\n        return self.df.sort_values('점수')\n\ns = Sorter()\nr = s.low_first()\nprint('첫이름:', r.iloc[0]['이름'])\nprint('첫점수:', r.iloc[0]['점수'])", "answer": "첫이름: B\n첫점수: 70", "explain": "점수 오름차순이므로 B, 70이 첫 행입니다."}, {"cat": "pandas OOP", "title": "Counter", "code": "import pandas as pd\n\nclass Counter:\n    def __init__(self):\n        self.s = pd.Series(['남','여','남'])\n    def count(self):\n        return self.s.value_counts()\n\nc = Counter()\nr = c.count()\nprint('남:', r['남'])\nprint('여:', r['여'])", "answer": "남: 2\n여: 1", "explain": "남은 2개, 여는 1개입니다."}, {"cat": "pandas OOP", "title": "Merger", "code": "import pandas as pd\n\nclass Merger:\n    def run(self):\n        a = pd.DataFrame({'id':[1,2], '이름':['A','B']})\n        b = pd.DataFrame({'id':[1,2], '점수':[80,90]})\n        return pd.merge(a,b,on='id')\n\nm = Merger().run()\nprint('열수:', len(m.columns))\nprint('B점수:', m.loc[1,'점수'])", "answer": "열수: 3\nB점수: 90", "explain": "merge 결과 열은 id, 이름, 점수 3개이고 두 번째 점수는 90입니다."}, {"cat": "pandas OOP", "title": "Ranker", "code": "import pandas as pd\n\nclass Ranker:\n    def __init__(self):\n        self.df = pd.DataFrame({'점수':[100,80]})\n    def add_rank(self):\n        self.df['순위'] = self.df['점수'].rank(ascending=False)\n\nr = Ranker()\nr.add_rank()\nprint('첫순위:', r.df.loc[0,'순위'])\nprint('둘째순위:', r.df.loc[1,'순위'])", "answer": "첫순위: 1.0\n둘째순위: 2.0", "explain": "100점이 1위, 80점이 2위입니다."}, {"cat": "matplotlib", "title": "선그래프 데이터", "code": "import matplotlib.pyplot as plt\n\nx = [1,2,3]\ny = [2,4,6]\nplt.plot(x,y)\nprint('x개수:', len(x))\nprint('마지막y:', y[-1])", "answer": "x개수: 3\n마지막y: 6", "explain": "x는 3개이고 y의 마지막 값은 6입니다."}, {"cat": "matplotlib", "title": "막대그래프 합", "code": "import matplotlib.pyplot as plt\n\nlabels = ['A','B']\nvalues = [5,7]\nplt.bar(labels, values)\nprint('막대수:', len(labels))\nprint('합계:', sum(values))", "answer": "막대수: 2\n합계: 12", "explain": "막대는 2개, 값 합계는 12입니다."}, {"cat": "matplotlib", "title": "산점도", "code": "import matplotlib.pyplot as plt\n\nx = [1,2]\ny = [10,20]\nplt.scatter(x,y)\nprint('점개수:', len(x))\nprint('두번째점:', x[1], y[1])", "answer": "점개수: 2\n두번째점: 2 20", "explain": "두 번째 산점도 좌표는 (2,20)입니다."}, {"cat": "matplotlib", "title": "히스토그램", "code": "import matplotlib.pyplot as plt\n\ndata = [1,1,2,3]\nplt.hist(data)\nprint('자료수:', len(data))\nprint('최댓값:', max(data))", "answer": "자료수: 4\n최댓값: 3", "explain": "자료는 4개이고 최댓값은 3입니다."}, {"cat": "matplotlib", "title": "제목 설정", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1,2],[3,4])\nplt.title('Test')\nprint('제목:', 'Test')\nprint('선개수:', 1)", "answer": "제목: Test\n선개수: 1", "explain": "제목은 Test로 지정했고 선그래프는 1개입니다."}, {"cat": "matplotlib", "title": "원그래프", "code": "import matplotlib.pyplot as plt\n\nsizes = [30,70]\nplt.pie(sizes)\nprint('조각수:', len(sizes))\nprint('전체:', sum(sizes))", "answer": "조각수: 2\n전체: 100", "explain": "원그래프 조각은 2개이고 합은 100입니다."}, {"cat": "matplotlib", "title": "축 이름", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1,2],[1,4])\nplt.xlabel('시간')\nplt.ylabel('거리')\nprint('x축:', '시간')\nprint('y축:', '거리')", "answer": "x축: 시간\ny축: 거리", "explain": "xlabel과 ylabel에 지정한 문자열을 출력합니다."}, {"cat": "matplotlib", "title": "최댓값 표시", "code": "import matplotlib.pyplot as plt\n\ny = [3,9,5]\nplt.plot(y)\nprint('최댓값:', max(y))\nprint('최대위치:', y.index(max(y)))", "answer": "최댓값: 9\n최대위치: 1", "explain": "최댓값 9는 인덱스 1에 있습니다."}, {"cat": "matplotlib", "title": "그리드 설정", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1,2,3])\nplt.grid(True)\nprint('grid:', True)\nprint('자료수:', 3)", "answer": "grid: True\n자료수: 3", "explain": "grid를 True로 설정했고 자료 수는 3입니다."}, {"cat": "matplotlib", "title": "범례", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1,2],[2,3], label='A')\nplt.legend()\nprint('범례:', 'A')\nprint('끝값:', 3)", "answer": "범례: A\n끝값: 3", "explain": "label은 A이고 y 끝값은 3입니다."}, {"cat": "matplotlib OOP", "title": "LinePlotter", "code": "import matplotlib.pyplot as plt\n\nclass LinePlotter:\n    def __init__(self, y):\n        self.y = y\n    def draw(self):\n        plt.plot(self.y)\n\np = LinePlotter([2,4,6])\np.draw()\nprint('개수:', len(p.y))\nprint('합계:', sum(p.y))", "answer": "개수: 3\n합계: 12", "explain": "객체 y 리스트는 3개이고 합은 12입니다."}, {"cat": "matplotlib OOP", "title": "BarPlotter", "code": "import matplotlib.pyplot as plt\n\nclass BarPlotter:\n    def __init__(self):\n        self.labels = ['A','B']\n        self.values = [1,3]\n    def draw(self):\n        plt.bar(self.labels, self.values)\n\nb = BarPlotter()\nb.draw()\nprint('막대:', len(b.labels))\nprint('최댓값:', max(b.values))", "answer": "막대: 2\n최댓값: 3", "explain": "막대는 A,B 2개이고 최댓값은 3입니다."}, {"cat": "matplotlib OOP", "title": "ScatterPlotter", "code": "import matplotlib.pyplot as plt\n\nclass ScatterPlotter:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def draw(self):\n        plt.scatter(self.x, self.y)\n\ns = ScatterPlotter([1,2],[5,6])\ns.draw()\nprint('점수:', len(s.x))\nprint('첫점:', s.x[0], s.y[0])", "answer": "점수: 2\n첫점: 1 5", "explain": "점은 2개이고 첫 점은 (1,5)입니다."}, {"cat": "matplotlib OOP", "title": "HistogramMaker", "code": "import matplotlib.pyplot as plt\n\nclass HistogramMaker:\n    def __init__(self, data):\n        self.data = data\n    def draw(self):\n        plt.hist(self.data)\n\nh = HistogramMaker([1,2,2,3])\nh.draw()\nprint('자료수:', len(h.data))\nprint('최빈값후보:', 2)", "answer": "자료수: 4\n최빈값후보: 2", "explain": "2가 두 번 등장하여 최빈값 후보입니다."}, {"cat": "matplotlib OOP", "title": "ChartTitle", "code": "import matplotlib.pyplot as plt\n\nclass ChartTitle:\n    def __init__(self, title):\n        self.title = title\n    def draw(self):\n        plt.plot([1,2])\n        plt.title(self.title)\n\nc = ChartTitle('Growth')\nc.draw()\nprint('제목:', c.title)\nprint('길이:', len(c.title))", "answer": "제목: Growth\n길이: 6", "explain": "Growth의 글자 수는 6입니다."}, {"cat": "matplotlib OOP", "title": "PieMaker", "code": "import matplotlib.pyplot as plt\n\nclass PieMaker:\n    def __init__(self, sizes):\n        self.sizes = sizes\n    def draw(self):\n        plt.pie(self.sizes)\n\np = PieMaker([40,60])\np.draw()\nprint('조각:', len(p.sizes))\nprint('합:', sum(p.sizes))", "answer": "조각: 2\n합: 100", "explain": "조각 2개이고 합은 100입니다."}, {"cat": "matplotlib OOP", "title": "AxisLabeler", "code": "import matplotlib.pyplot as plt\n\nclass AxisLabeler:\n    def draw(self):\n        plt.plot([1,2],[3,4])\n        plt.xlabel('x')\n        plt.ylabel('y')\n\nal = AxisLabeler()\nal.draw()\nprint('x라벨:', 'x')\nprint('y라벨:', 'y')", "answer": "x라벨: x\ny라벨: y", "explain": "축 이름으로 x와 y를 설정했습니다."}, {"cat": "matplotlib OOP", "title": "MaxPointPlotter", "code": "import matplotlib.pyplot as plt\n\nclass MaxPointPlotter:\n    def __init__(self, y):\n        self.y = y\n    def max_info(self):\n        return max(self.y), self.y.index(max(self.y))\n\nm = MaxPointPlotter([4,8,6])\nprint('최댓값:', m.max_info()[0])\nprint('위치:', m.max_info()[1])", "answer": "최댓값: 8\n위치: 1", "explain": "8은 인덱스 1에 있습니다."}, {"cat": "matplotlib OOP", "title": "GridChart", "code": "import matplotlib.pyplot as plt\n\nclass GridChart:\n    def draw(self):\n        plt.plot([1,3,5])\n        plt.grid(True)\n\ng = GridChart()\ng.draw()\nprint('그리드:', True)\nprint('점개수:', 3)", "answer": "그리드: True\n점개수: 3", "explain": "그리드를 켰고 자료는 3개입니다."}, {"cat": "matplotlib OOP", "title": "LegendChart", "code": "import matplotlib.pyplot as plt\n\nclass LegendChart:\n    def __init__(self):\n        self.label = 'score'\n    def draw(self):\n        plt.plot([1,2], label=self.label)\n        plt.legend()\n\nlc = LegendChart()\nlc.draw()\nprint('범례:', lc.label)\nprint('글자수:', len(lc.label))", "answer": "범례: score\n글자수: 5", "explain": "범례 문자열 score는 길이 5입니다."}, {"cat": "numpy", "title": "배열 합", "code": "import numpy as np\n\na = np.array([1,2,3])\nprint('크기:', a.size)\nprint('합계:', a.sum())", "answer": "크기: 3\n합계: 6", "explain": "배열 원소는 3개이고 합은 6입니다."}, {"cat": "numpy", "title": "평균", "code": "import numpy as np\n\na = np.array([10,20,30])\nprint('평균:', a.mean())\nprint('최대:', a.max())", "answer": "평균: 20.0\n최대: 30", "explain": "평균은 20.0, 최댓값은 30입니다."}, {"cat": "numpy", "title": "reshape", "code": "import numpy as np\n\na = np.arange(6).reshape(2,3)\nprint('모양:', a.shape)\nprint('마지막:', a[1,2])", "answer": "모양: (2, 3)\n마지막: 5", "explain": "0~5를 2행 3열로 바꾸면 마지막은 5입니다."}, {"cat": "numpy", "title": "zeros", "code": "import numpy as np\n\na = np.zeros(4)\nprint('자료:', a.tolist())\nprint('합:', a.sum())", "answer": "자료: [0.0, 0.0, 0.0, 0.0]\n합: 0.0", "explain": "0으로 된 배열 4개이므로 합은 0.0입니다."}, {"cat": "numpy", "title": "ones", "code": "import numpy as np\n\na = np.ones(3)\nprint('개수:', len(a))\nprint('합:', a.sum())", "answer": "개수: 3\n합: 3.0", "explain": "1이 3개이므로 합은 3.0입니다."}, {"cat": "numpy", "title": "브로드캐스팅", "code": "import numpy as np\n\na = np.array([1,2,3]) + 10\nprint('결과:', a.tolist())\nprint('첫값:', a[0])", "answer": "결과: [11, 12, 13]\n첫값: 11", "explain": "각 원소에 10이 더해집니다."}, {"cat": "numpy", "title": "조건 선택", "code": "import numpy as np\n\na = np.array([3,7,9])\nb = a[a>=7]\nprint('선택:', b.tolist())\nprint('개수:', b.size)", "answer": "선택: [7, 9]\n개수: 2", "explain": "7 이상인 값은 7과 9입니다."}, {"cat": "numpy", "title": "linspace", "code": "import numpy as np\n\na = np.linspace(0, 1, 3)\nprint('배열:', a.tolist())\nprint('끝:', a[-1])", "answer": "배열: [0.0, 0.5, 1.0]\n끝: 1.0", "explain": "0부터 1까지 3등분 점은 0.0, 0.5, 1.0입니다."}, {"cat": "numpy", "title": "행렬 곱", "code": "import numpy as np\n\na = np.array([[1,2],[3,4]])\nb = np.array([1,1])\nc = a @ b\nprint('결과:', c.tolist())\nprint('합:', c.sum())", "answer": "결과: [3, 7]\n합: 10", "explain": "행렬곱 결과는 [1+2,3+4]=[3,7]입니다."}, {"cat": "numpy", "title": "표준편차", "code": "import numpy as np\n\na = np.array([2,2,2])\nprint('평균:', a.mean())\nprint('표준편차:', a.std())", "answer": "평균: 2.0\n표준편차: 0.0", "explain": "모든 값이 같으므로 표준편차는 0.0입니다."}, {"cat": "numpy OOP", "title": "ArrayBox", "code": "import numpy as np\n\nclass ArrayBox:\n    def __init__(self):\n        self.a = np.array([2,4])\n    def total(self):\n        return self.a.sum()\n\nbox = ArrayBox()\nprint('배열:', box.a.tolist())\nprint('합:', box.total())", "answer": "배열: [2, 4]\n합: 6", "explain": "객체 배열 [2,4]의 합은 6입니다."}, {"cat": "numpy OOP", "title": "MeanTool", "code": "import numpy as np\n\nclass MeanTool:\n    def __init__(self, data):\n        self.data = np.array(data)\n    def mean(self):\n        return self.data.mean()\n\nm = MeanTool([5,15])\nprin )\nprint('결과:', r.tolist())\nprint('첫값:', r[0])", "answer": "결과: [7, 8]\n첫값: 7", "explain": "단위행렬을 곱하면 원래 벡터 [7,8]입니다."}, {"cat": "numpy OOP", "title": "StdTool", "code": "import numpy as np\n\nclass StdTool:\n    def __init__(self):\n        self.a = np.array([3,3,3])\n    def std(self):\n        return self.a.std()\n\nst = StdTool()\nprint('평균:', st.a.mean())\nprint('표준편차:', st.std())", "answer": "평균: 3.0\n표준편차: 0.0", "explain": "모든 값이 3으로 같아 표준편차는 0.0입니다."}, {"cat": "numpy OOP", "title": "ConcatTool", "code": "import numpy as np\n\nclass ConcatTool:\n    def run(self):\n        return np.concatenate([np.array([1,2]), np.array([3])])\n\nc = ConcatTool().run()\nprint('결과:', c.tolist())\nprint('길이:', len(c))", "answer": "결과: [1, 2, 3]\n길이: 3", "explain": "두 배열을 이어 붙여 [1,2,3]이 됩니다."}, {"cat": "seaborn", "title": "barplot 자료", "code": "import seaborn as sns\nimport pandas as pd\n\ndf = pd.DataFrame({'x':['A','B'], 'y':[3,5]})\nsns.barplot(data=df, x='x', y='y')\nprint('행수:', len(df))\nprint('합계:', df['y'].sum())", "answer": "행수: 2\n합계: 8", "explain": "barplot의 데이터는 2행이고 y 합계는 8입니다."}, {"cat": "seaborn", "title": "scatterplot 자료", "code": "import seaborn as sns\nimport pandas as pd\n\ndf = pd.DataFrame({'공부':[1,2], '점수':[60,80]})\nsns.scatterplot(data=df, x='공부', y='점수')\nprint('점개수:', len(df))\nprint('최고점:', df['점수'].max())", "answer": "점개수: 2\n최고점: 80", "explain": "산점도 자료는 2개이고 최고 점수는 80입니다."}, {"cat": "seaborn", "title": "lineplot", "code": "import seaborn as sns\nimport pandas as pd\n\ndf = pd.DataFrame({'월':[1,2,3], '매출':[10,20,30]})\nsns.lineplot(data=df, x='월', y='매출')\nprint('월수:', df['월'].count())\nprint('마지막매출:', df['매출'].iloc[-1])", "answer": "월수: 3\n마지막매출: 30", "explain": "월 자료는 3개이고 마지막 매출은 30입니다."}, {"cat": "seaborn", "title": "histplot", "code": "import seaborn as sns\nimport pandas as pd\n\ndf = pd.DataFrame({'값':[1,1,2,3]})\nsns.histplot(data=df, x='값')\nprint('자료수:', len(df))\nprint('최솟값:', df['값'].min())", "answer": "자료수: 4\n최솟값: 1", "explain": "자료는 function norm(s){
    return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");
}
function esc(s){
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function render(){
    const qbox=document.getElementById("questions");
    const nav=document.getElementById("navBtns");
    let out="", navOut="", current="";
    QUESTIONS.forEach((q,i)=>{
        if(q.cat!==current){
            current=q.cat;
            out += `<h2>${current}</h2>`;
            navOut += `<button style="background:#0f172a;color:white;margin-top:10px" onclick="location.hash='q${i+1}'">${current}</button>`;
        }
        navOut += `<button onclick="location.hash='q${i+1}'">${i+1}번</button>`;
        out += `
        <div class="card" id="q${i+1}">
            <span class="badge">${i+1}번 · ${q.cat}</span>
            <h3>${q.title}</h3>
            <p><b>문제.</b> 다음 파이썬 코드의 출력 결과 2줄을 쓰시오.</p>
            <pre><code>${esc(q.code)}</code></pre>
            <textarea id="ans${i}" placeholder="출력 결과 2줄을 그대로 입력하세요."></textarea>
            <div id="res${i}" class="result"></div>
        </div>`;
    });
    qbox.innerHTML=out;
    nav.innerHTML=navOut;
}
function gradeAll(){
    let correct=0;
    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <div>${ok ? '<span class="correct">정답</span>' : '<span class="wrong">오답</span>'}</div>
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
    const score=Math.round(correct/QUESTIONS.length*100);
    document.getElementById("scoreBox").innerHTML =
        `총점: <b>${score}점</b> / 정답: <b>${correct}</b>개 / 전체: <b>${QUESTIONS.length}</b>문항`;
}
function showAllSolutions(){
    QUESTIONS.forEach((q,i)=>{
        const res=document.getElementById("res"+i);
        res.style.display="block";
        res.innerHTML = `
        <b>정답 출력</b>
        <pre><code>${esc(q.answer)}</code></pre>
        <b>상세 풀이</b><br>${q.explain}
        `;
    });
}
function downloadTxt(){
    gradeAll();
    let sid=document.getElementById("studentId").value.trim() || "학번";
    let name=document.getElementById("studentName").value.trim() || "이름";
    let now=new Date();
    let stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"_"+String(now.getHours()).padStart(2,"0")+"-"+String(now.getMinutes()).padStart(2,"0")+"-"+String(now.getSeconds()).padStart(2,"0");

    let correct=0;
    let lines=[];
    lines.push("데이터 과학 라이브러리 서술형 평가 결과");
    lines.push("학번: "+sid);
    lines.push("이름: "+name);
    lines.push("응시시각: "+stamp);
    lines.push("");

    QUESTIONS.forEach((q,i)=>{
        const user=norm(document.getElementById("ans"+i).value);
        const answer=norm(q.answer);
        const ok=user===answer;
        if(ok) correct++;
        lines.push(`[${i+1}번] ${q.cat} - ${q.title} : ${ok ? "정답" : "오답"}`);
        lines.push("학생 답안:");
        lines.push(user || "(미입력)");
        lines.push("정답:");
        lines.push(q.answer);
        lines.push("상세 풀이: "+q.explain);
        lines.push("----------------------------------------");
    });
    let score=Math.round(correct/QUESTIONS.length*100);
    lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+QUESTIONS.length);

    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${sid}_${name}_조건반복문_${score}점_${stamp}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
}
render();
