<script>
const UNITS=[{"unit": "4-1", "title": "인공지능과 에이전트", "code_label": "인공지능 기초 파이썬 코드 서술형 문제", "concept": "인공지능은 인간의 지적 능력인 인식, 추론, 학습, 문제 해결을 컴퓨터가 수행하도록 만드는 기술이다. 지능 에이전트는 센서를 통해 환경을 인식하고, 인공지능 알고리즘으로 판단한 뒤, 구동기나 출력 장치를 통해 행동한다. 스마트 스피커, 챗봇, 자율주행 자동차, 의료 진단 보조 시스템, 스마트 냉장고, 탐사 로봇 등이 지능 에이전트의 예이다. 지능 에이전트의 핵심 구조는 인식, 판단, 행동이며 인간과 상호 작용하고 자율적으로 의사 결정을 내릴 수 있다.", "codes": [{"title": "스마트 스피커 에이전트", "code": "sensor=\"음성 명령\"\ndecision=\"음악 추천\"\naction=\"스피커로 재생\"\nprint(\"인식:\",sensor)\nprint(\"판단:\",decision)\nprint(\"행동:\",action)", "answer": "인식: 음성 명령\n판단: 음악 추천\n행동: 스피커로 재생", "explain": "인식, 판단, 행동 구조를 가진 지능 에이전트 예시이다."}, {"title": "챗봇 응답 판단", "code": "message=\"급식 알려줘\"\nintent=\"급식 요청\" if \"급식\" in message else \"일반 질문\"\nanswer=\"오늘 급식 정보를 보여줍니다.\" if intent==\"급식 요청\" else \"다시 질문해 주세요.\"\nprint(\"입력:\",message)\nprint(\"의도:\",intent)\nprint(\"응답:\",answer)", "answer": "입력: 급식 알려줘\n의도: 급식 요청\n응답: 오늘 급식 정보를 보여줍니다.", "explain": "챗봇은 사용자의 문장을 인식하고 의도를 판단한다."}, {"title": "자율주행 위험 판단", "code": "distance=3\nspeed=40\nrisk=\"위험\" if distance<5 else \"안전\"\naction=\"감속\" if risk==\"위험\" else \"주행 유지\"\nprint(\"거리:\",distance)\nprint(\"위험 판단:\",risk)\nprint(\"행동:\",action)", "answer": "거리: 3\n위험 판단: 위험\n행동: 감속", "explain": "자율주행 에이전트는 센서 거리로 위험을 판단하고 행동한다."}, {"title": "의료 보조 판단", "code": "temperature=38.5\ncough=True\nresult=\"진료 권장\" if temperature>=38 and cough else \"경과 관찰\"\nprint(\"체온:\",temperature)\nprint(\"기침:\",cough)\nprint(\"판단:\",result)", "answer": "체온: 38.5\n기침: True\n판단: 진료 권장", "explain": "의료 AI는 증상 정보를 분석해 의사 결정을 보조한다."}, {"title": "스마트 냉장고 추천", "code": "ingredients=[\"계란\",\"우유\",\"치즈\"]\nmenu=\"오믈렛\" if \"계란\" in ingredients and \"치즈\" in ingredients else \"샐러드\"\nprint(\"재료:\",ingredients)\nprint(\"추천 메뉴:\",menu)\nprint(\"에이전트 역할:\",\"추천\")", "answer": "재료: ['계란', '우유', '치즈']\n추천 메뉴: 오믈렛\n에이전트 역할: 추천", "explain": "스마트 냉장고는 환경 정보를 인식하고 메뉴를 추천한다."}, {"title": "학습 튜터 피드백", "code": "answer=\"사과\"\ncorrect=\"사과\"\nfeedback=\"정답\" if answer==correct else \"다시 학습\"\nprint(\"학생 답:\",answer)\nprint(\"정답:\",correct)\nprint(\"피드백:\",feedback)", "answer": "학생 답: 사과\n정답: 사과\n피드백: 정답", "explain": "인공지능 튜터는 학습자의 답을 판단하고 피드백을 제공한다."}, {"title": "로봇 청소기 에이전트", "code": "dust=80\nbattery=60\naction=\"청소 시작\" if dust>=50 and battery>=30 else \"충전 대기\"\nprint(\"먼지:\",dust)\nprint(\"배터리:\",battery)\nprint(\"행동:\",action)", "answer": "먼지: 80\n배터리: 60\n행동: 청소 시작", "explain": "로봇 청소기는 먼지와 배터리 상태를 바탕으로 행동을 결정한다."}, {"title": "탐사 로봇 판단", "code": "rock=True\nbattery=70\ntask=\"암석 촬영\" if rock and battery>50 else \"기지 복귀\"\nprint(\"암석 감지:\",rock)\nprint(\"배터리:\",battery)\nprint(\"수행 작업:\",task)", "answer": "암석 감지: True\n배터리: 70\n수행 작업: 암석 촬영", "explain": "탐사 로봇은 감지 정보와 배터리 상태로 작업을 선택한다."}, {"title": "감정 분석 기초", "code": "sentence=\"정말 좋아요\"\nresult=\"긍정\" if \"좋아\" in sentence else \"부정 또는 중립\"\nprint(\"문장:\",sentence)\nprint(\"분석 결과:\",result)\nprint(\"활용:\",\"리뷰 분석\")", "answer": "문장: 정말 좋아요\n분석 결과: 긍정\n활용: 리뷰 분석", "explain": "문장 속 단어를 이용해 감정을 간단히 판단한다."}, {"title": "인간과 AI 역할", "code": "task=\"윤리적 판단\"\nrole=\"인간의 역할 중요\" if task in [\"윤리적 판단\",\"공감\",\"창의적 결정\"] else \"AI가 보조 가능\"\nprint(\"과제:\",task)\nprint(\"판단:\",role)\nprint(\"이유:\",\"책임과 가치 판단 필요\")", "answer": "과제: 윤리적 판단\n판단: 인간의 역할 중요\n이유: 책임과 가치 판단 필요", "explain": "인공지능 시대에도 윤리와 책임은 인간의 역할이 중요하다."}], "ox": [["인공지능은 인식, 추론, 학습, 문제 해결과 관련된 기술이다.", "O", "인공지능은 인간의 지적 능력을 컴퓨터로 구현하려는 기술이다."], ["지능 에이전트는 환경을 인식하지 않아도 된다.", "X", "지능 에이전트는 센서를 통해 환경을 인식한다."], ["스마트 스피커는 지능 에이전트의 예가 될 수 있다.", "O", "음성 인식, 판단, 재생 행동을 수행할 수 있다."], ["구동기는 에이전트의 행동을 실제 환경에 전달하는 역할을 한다.", "O", "스피커, 바퀴, LED 등이 구동기 역할을 할 수 있다."], ["인공지능은 인간의 윤리적 책임을 완전히 대신할 수 있다.", "X", "윤리적 책임과 가치 판단은 인간의 역할이 중요하다."], ["챗봇은 사용자의 입력 문장을 처리할 수 있다.", "O", "챗봇은 자연어 입력을 분석하고 응답한다."], ["자율주행 자동차는 센서 정보를 활용한다.", "O", "거리, 차선, 신호 등 센서 정보를 활용한다."], ["의료 인공지능은 항상 의사를 완전히 대체한다.", "X", "의료 AI는 보조 도구로 활용되는 것이 적절하다."], ["에이전트의 핵심 구조는 인식, 판단, 행동이다.", "O", "지능 에이전트의 기본 구조이다."], ["인공지능은 반복적 데이터 분석을 도울 수 없다.", "X", "인공지능은 대량 데이터 분석에 강점을 가진다."]], "mc": [["지능 에이전트의 기본 구조는?", ["인식-판단-행동", "삭제-복사-붙여넣기", "색칠-저장-인쇄", "압축-전송-삭제", "입력-무시-종료"], 0, "에이전트는 인식, 판단, 행동 구조를 가진다."], ["다음 중 지능 에이전트의 예는?", ["자율주행 자동차", "빈 공책", "종이컵", "꺼진 계산기", "나무 막대"], 0, "자율주행 자동차는 센서와 판단, 행동을 수행한다."], ["센서의 역할은?", ["환경 정보 감지", "파일 삭제", "종이 접기", "전원 차단", "색상 변경"], 0, "센서는 외부 정보를 감지한다."], ["구동기의 예로 알맞은 것은?", ["스피커", "지우개", "공책", "연필심", "종이"], 0, "스피커는 행동 결과를 출력할 수 있다."], ["챗봇이 가장 직접적으로 처리하는 데이터는?", ["사용자 문장", "벽의 색", "책상 높이", "의자 무게", "창문 크기"], 0, "챗봇은 사용자의 문장 입력을 처리한다."], ["의료 AI의 바람직한 역할은?", ["진단 보조", "무조건 의사 대체", "환자 정보 삭제", "의학 지식 무시", "검사 거부"], 0, "의료 AI는 의료진의 판단을 보조한다."], ["인공지능 시대 인간의 역할로 알맞은 것은?", ["윤리적 판단과 책임", "모든 판단 포기", "데이터 왜곡", "학습 중단", "기술 무조건 거부"], 0, "윤리와 책임은 인간의 중요한 역할이다."], ["스마트 냉장고가 할 수 있는 일로 적절한 것은?", ["재료 인식과 메뉴 추천", "종이 인쇄", "운동 기록 삭제", "책상 조립", "전기 생산"], 0, "스마트 냉장고는 재료 기반 추천을 할 수 있다."], ["자율주행 자동차가 위험 상황에서 할 수 있는 행동은?", ["감속", "파일 압축", "문서 편집", "음악 작곡만 수행", "화면 잠금"], 0, "위험을 감지하면 감속할 수 있다."], ["인공지능 기초 코드에서 조건문을 사용하는 이유는?", ["상황에 따라 판단하기 위해", "글자 색만 바꾸기 위해", "파일 크기 줄이기 위해", "컴퓨터 끄기 위해", "마우스 속도 조절을 위해"], 0, "조건문은 상황 판단을 표현한다."]]}, {"unit": "4-2", "title": "기계학습의 이해", "code_label": "인공지능 응용 OOP 파이썬 코드 서술형 문제", "concept": "기계학습은 데이터를 이용하여 규칙을 학습하고, 학습된 모델을 통해 새로운 데이터에 대해 예측하거나 판단하는 인공지능 기술이다. 정답 데이터가 있는 경우 지도학습, 정답 없이 데이터의 유사성이나 구조를 찾는 경우 비지도학습이라고 한다. 지도학습에는 수치 값을 예측하는 회귀와 범주를 판단하는 분류가 있다. 비지도학습의 대표적인 예는 군집이다. OOP 방식으로 기계학습 개념을 표현하면 데이터, 모델, 예측 기능을 하나의 객체로 묶어 관리할 수 있다.", "codes": [{"title": "지도학습 판별 OOP", "code": "class LearningType:\n    def __init__(self, has_label):\n        self.has_label=has_label\n    def check(self):\n        result=\"지도학습\" if self.has_label else \"비지도학습\"\n        print(\"정답 데이터:\",self.has_label)\n        print(\"학습 유형:\",result)\n        print(\"대표 작업:\",\"분류와 회귀\")\n\nmodel=LearningType(True)\nmodel.check()", "answer": "정답 데이터: True\n학습 유형: 지도학습\n대표 작업: 분류와 회귀", "explain": "정답 레이블이 있으면 지도학습이다."}, {"title": "비지도학습 군집 OOP", "code": "class ClusterAgent:\n    def __init__(self, views, likes):\n        self.views=views\n        self.likes=likes\n    def predict_group(self):\n        group=\"활동 많은 사용자\" if self.views>=80 and self.likes>=80 else \"일반 사용자\"\n        print(\"조회 수:\",self.views)\n        print(\"좋아요:\",self.likes)\n        print(\"군집:\",group)\n\nagent=ClusterAgent(90,85)\nagent.predict_group()", "answer": "조회 수: 90\n좋아요: 85\n군집: 활동 많은 사용자", "explain": "정답 없이 유사 특성으로 사용자를 묶는 군집 예시이다."}, {"title": "회귀 모델 OOP", "code": "class RegressionModel:\n    def __init__(self, x):\n        self.x=x\n    def predict(self):\n        y=2*self.x+1\n        print(\"입력값:\",self.x)\n        print(\"모델식:\",\"y=2x+1\")\n        print(\"예측값:\",y)\n\nmodel=RegressionModel(5)\nmodel.predict()", "answer": "입력값: 5\n모델식: y=2x+1\n예측값: 11", "explain": "회귀는 연속적인 수치 값을 예측한다."}, {"title": "분류 모델 OOP", "code": "class Classifier:\n    def __init__(self, score):\n        self.score=score\n    def classify(self):\n        label=\"합격\" if self.score>=60 else \"불합격\"\n        print(\"점수:\",self.score)\n        print(\"기준:\",\"60점 이상\")\n        print(\"분류:\",label)\n\nmodel=Classifier(75)\nmodel.classify()", "answer": "점수: 75\n기준: 60점 이상\n분류: 합격", "explain": "분류는 정해진 범주 중 하나를 판단한다."}, {"title": "훈련 테스트 분할 OOP", "code": "class DataSplitter:\n    def __init__(self, total):\n        self.total=total\n    def split(self):\n        train=int(self.total*0.7)\n        test=self.total-train\n        print(\"전체 데이터:\",self.total)\n        print(\"훈련 데이터:\",train)\n        print(\"테스트 데이터:\",test)\n\nsplitter=DataSplitter(100)\nsplitter.split()", "answer": "전체 데이터: 100\n훈련 데이터: 70\n테스트 데이터: 30", "explain": "훈련 데이터와 테스트 데이터를 나누어 학습과 평가에 사용한다."}, {"title": "레이블 관리 OOP", "code": "class Sample:\n    def __init__(self, hour, score):\n        self.hour=hour\n        self.score=score\n    def show(self):\n        print(\"입력 속성:\",self.hour)\n        print(\"정답 레이블:\",self.score)\n        print(\"학습 형태:\",\"지도학습\")\n\nsample=Sample(5,90)\nsample.show()", "answer": "입력 속성: 5\n정답 레이블: 90\n학습 형태: 지도학습", "explain": "레이블은 지도학습의 정답 역할을 한다."}, {"title": "간단 추천 모델 OOP", "code": "class Recommender:\n    def __init__(self, interest):\n        self.interest=interest\n    def recommend(self):\n        item=\"AI 책\" if self.interest==\"인공지능\" else \"일반 책\"\n        print(\"관심 분야:\",self.interest)\n        print(\"추천 항목:\",item)\n        print(\"모델 역할:\",\"개인화 추천\")\n\nr=Recommender(\"인공지능\")\nr.recommend()", "answer": "관심 분야: 인공지능\n추천 항목: AI 책\n모델 역할: 개인화 추천", "explain": "모델은 사용자의 특성에 맞는 결과를 추천할 수 있다."}, {"title": "특징과 레이블 OOP", "code": "class FeatureLabel:\n    def __init__(self):\n        self.features=[\"공부시간\",\"출석률\"]\n        self.label=\"성적\"\n    def show(self):\n        print(\"특징:\",self.features)\n        print(\"레이블:\",self.label)\n        print(\"목표:\",\"성적 예측\")\n\nfl=FeatureLabel()\nfl.show()", "answer": "특징: ['공부시간', '출석률']\n레이블: 성적\n목표: 성적 예측", "explain": "특징은 입력, 레이블은 예측 목표이다."}, {"title": "모델 평가 기초 OOP", "code": "class AccuracyCheck:\n    def __init__(self, correct, total):\n        self.correct=correct\n        self.total=total\n    def score(self):\n        acc=self.correct/self.total\n        print(\"정답 수:\",self.correct)\n        print(\"전체 수:\",self.total)\n        print(\"정확도:\",acc)\n\ncheck=AccuracyCheck(18,20)\ncheck.score()", "answer": "정답 수: 18\n전체 수: 20\n정확도: 0.9", "explain": "정확도는 맞힌 비율로 계산한다."}, {"title": "학습 모델 객체 OOP", "code": "class MLModel:\n    def __init__(self, name):\n        self.name=name\n        self.trained=False\n    def train(self):\n        self.trained=True\n        print(\"모델 이름:\",self.name)\n        print(\"학습 상태:\",self.trained)\n        print(\"역할:\",\"새 데이터 예측\")\n\nmodel=MLModel(\"기초 분류 모델\")\nmodel.train()", "answer": "모델 이름: 기초 분류 모델\n학습 상태: True\n역할: 새 데이터 예측", "explain": "모델 객체는 학습 상태와 예측 기능을 관리할 수 있다."}], "ox": [["기계학습은 데이터로부터 규칙을 학습한다.", "O", "데이터 기반 학습이 핵심이다."], ["지도학습에는 정답 레이블이 필요하다.", "O", "지도학습은 정답 데이터가 있는 학습이다."], ["비지도학습은 정답 없이 데이터의 구조를 찾는다.", "O", "군집이 대표적이다."], ["회귀는 범주만 예측한다.", "X", "회귀는 수치 값을 예측한다."], ["분류는 정해진 범주 중 하나를 판단한다.", "O", "합격/불합격 등이 분류이다."], ["군집은 비지도학습의 대표적인 작업이다.", "O", "유사한 데이터를 묶는다."], ["OOP는 데이터와 기능을 하나의 객체로 묶을 수 있다.", "O", "클래스는 속성과 메서드를 함께 다룬다."], ["테스트 데이터는 모델 평가에 사용할 수 없다.", "X", "테스트 데이터는 성능 평가에 사용된다."], ["레이블은 지도학습의 정답 역할을 할 수 있다.", "O", "레이블은 목표값이다."], ["모델은 학습 후 새 데이터를 예측할 수 있다.", "O", "모델의 핵심 역할이다."]], "mc": [["정답 레이블이 있는 학습은?", ["지도학습", "비지도학습", "군집", "압축", "삭제"], 0, "지도학습이다."], ["정답 없이 비슷한 데이터를 묶는 것은?", ["군집", "회귀", "분류", "저장", "출력"], 0, "군집이다."], ["수치 값을 예측하는 것은?", ["회귀", "분류", "군집", "복사", "삭제"], 0, "회귀이다."], ["합격/불합격을 판단하는 것은?", ["분류", "회귀", "정규화", "압축", "출력"], 0, "범주 판단은 분류이다."], ["기계학습 모델의 역할은?", ["새 데이터 예측", "파일 삭제", "모니터 청소", "키보드 잠금", "색상 변경"], 0, "모델은 예측이나 판단을 수행한다."], ["OOP에서 객체의 기능을 나타내는 것은?", ["메서드", "배경색", "파일명", "해상도", "전원"], 0, "메서드는 객체의 동작이다."], ["OOP에서 객체의 데이터를 나타내는 것은?", ["속성", "프린터", "마우스", "폴더 아이콘", "전원 버튼"], 0, "속성은 객체가 가진 데이터이다."], ["훈련 데이터의 역할은?", ["모델 학습", "컴퓨터 종료", "창 닫기", "문자 삭제", "화면 잠금"], 0, "훈련 데이터는 학습에 사용된다."], ["테스트 데이터의 역할은?", ["모델 평가", "색칠하기", "파일 숨기기", "소리 끄기", "종이 접기"], 0, "테스트 데이터는 평가에 사용된다."], ["레이블의 의미는?", ["정답 데이터", "마우스 위치", "배경 그림", "파일 크기", "전원 상태"], 0, "레이블은 정답이다."]]}, {"unit": "4-3", "title": "기계학습을 이용한 문제 해결", "code_label": "인공지능 심화 OOP 파이썬 코드 서술형 문제", "concept": "기계학습 문제 해결은 문제 정의, 데이터 수집과 탐색, 전처리, 모델 선택, 학습, 예측, 평가와 개선의 단계로 진행된다. 실생활 문제를 해결하려면 현재 상태와 목표 상태를 명확히 정의하고, 독립 변수와 종속 변수를 구분해야 한다. 회귀 문제는 R2 score, 분류 문제는 정확도 등의 지표로 평가할 수 있다. 심화 OOP 코드는 데이터 전처리기, 모델, 평가기를 별도 객체로 구성하여 문제 해결 과정을 구조화한다.", "codes": [{"title": "문제 정의 클래스", "code": "class ProblemDefinition:\n    def __init__(self, current, goal, task):\n        self.current=current\n        self.goal=goal\n        self.task=task\n    def show(self):\n        print(\"현재 상태:\",self.current)\n        print(\"목표 상태:\",self.goal)\n        print(\"문제 유형:\",self.task)\n\np=ProblemDefinition(\"CO2 배출량을 모름\",\"CO2 배출량 예측\",\"회귀\")\np.show()", "answer": "현재 상태: CO2 배출량을 모름\n목표 상태: CO2 배출량 예측\n문제 유형: 회귀", "explain": "문제 해결의 첫 단계는 현재 상태와 목표 상태를 정의하는 것이다."}, {"title": "특징 선택 클래스", "code": "class FeatureSelector:\n    def __init__(self, columns):\n        self.columns=columns\n    def select(self):\n        X=self.columns[:2]\n        y=self.columns[2]\n        print(\"독립 변수:\",X)\n        print(\"종속 변수:\",y)\n        print(\"목표:\",\"예측 모델 구성\")\n\nfs=FeatureSelector([\"Engine Size\",\"Fuel Consumption\",\"CO2 Emissions\"])\nfs.select()", "answer": "독립 변수: ['Engine Size', 'Fuel Consumption']\n종속 변수: CO2 Emissions\n목표: 예측 모델 구성", "explain": "입력 변수 X와 목표 변수 y를 구분한다."}, {"title": "데이터 분할 클래스", "code": "class TrainTestSplitter:\n    def __init__(self,total,ratio):\n        self.total=total\n        self.ratio=ratio\n    def split(self):\n        train=int(self.total*self.ratio)\n        test=self.total-train\n        print(\"전체:\",self.total)\n        print(\"훈련:\",train)\n        print(\"테스트:\",test)\n\nsplitter=TrainTestSplitter(1000,0.7)\nsplitter.split()", "answer": "전체: 1000\n훈련: 700\n테스트: 300", "explain": "데이터를 훈련용과 테스트용으로 나눈다."}, {"title": "CO2 회귀 모델 클래스", "code": "class CO2Model:\n    def __init__(self, engine, fuel):\n        self.engine=engine\n        self.fuel=fuel\n    def predict(self):\n        co2=round(self.engine*30+self.fuel*15)\n        print(\"엔진 크기:\",self.engine)\n        print(\"연료 소비량:\",self.fuel)\n        print(\"예측 CO2:\",co2)\n\nmodel=CO2Model(3.0,7.5)\nmodel.predict()", "answer": "엔진 크기: 3.0\n연료 소비량: 7.5\n예측 CO2: 202", "explain": "독립 변수를 이용해 CO2 수치를 예측하는 회귀 모델이다."}, {"title": "R2 평가 클래스", "code": "class R2Evaluator:\n    def __init__(self,score):\n        self.score=score\n    def evaluate(self):\n        level=\"우수\" if self.score>=0.9 else \"개선 필요\"\n        print(\"R2 score:\",self.score)\n        print(\"평가:\",level)\n        print(\"의미:\",\"1에 가까울수록 좋음\")\n\ne=R2Evaluator(0.92)\ne.evaluate()", "answer": "R2 score: 0.92\n평가: 우수\n의미: 1에 가까울수록 좋음", "explain": "R2 score는 회귀 성능 평가 지표이다."}, {"title": "학업 성취 분류 클래스", "code": "class StudentClassifier:\n    def __init__(self, raisedhands, visited):\n        self.raisedhands=raisedhands\n        self.visited=visited\n    def classify(self):\n        grade=\"상위\" if self.raisedhands+self.visited>=60 else \"하위\"\n        print(\"손든 횟수:\",self.raisedhands)\n        print(\"자료 조회:\",self.visited)\n        print(\"예측 등급:\",grade)\n\nsc=StudentClassifier(30,40)\nsc.classify()", "answer": "손든 횟수: 30\n자료 조회: 40\n예측 등급: 상위", "explain": "학습 참여 데이터를 이용해 성취 등급을 분류한다."}, {"title": "결측치 검사 클래스", "code": "class MissingChecker:\n    def __init__(self, missing):\n        self.missing=missing\n    def check(self):\n        total=sum(self.missing.values())\n        print(\"속성별 결측:\",self.missing)\n        print(\"전체 결측:\",total)\n        print(\"판단:\",\"결측 없음\" if total==0 else \"결측 처리 필요\")\n\nmc=MissingChecker({\"raisedhands\":0,\"visitedResources\":0,\"Class\":0})\nmc.check()", "answer": "속성별 결측: {'raisedhands': 0, 'visitedResources': 0, 'Class': 0}\n전체 결측: 0\n판단: 결측 없음", "explain": "데이터 전처리 단계에서 결측치를 확인한다."}, {"title": "정규화 클래스", "code": "class MinMaxScaler:\n    def __init__(self,value,min_value,max_value):\n        self.value=value\n        self.min_value=min_value\n        self.max_value=max_value\n    def transform(self):\n        scaled=(self.value-self.min_value)/(self.max_value-self.min_value)\n        print(\"원래 값:\",self.value)\n        print(\"정규화 값:\",scaled)\n        print(\"범위:\",\"0~1\")\n\nscaler=MinMaxScaler(40,0,100)\nscaler.transform()", "answer": "원래 값: 40\n정규화 값: 0.4\n범위: 0~1", "explain": "정규화는 값의 범위를 일정하게 맞춘다."}, {"title": "정확도 평가 클래스", "code": "class AccuracyEvaluator:\n    def __init__(self,correct,total):\n        self.correct=correct\n        self.total=total\n    def evaluate(self):\n        accuracy=self.correct/self.total\n        print(\"정답 수:\",self.correct)\n        print(\"전체 수:\",self.total)\n        print(\"정확도:\",accuracy)\n\ne=AccuracyEvaluator(27,30)\ne.evaluate()", "answer": "정답 수: 27\n전체 수: 30\n정확도: 0.9", "explain": "정확도는 전체 중 맞힌 비율이다."}, {"title": "전체 파이프라인 클래스", "code": " function norm(s){return (s||"").replace(/\r/g,"").trim().split("\n").map(x=>x.trim()).join("\n");}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function render(){
 let out="",nav="";
 UNITS.forEach((u,ui)=>{
  nav+=`<button class="group-btn" onclick="location.hash='unit${ui}'">${u.unit} ${u.title}</button><button onclick="location.hash='concept${ui}'">개념 설명</button>`;
  out+=`<section id="unit${ui}"><h2>${u.unit} ${u.title}</h2></section><div class="card" id="concept${ui}"><span class="badge">${u.unit}</span><h3>개념 설명</h3><div class="concept">${esc(u.concept)}</div></div>`;
  out+=`<h2>${u.code_label}</h2>`;
  u.codes.forEach((c,ci)=>{let id=`code_${ui}_${ci}`;nav+=`<button onclick="location.hash='${id}'">코드 ${ci+1}. ${c.title}</button>`;out+=`<div class="card" id="${id}"><span class="badge">${u.unit} · 코드 ${ci+1}</span><h3>${c.title}</h3><p><b>서술형.</b> 다음 파이썬 코드의 출력 결과를 쓰시오.</p><pre><code>${esc(c.code)}</code></pre><textarea id="codeAns_${ui}_${ci}" placeholder="출력 결과를 줄 단위로 입력하세요."></textarea><div id="codeRes_${ui}_${ci}" class="result"></div></div>`;});
  nav+=`<button onclick="location.hash='ox${ui}'">OX 10문항</button>`;out+=`<div class="card" id="ox${ui}"><span class="badge">${u.unit}</span><h3>OX 10문항</h3><div class="quizbox">${renderOX(ui,u)}</div></div>`;
  nav+=`<button onclick="location.hash='mc${ui}'">5지선다형 10문항</button>`;out+=`<div class="card" id="mc${ui}"><span class="badge">${u.unit}</span><h3>5지선다형 10문항</h3><div class="quizbox">${renderMC(ui,u)}</div></div>`;
 });
 document.getElementById("navBtns").innerHTML=nav;document.getElementById("questions").innerHTML=out;
}
function renderOX(ui,u){return u.ox.map((o,j)=>`<div class="quizitem"><b>OX-${j+1}.</b> ${esc(o[0])}<br><select id="ox_${ui}_${j}"><option value="">선택</option><option value="O">O</option><option value="X">X</option></select><div id="oxRes_${ui}_${j}" class="result"></div></div>`).join("");}
function renderMC(ui,u){return u.mc.map((m,j)=>`<div class="quizitem"><b>객관식-${j+1}.</b> ${esc(m[0])}<br>${m[1].map((c,k)=>`<label class="choice-label"><input type="radio" name="mc_${ui}_${j}" value="${k}"> ${k+1}. ${esc(c)}</label>`).join("")}<div id="mcRes_${ui}_${j}" class="result"></div></div>`).join("");}
function gradeAll(){
 let correct=0,total=0;
 UNITS.forEach((u,ui)=>{
  u.codes.forEach((c,ci)=>{total++;let user=norm(document.getElementById(`codeAns_${ui}_${ci}`).value),ok=user===norm(c.answer);if(ok)correct++;let r=document.getElementById(`codeRes_${ui}_${ci}`);r.style.display="block";r.innerHTML=`<div>${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'}</div><b>정답 출력</b><pre><code>${esc(c.answer)}</code></pre><b>상세 풀이</b><br>${c.explain}`; });
  u.ox.forEach((o,j)=>{total++;let val=document.getElementById(`ox_${ui}_${j}`).value,ok=val===o[1];if(ok)correct++;let r=document.getElementById(`oxRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'} · 정답: <b>${o[1]}</b><br>${o[2]}`; });
  u.mc.forEach((m,j)=>{total++;let chk=document.querySelector(`input[name="mc_${ui}_${j}"]:checked`),val=chk?Number(chk.value):-1,ok=val===m[2];if(ok)correct++;let r=document.getElementById(`mcRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`${ok?'<span class="correct">정답</span>':'<span class="wrong">오답</span>'} · 정답: <b>${m[2]+1}번</b><br>${m[3]}`; });
 });

}
function showAllSolutions(){UNITS.forEach((u,ui)=>{u.codes.forEach((c,ci)=>{let r=document.getElementById(`codeRes_${ui}_${ci}`);r.style.display="block";r.innerHTML=`<b>정답 출력</b><pre><code>${esc(c.answer)}</code></pre><b>상세 풀이</b><br>${c.explain}`;});u.ox.forEach((o,j)=>{let r=document.getElementById(`oxRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`정답: <b>${o[1]}</b><br>${o[2]}`;});u.mc.forEach((m,j)=>{let r=document.getElementById(`mcRes_${ui}_${j}`);r.style.display="block";r.innerHTML=`정답: <b>${m[2]+1}번</b><br>${m[3]}`;});});}

 let score=Math.round(correct/total*100);lines.splice(4,0,"점수: "+score+"점","정답 수: "+correct+"/"+total);let blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${sid}_${name}_인공지능_${score}점_${stamp}.txt`;a.click();URL.revokeObjectURL(a.href);
}
