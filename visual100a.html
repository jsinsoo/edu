  EXAMPLES.forEach((ex,i)=>{
    const b=document.createElement('button');
    b.className='qbtn'; b.id='nav'+i; b.textContent=ex.no;
    b.onclick=()=>loadExample(i);
    nav.appendChild(b);
  });
}
function updateProgress(){
  let answered=0;
  EXAMPLES.forEach((ex,i)=>{
    const ox=document.querySelector(`input[name="ox${i}"]:checked`);
    const mc=document.querySelector(`input[name="mc${i}"]:checked`);

}

    <div class="answer" id="ans_mc${i}"><b>정답:</b> ${['①','②','③','④','⑤'][ex.mc.a]}<br>${esc(ex.mc.exp)}</div></div>
  <div class="question"><h3>④ 코드 관련 서술형</h3><p><b>문제:</b> ${esc(ex.sub.q)}</p>
    <textarea id="sub${i}" oninput="updateProgress()" placeholder="코드의 인자, 그래프 목적, 해석 방법을 포함하여 서술하세요."></textarea>
    <div class="answer" id="ans_sub${i}"><b>예시 답안 및 상세 풀이:</b><br>${esc(ex.sub.a)}</div></div>
  <div class="topbar"><button class="btn" onclick="prevEx()">← 이전 예제</button><button class="btn" onclick="nextEx()">다음 예제 →</button><button class="btn green" onclick="showCurrentAnswers()">현재 예제 풀이 보기</button></div>`;
  updateProgress();
}
function prevEx(){loadExample((current-1+EXAMPLES.length)%EXAMPLES.length)}
function nextEx(){loadExample((current+1)%EXAMPLES.length)}
function showCurrentAnswers(){['ox','mc','sub'].forEach(t=>document.getElementById(`ans_${t}${current}`)?.classList.add('show'));}
function showAllAnswers(){for(let i=0;i<EXAMPLES.length;i++){['ox','mc','sub'].forEach(t=>document.getElementById(`ans_${t}${i}`)?.classList.add('show'));} alert('현재 열려 있는 예제의 풀이가 표시됩니다. 다른 예제는 번호를 눌러 확인하세요.');}
function grade(){
  let score=0, max=EXAMPLES.length*3, lines=[];
  const sid=document.getElementById('sid').value.trim()||'학번미입력';
  const sname=document.getElementById('sname').value.trim()||'이름미입력';
  lines.push(`학번: ${sid}`); lines.push(`이름: ${sname}`); lines.push(`과목: 데이터시각화`); lines.push(`응시시각: ${new Date().toLocaleString()}`); lines.push('');
  EXAMPLES.forEach((ex,i)=>{
    const ox=document.querySelector(`input[name="ox${i}"]:checked`)?.value||'';
    const mc=document.querySelector(`input[name="mc${i}"]:checked`)?.value;
    const sub=document.getElementById(`sub${i}`)?.value.trim()||'';
    const oxOK=ox===ex.ox.a; const mcOK=String(mc)===String(ex.mc.a); const subOK=sub.length>=15;
    score += (oxOK?1:0)+(mcOK?1:0)+(subOK?1:0);
    lines.push(`[예제 ${ex.no}] ${ex.title}`);
    lines.push(`OX 답안: ${ox||'미응답'} / 정답: ${ex.ox.a} / ${oxOK?'정답':'오답'}`);
    lines.push(`5지선다 답안: ${mc==null?'미응답':['①','②','③','④','⑤'][mc]} / 정답: ${['①','②','③','④','⑤'][ex.mc.a]} / ${mcOK?'정답':'오답'}`);
    lines.push(`서술형 답안: ${sub||'미응답'} / ${subOK?'핵심어 포함으로 1차 인정':'15자 미만 또는 미응답'}`);
    lines.push(`상세 풀이: ${ex.ox.exp} ${ex.mc.exp} ${ex.sub.a}`); lines.push('');
  });
  document.getElementById('result').innerHTML=`<span class="score">점수: ${score} / ${max}</span><br>서술형은 15자 이상 작성 시 1차 자동 인정되며, 교사가 최종 확인할 수 있도록 TXT에 답안과 예시 답안이 저장됩니다.`;
  window._txt=lines.join('\n')+`\n총점: ${score} / ${max}\n`;
  graded=true; return score;
}
function downloadTxt(){
  if(!graded) grade();
  const sid=(document.getElementById('sid').value.trim()||'학번미입력').replace(/[\\/:*?"<>|\s]+/g,'_');
  const sname=(document.getElementById('sname').value.trim()||'이름미입력').replace(/[\\/:*?"<>|\s]+/g,'_');
  const now=new Date(); const ts=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
  const blob=new Blob([window._txt||''],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${sid}_${sname}_데이터시각화_점수_${ts}.txt`; a.click(); URL.revokeObjectURL(a.href);
}
window.addEventListener('DOMContentLoaded',()=>{renderNav();loadExample(0);});
</script></body></html>
